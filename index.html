// ---------- lokale Speicherung (im Browser dieses Geräts) ----------

const STORAGE_PREFIX = "npt:";

function storageGet(key) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw === null ? null : { value: raw };
  } catch (e) { return null; }
}
// ---------- Ausfallsicherung: Spiegel in IndexedDB ----------
// localStorage ist bequem, weil synchron — Safari räumt es auf iOS aber nach längerer Inaktivität
// ab. Für ein Tagebuch mit Monaten an Verlauf ist das zu riskant. Jeder Schreibvorgang wandert
// deshalb zusätzlich in IndexedDB (das überlebt deutlich länger), und beim Start wird von dort
// wiederhergestellt, falls localStorage leer ist. Die App selbst bleibt dabei unverändert
// synchron — der Spiegel läuft nebenher.
const IDB_NAME = "punktetagebuch";
const IDB_STORE = "kv";
function idbOpen() {
  return new Promise((resolve, reject) => {
    try {
      const req = indexedDB.open(IDB_NAME, 1);
      req.onupgradeneeded = () => { req.result.createObjectStore(IDB_STORE); };
      req.onsuccess = () => resolve(req.result);
      req.onerror = () => reject(req.error);
    } catch (e) { reject(e); }
  });
}
function idbPut(key, value) {
  idbOpen().then((db) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put(value, key);
  }).catch(() => {});
}
function idbDelete(key) {
  idbOpen().then((db) => {
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).delete(key);
  }).catch(() => {});
}
function idbReadAll() {
  return idbOpen().then((db) => new Promise((resolve, reject) => {
    const tx = db.transaction(IDB_STORE, "readonly");
    const store = tx.objectStore(IDB_STORE);
    const keysReq = store.getAllKeys();
    const valsReq = store.getAll();
    tx.oncomplete = () => resolve({ keys: keysReq.result || [], values: valsReq.result || [] });
    tx.onerror = () => reject(tx.error);
  }));
}
// Beim Start: liegt lokal nichts (mehr) vor, aber im Spiegel schon, wird zurückgeschrieben.
function restoreFromMirror() {
  let hasLocal = false;
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const full = localStorage.key(i);
      if (full && full.startsWith(STORAGE_PREFIX)) { hasLocal = true; break; }
    }
  } catch (e) { return Promise.resolve(); }
  if (hasLocal) return Promise.resolve();
  return idbReadAll().then(({ keys, values }) => {
    keys.forEach((key, i) => {
      try { localStorage.setItem(STORAGE_PREFIX + key, values[i]); } catch (e) {}
    });
  }).catch(() => {});
}

function storageRemove(key) {
  try { localStorage.removeItem(STORAGE_PREFIX + key); } catch (e) {}
  idbDelete(key);
}
function storageSet(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, value);
    idbPut(key, value);
    return true;
  } catch (e) {
    // Selbst wenn localStorage voll ist oder blockiert: der Spiegel bekommt den Wert trotzdem.
    idbPut(key, value);
    return false;
  }
}
function storageListKeys() {
  const keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const fullKey = localStorage.key(i);
      if (fullKey && fullKey.startsWith(STORAGE_PREFIX)) keys.push(fullKey.slice(STORAGE_PREFIX.length));
    }
  } catch (e) {}
  return keys;
}

// ---------- Hilfsfunktionen ----------

function dateKeyFor(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayKey() { return dateKeyFor(new Date()); }
// ---------- Individuelle Tages-Reset-Zeit ----------
// "Effektiv jetzt" verschiebt die Uhrzeit um die eingestellte Reset-Minute zurück, bevor der
// Kalendertag bestimmt wird. Beispiel: Reset um 02:00 Uhr (=120 Minuten) -> 01:30 Uhr zählt noch
// zum Vortag, 02:30 Uhr zählt schon zum neuen Tag.
function effectiveNow(resetMinutes) {
  const d = new Date();
  if (!resetMinutes) return d;
  return new Date(d.getTime() - resetMinutes * 60000);
}
function effectiveTodayKey(resetMinutes) {
  return dateKeyFor(effectiveNow(resetMinutes));
}
// Summiert die Flexpoint-Überschreitung (Tagespunkte > Tagesbudget inkl. Sportbonus) über eine
// Woche (Montag als Date). Der Tag, der der effektiven "heute"-Grenze entspricht, wird nicht aus
// dem Speicher gelesen (der könnte noch nicht persistiert sein), sondern über liveTodayOverage
// übergeben, damit der Live-Stand aus dem React-State sofort korrekt einfließt.
function computeWeekFlexUsage(mondayDate, resetMinutes, liveTodayOverage) {
  const effToday = effectiveTodayKey(resetMinutes);
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(mondayDate);
    d.setDate(mondayDate.getDate() + i);
    const key = dateKeyFor(d);
    if (key === effToday) {
      total += Math.max(0, liveTodayOverage || 0);
      continue;
    }
    const res = storageGet(`log:${key}`);
    if (res && res.value) {
      try {
        const parsed = JSON.parse(res.value);
        const list = Array.isArray(parsed) ? parsed : parsed.entries || [];
        const dayUsed = list.reduce((s, e) => s + e.points, 0);
        const baseTarget = (!Array.isArray(parsed) && parsed.target) || null;
        const sportBonusDay = (!Array.isArray(parsed) && parsed.sport && parsed.sport.done) ? Number(parsed.sport.bonusPoints) || 0 : 0;
        const dayEffectiveTarget = baseTarget !== null ? baseTarget + sportBonusDay : null;
        if (dayEffectiveTarget !== null) total += Math.max(0, dayUsed - dayEffectiveTarget);
      } catch (e) {}
    }
  }
  return total;
}
function weekKey() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d);
  monday.setDate(diff);
  return dateKeyFor(monday);
}
function round1(x) { return Math.round(x * 10) / 10; }
// Wandelt eine Sport-Zeiteingabe im Format "Std:Min" (z.B. "1:29") in Stunden und Minuten um.
// Ohne Doppelpunkt wird die Zahl als Minuten interpretiert (z.B. "45" -> 0 Std 45 Min).
function parseSportTime(str) {
  const s = (str || "").trim();
  if (!s) return { hours: 0, minutes: 0 };
  if (s.includes(":")) {
    const [h, m] = s.split(":");
    const hours = Math.max(0, Math.floor(Number(h)) || 0);
    const minutes = Math.max(0, Math.min(59, Math.floor(Number(m)) || 0));
    return { hours, minutes };
  }
  const totalMinutes = Math.max(0, Math.floor(Number(s)) || 0);
  return { hours: Math.floor(totalMinutes / 60), minutes: totalMinutes % 60 };
}
// Formatiert Stunden/Minuten zurück in die "Std:Min"-Anzeige, z.B. für das Wiederherstellen eines
// gespeicherten Sport-Eintrags im Eingabefeld.
function formatSportTime(hours, minutes) {
  const h = Number(hours) || 0;
  const m = Number(minutes) || 0;
  if (h === 0 && m === 0) return "";
  return `${h}:${String(m).padStart(2, "0")}`;
}
// Punkte werden auf halbe Schritte gerundet (0,5), nicht mehr nur auf ganze Zahlen — reicht für
// Nährwerte, bei denen ganzzahliges Runden zu ungenau wäre (z.B. 1,5 Punkte statt 1 oder 2).
function roundToHalf(x) { return Math.round(x * 2) / 2; }

// Eindeutige IDs: Date.now() allein kann kollidieren, wenn mehrere Objekte in derselben
// Millisekunde entstehen (die frueheren "+1"/"+2"-Varianten waren nur ein Notbehelf).
// Ein laufender Zaehler haengt eine eindeutige Sequenznummer an den Zeitstempel an.
let idCounter = 0;
function newId() {
  idCounter = (idCounter + 1) % 1000;
  return Date.now() * 1000 + idCounter;
}

// ---------- Tippfehlertolerante Suche ----------
// Levenshtein-Distanz zwischen zwei Strings (Anzahl der Einfüge-/Lösch-/Ersetz-Operationen).
function levenshteinDistance(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const prev = new Array(n + 1);
  const curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
    }
    for (let j = 0; j <= n; j++) prev[j] = curr[j];
  }
  return prev[n];
}
// Bewertet, wie gut ein Suchbegriff zu einem Namen passt. Höher = besser, -1 = kein Treffer.
// Exakte Teilstring-Treffer (v. a. am Wortanfang) werden bevorzugt; Tippfehler werden über
// eine Levenshtein-Distanz auf Wortebene toleriert (Toleranz wächst mit der Suchbegriff-Länge).
function fuzzyMatchScore(query, name) {
  const q = query.toLowerCase().trim();
  const n = name.toLowerCase();
  if (!q) return -1;
  const idx = n.indexOf(q);
  if (idx !== -1) return idx === 0 ? 1000 : 500 - idx;
  const maxDist = q.length <= 4 ? 1 : q.length <= 8 ? 2 : 3;
  const words = n.split(/[\s,()]+/).filter(Boolean);
  let best = Infinity;
  for (const w of words) {
    const wCompare = w.length > q.length + maxDist ? w.slice(0, q.length + maxDist) : w;
    const d = levenshteinDistance(q, wCompare);
    if (d < best) best = d;
  }
  return best <= maxDist ? 100 - best * 10 : -1;
}
// Filtert und sortiert eine Liste von Objekten mit .name nach Suchrelevanz.
function fuzzySearch(query, items, limit) {
  return items
    .map((item) => ({ item, score: fuzzyMatchScore(query, item.name) }))
    .filter((x) => x.score > -1)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit)
    .map((x) => x.item);
}

function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function isoWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const diff = d - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
}

function formatShortDate(d) {
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
}

function calcAgeFromBirthDate(birthDateStr) {
  const birth = new Date(birthDateStr + "T00:00:00");
  if (isNaN(birth.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const hadBirthdayThisYear = today.getMonth() > birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
  if (!hadBirthdayThisYear) age -= 1;
  return age;
}
function effectiveAge(p) {
  if (p.birthDate) {
    const calculated = calcAgeFromBirthDate(p.birthDate);
    if (calculated !== null) return calculated;
  }
  return p.age;
}
function isBirthdayToday(p) {
  if (!p.birthDate) return false;
  const birth = new Date(p.birthDate + "T00:00:00");
  if (isNaN(birth.getTime())) return false;
  const today = new Date();
  return birth.getDate() === today.getDate() && birth.getMonth() === today.getMonth();
}
function formatTableDateLabel(dayKey) {
  const d = new Date(dayKey + "T00:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}

// Gewicht und Groesse duerfen im Profil voruebergehend leer sein (das Feld wird zum Neutippen
// geleert). Fuer die Berechnung wird dann der Standardwert genutzt, statt mit 0 ein unsinniges
// Tagesziel zu erzeugen; die Oberflaeche weist ueber target.incomplete darauf hin.
function profileWeightKg(p) { const w = Number(p && p.weightKg); return w > 0 ? w : DEFAULT_PROFILE.weightKg; }
function profileHeightCm(p) { const h = Number(p && p.heightCm); return h > 0 ? h : DEFAULT_PROFILE.heightCm; }

function calcDailyTarget(p, matrix) {
  let bmrOffset;
  if (p.gender === "mann") bmrOffset = 5;
  else if (p.gender === "frau") bmrOffset = -161;
  else bmrOffset = -78;
  const bmr = 10 * profileWeightKg(p) + 6.25 * profileHeightCm(p) - 5 * effectiveAge(p) + bmrOffset;
  const activityFactorMap = { sitzend: 1.2, stehend: 1.375, gehend: 1.55, schwer: 1.725 };
  const activityFactor = activityFactorMap[p.activity] ?? 1.2;
  const tdee = bmr * activityFactor;
  const deficitFactor = 1 - (Number(p.deficitPercent) || 0) / 100;
  const rawCalorieTarget = tdee * deficitFactor;
  const floorApplied = rawCalorieTarget < 1200;
  const calorieTarget = Math.max(rawCalorieTarget, 1200);
  const total = Math.max(0, Math.round(calorieTarget / matrix.calDiv));
  return { total, bmr: Math.round(bmr), tdee: Math.round(tdee), calorieTarget: Math.round(calorieTarget), floorApplied, incomplete: !(Number(p.weightKg) > 0) || !(Number(p.heightCm) > 0) };
}

function calcFoodPointsRaw(food, matrix) {
  // Grundwert aus Kalorien und Fett.
  const base =
    (Number(food.calories) || 0) / matrix.calDiv +
    (Number(food.fat) || 0) / matrix.fatDiv;
  // Protein und Ballaststoffe senken die Punktzahl (S\u00e4ttigungsbonus) \u2014 aber gedeckelt: Sie d\u00fcrfen
  // zusammen h\u00f6chstens einen bestimmten Anteil des Grundwerts abziehen. Ohne diese Grenze landen
  // sehr proteinreiche Lebensmittel (Garnelen, magerer Fisch, H\u00e4hnchenbrust) fast bei null Punkten,
  // egal wie viele Kalorien sie mitbringen \u2014 ein Kaloriendefizit w\u00e4re so nicht mehr abbildbar.
  const fiberUsed = Math.min(Number(food.fiber) || 0, matrix.fiberCap);
  const bonus = fiberUsed / matrix.fiberDiv + (Number(food.protein) || 0) / matrix.proteinDiv;
  const capPct = matrix.bonusCapPct === undefined || matrix.bonusCapPct === null ? 50 : matrix.bonusCapPct;
  const maxBonus = base * (capPct / 100);
  return base - Math.min(bonus, maxBonus);
}
function calcFoodPoints(food, matrix) {
  return Math.max(0, roundToHalf(calcFoodPointsRaw(food, matrix)));
}

// Sattmacher-Modus: Obst & Gemüse zählen unabhängig von der Menge 0 Punkte (Ausnahme: Lebensmittel
// mit sattmacherExempt, z.B. Avocado wegen des hohen Fettgehalts). Klassische Sattmacher-Beilagen
// (Kategorie "Kohlenhydrat": Reis, Nudeln, Kartoffeln u.ä.) sind auf max. 7 Punkte gedeckelt.
// category/sattmacherExempt kommen vom Lebensmittel-Datenbankeintrag (bei Suche) oder aus dem
// Formular (bei manueller Eingabe eines neuen Lebensmittels). Die "Raw"-Variante (ungerundet) wird
// für die zutatenweise Summierung bei Rezepten gebraucht, damit nicht mehrfach gerundet wird.
function calcFoodPointsWithModeRaw(food, matrix, sattmacherMode, category, sattmacherExempt) {
  const raw = calcFoodPointsRaw(food, matrix);
  if (!sattmacherMode) return raw;
  if ((category === "Obst" || category === "Gemüse") && !sattmacherExempt) return 0;
  if (category === "Kohlenhydrat") return Math.min(raw, 7);
  return raw;
}
function calcFoodPointsWithMode(food, matrix, sattmacherMode, category, sattmacherExempt) {
  return Math.max(0, roundToHalf(calcFoodPointsWithModeRaw(food, matrix, sattmacherMode, category, sattmacherExempt)));
}

// Rezept-Punkte: Statt die Punktzahl aus den zusammengerechneten Gesamtnährwerten zu berechnen,
// wird jede Zutat einzeln (mit ihrer eigenen Kategorie/Sattmacher-Regel) bepunktet und erst danach
// summiert und einmalig gerundet — nur so wirkt der Sattmacher-Modus z.B. auf die Trauben im
// Haferflocken-Rezept, ohne dass Hafer & Trauben zu einem einzigen "Mischwert" verschmelzen.
// consumedAmountG ist die tatsächlich verzehrte Menge (z.B. eine Portion), skaliert proportional.
function calcRecipePoints(recipeFood, consumedAmountG, matrix, sattmacherMode) {
  if (!recipeFood.recipeIngredients || !recipeFood.recipeTotalG) {
    const factor = consumedAmountG / 100;
    return calcFoodPointsWithMode(
      { calories: recipeFood.calories * factor, fat: recipeFood.fat * factor, protein: recipeFood.protein * factor, fiber: recipeFood.fiber * factor },
      matrix, sattmacherMode, recipeFood.category, recipeFood.sattmacherExempt
    );
  }
  const fraction = consumedAmountG / recipeFood.recipeTotalG;
  let rawTotal = 0;
  for (const ing of recipeFood.recipeIngredients) {
    const ingG = (ing.amountG || 0) * fraction;
    const f = ingG / 100;
    rawTotal += calcFoodPointsWithModeRaw(
      { calories: (ing.calories100 || 0) * f, fat: (ing.fat100 || 0) * f, protein: (ing.protein100 || 0) * f, fiber: (ing.fiber100 || 0) * f },
      matrix, sattmacherMode, ing.category, ing.sattmacherExempt
    );
  }
  return Math.max(0, roundToHalf(rawTotal));
}

// Berechnet die Punktzahl eines bereits gespeicherten Eintrags neu — z.B. wenn der Sattmacher-Modus
// umgeschaltet wird. Direkt eingetragene Punkte ("Punkte direkt") bleiben unverändert, da dort keine
// Nährwert-/Kategorie-Basis existiert.
function recalcEntryPoints(entry, matrix, sattmacherMode) {
  if (entry.isDirect) return entry.points;
  if (entry.recipeSnapshot) {
    return calcRecipePoints(entry.recipeSnapshot, entry.recipeSnapshot.recipeTotalG, matrix, sattmacherMode);
  }
  return calcFoodPointsWithMode(
    { calories: entry.calories, fat: entry.fat, protein: entry.protein, fiber: entry.fiber },
    matrix, sattmacherMode, entry.category, entry.sattmacherExempt
  );
}

// Berechnet die Nährstoffverteilung (für Donut-Chart + Kennzahlen) aus einer Liste von Einträgen.
// Wiederverwendet für den "Heute"-Bereich und die Tages-Detailansicht im Verlauf.
// Kohlenhydrate werden, falls nicht direkt erfasst (Basis "Kalorien"), aus der Differenz
// Kalorien - Fett*9 - Protein*4 geschätzt. "Punkte direkt"-Einträge haben keine Nährwerte.
// Formuliert die Wochenzusammenfassung als 2-3 natürliche Sätze statt nüchterner Kennzahlen-Liste.
function buildWeekSummarySentences(weeklyTotal, daysWithData, flexUsed, weeklyFlexTotal, weekAvgWeight, prevAvgWeight, weekAvgWaist, prevAvgWaist) {
  const sentences = [];
  if (daysWithData === 0) {
    sentences.push("Für diese Woche liegen noch keine Einträge vor.");
    return sentences;
  }
  const dayWord = daysWithData === 1 ? "einem Tag" : `${daysWithData} Tagen`;
  if (flexUsed <= 0) {
    sentences.push(`Diese Woche hast du dein Budget an ${dayWord} im Griff gehabt — ${weeklyTotal} Punkte insgesamt, ganz ohne den Flexpuffer anzurühren.`);
  } else if (flexUsed >= weeklyFlexTotal) {
    sentences.push(`Diese Woche war ordentlich was los: ${weeklyTotal} Punkte über ${dayWord}, und dein Wochenpuffer ist komplett aufgebraucht.`);
  } else {
    sentences.push(`Diese Woche kamst du auf ${weeklyTotal} Punkte über ${dayWord} — dabei hast du ${flexUsed} von ${weeklyFlexTotal} Flexpoints genutzt, um dir etwas Luft zu verschaffen.`);
  }
  if (weekAvgWeight !== null) {
    const diff = prevAvgWeight !== null ? round1(weekAvgWeight - prevAvgWeight) : null;
    if (diff === null) {
      sentences.push(`Dein Gewichtsschnitt liegt diese Woche bei ${weekAvgWeight} kg — für einen Vergleich fehlt noch eine Vorwoche.`);
    } else if (diff <= -0.1) {
      sentences.push(`Beim Gewicht ging's im Schnitt ${Math.abs(diff)} kg nach unten gegenüber der Vorwoche — weiter so!`);
    } else if (diff >= 0.1) {
      sentences.push(`Beim Gewicht lag der Schnitt diese Woche ${diff} kg höher als in der Vorwoche.`);
    } else {
      sentences.push(`Dein Gewicht ist im Vergleich zur Vorwoche stabil geblieben (Ø ${weekAvgWeight} kg).`);
    }
  }
  if (weekAvgWaist !== null) {
    const diff = prevAvgWaist !== null ? round1(weekAvgWaist - prevAvgWaist) : null;
    if (diff === null) {
      sentences.push(`Beim Bauchumfang liegt der Schnitt diese Woche bei ${weekAvgWaist} cm — für einen Vergleich fehlt noch eine Vorwoche.`);
    } else if (diff <= -0.2) {
      sentences.push(`Der Bauchumfang ist im Schnitt um ${Math.abs(diff)} cm zurückgegangen — schön zu sehen!`);
    } else if (diff >= 0.2) {
      sentences.push(`Der Bauchumfang lag diese Woche im Schnitt ${diff} cm höher als in der Vorwoche.`);
    } else {
      sentences.push(`Der Bauchumfang ist im Vergleich zur Vorwoche stabil geblieben (Ø ${weekAvgWaist} cm).`);
    }
  }
  return sentences;
}

// Summiert die Gramm-Menge an Obst & Gemüse aus einer Liste von Einträgen — berücksichtigt sowohl
// normale Einträge (category direkt am Eintrag) als auch Rezepte (category je Zutat im Snapshot).
function computeFruitVegGrams(entriesList) {
  let total = 0;
  for (const e of entriesList) {
    if (e.isDirect) continue;
    if (e.recipeSnapshot && e.recipeSnapshot.recipeIngredients) {
      for (const ing of e.recipeSnapshot.recipeIngredients) {
        if (ing.category === "Obst" || ing.category === "Gemüse") total += ing.amountG || 0;
      }
    } else if (e.category === "Obst" || e.category === "Gemüse") {
      total += Number(e.amountG) || 0;
    }
  }
  return total;
}

// Summiert die Flüssigkeitsmenge (ml, 1:1 mit Gramm angenähert) aus den heutigen Getränke-Einträgen —
// nur Getränke, die laut DGE zum Flüssigkeitsbedarf zählen (Wasser, ungesüßter Tee, Kaffee in Maßen,
// verdünnte Saftschorlen). Alkohol, pure Säfte, Milch und zuckerhaltige Softdrinks zählen bewusst
// nicht mit, auch wenn sie als Getränk geloggt werden.
function computeFluidMl(entriesList) {
  let total = 0;
  for (const e of entriesList) {
    if (e.isDirect) continue;
    if (e.category === "Getränk" && e.countsToFluid) total += Number(e.amountG) || 0;
  }
  return total;
}

function computeMacroBreakdown(entriesList) {
  const macroEntries = entriesList.filter((e) => !e.isDirect);
  const totals = macroEntries.reduce(
    (acc, e) => {
      const calories = Number(e.calories) || 0;
      const fat = Number(e.fat) || 0;
      const protein = Number(e.protein) || 0;
      const fiber = Number(e.fiber) || 0;
      const carbs = e.carbs !== null && e.carbs !== undefined ? Number(e.carbs) || 0 : Math.max(0, round1((calories - fat * 9 - protein * 4) / 4));
      return { calories: acc.calories + calories, fat: acc.fat + fat, protein: acc.protein + protein, fiber: acc.fiber + fiber, carbs: acc.carbs + carbs };
    },
    { calories: 0, fat: 0, protein: 0, fiber: 0, carbs: 0 }
  );
  const directCount = entriesList.length - macroEntries.length;
  const kcalTotal = totals.protein * 4 + totals.fat * 9 + totals.carbs * 4;
  const shares = kcalTotal > 0
    ? { protein: (totals.protein * 4) / kcalTotal, fat: (totals.fat * 9) / kcalTotal, carbs: (totals.carbs * 4) / kcalTotal }
    : { protein: 0, fat: 0, carbs: 0 };
  const r = 46;
  const c = 2 * Math.PI * r;
  let cumulativeLen = 0;
  // Standard-Technik für mehrfarbige SVG-Ringsegmente: dasharray "Segmentlänge Restlänge" (nicht
  // die volle Kreislänge als Lücke!) und dashoffset als NEGATIVE, aufsummierte Länge der bereits
  // platzierten Segmente. Die vorherige Formel (Lücke = volle Kreislänge, positiver Offset) hat
  // rechnerisch dazu geführt, dass spätere Segmente (v. a. Protein) im Kreis praktisch unsichtbar
  // wurden statt am richtigen Platz zu erscheinen.
  const segments = [
    { key: "carbs", label: "Kohlenhydrate", grams: round1(totals.carbs), share: shares.carbs, colorVar: "--amber" },
    { key: "fat", label: "Fett", grams: round1(totals.fat), share: shares.fat, colorVar: "--coral" },
    { key: "protein", label: "Protein", grams: round1(totals.protein), share: shares.protein, colorVar: "--teal" },
  ].map((seg) => {
    const segLen = c * seg.share;
    const dashOffset = -cumulativeLen;
    cumulativeLen += segLen;
    return { ...seg, dashArray: `${segLen} ${c - segLen}`, dashOffset };
  });
  return { totals, directCount, kcalTotal, shares, segments, r, c };
}

function dayStatus(used, target) {
  if (used === null || !target) return { ratio: 0, color: "var(--line)" };
  const ratio = target > 0 ? used / target : 0;
  // Gleiche Ampel-Schwellen wie der Tagesring im "Heute"-Bereich: Drittel des Tagesbudgets.
  const color = ratio <= 1 / 3 ? "var(--good)" : ratio <= 2 / 3 ? "var(--warn)" : "var(--bad)";
  return { ratio, color };
}

// Berechnet eine Achsen-Domäne, die sich an den tatsächlichen Datenwerten orientiert (nicht an
// Ziel-/Prognoselinien), mit Puffer nach oben UND unten, damit Schwankungen gut ablesbar sind.
// Berechnet das tatsächliche Kaloriendefizit eines Tages relativ zum Gesamtumsatz (TDEE) — nicht
// relativ zum bereits um das eingestellte Defizit reduzierten Punktebudget. 0% bedeutet: exakt so
// viel gegessen wie der Gesamtumsatz (kein Defizit). Wird das Punktebudget voll ausgeschöpft, landet
// man exakt beim eingestellten Defizit (z.B. -20%). Bleiben Punkte übrig, wird das Defizit größer
// (negativer); werden mehr Punkte verbraucht (Flex), wird es kleiner. Rückgabe ist negativ für ein
// tatsächliches Defizit (Konvention: 0% oben in der Grafik, Defizit geht nach unten ins Negative).
function computeDayDeficitPercent(pointsUsed, dayEffectiveTarget, configuredDeficitPercent) {
  if (pointsUsed === null || pointsUsed === undefined || !dayEffectiveTarget) return null;
  const configuredFraction = (Number(configuredDeficitPercent) || 0) / 100;
  const fractionUsed = pointsUsed / dayEffectiveTarget;
  const actualDeficitFraction = 1 - fractionUsed + configuredFraction * fractionUsed;
  return round1(-actualDeficitFraction * 100);
}

function computeAxisDomain(values, paddingRatio, minPadding, floorAtZero) {
  const nums = values.filter((v) => v !== null && v !== undefined && !isNaN(v));
  if (nums.length === 0) return [null, null];
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const range = max - min;
  const pad = Math.max(minPadding, range * paddingRatio, Math.abs(max) * 0.02);
  let lo = round1(min - pad);
  let hi = round1(max + pad);
  if (floorAtZero && lo < 0) lo = 0;
  return [lo, hi];
}

// Wendet einen manuellen Zoom-Faktor auf eine bereits berechnete Achsen-Domäne an.
// zoomFactor 1 = unverändert (automatische Skalierung). <1 = reinzoomen, >1 = rauszoomen.
// Zoomt symmetrisch um den Mittelpunkt der aktuellen Domäne, begrenzt aber nach innen so,
// dass die eigentlichen Rohdaten (plus 5% Puffer) nie komplett aus dem Bild rutschen.
function applyZoomToDomain(domain, rawValues, zoomFactor) {
  if (domain[0] === null || zoomFactor === 1) return domain;
  const nums = rawValues.filter((v) => v !== null && v !== undefined && !isNaN(v));
  const center = (domain[0] + domain[1]) / 2;
  const autoHalfRange = (domain[1] - domain[0]) / 2;
  let minHalfRange = autoHalfRange * 0.15;
  if (nums.length > 0) {
    const dataMin = Math.min(...nums);
    const dataMax = Math.max(...nums);
    const dataHalfRange = ((dataMax - dataMin) / 2) * 1.05;
    if (dataHalfRange > 0) minHalfRange = Math.max(minHalfRange, dataHalfRange);
  }
  const targetHalfRange = Math.max(autoHalfRange * zoomFactor, minHalfRange);
  return [round1(center - targetHalfRange), round1(center + targetHalfRange)];
}

// Trendprognose: lineare Regression über die 7-Tage-geglätteten Werte der letzten 4 Wochen.
// Verlässlichkeits-Mindestanforderung: mind. MIN_TREND_MEASUREMENTS echte Messungen, die
// mind. MIN_TREND_SPAN_DAYS Tage auseinanderliegen (siehe Konstanten oben) — statt starr an der
// Anzahl geglätteter Tage zu hängen, wie es hier vorher der Fall war.
function computeLinearTrend(log, valueKey, targetValue) {
  if (log.length === 0) return { insufficientData: true };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const windowDays = TREND_WINDOW_DAYS;
  const totalDays = windowDays + 7;
  const dailyMap = {};
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = dateKeyFor(d);
    const entries = log.filter((w) => dateKeyFor(new Date(w.timestamp)) === key);
    dailyMap[key] = entries.length > 0 ? entries.reduce((s, w) => s + w[valueKey], 0) / entries.length : null;
  }
  function maFor(targetDate) {
    const vals = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(targetDate);
      d.setDate(d.getDate() - i);
      const v = dailyMap[dateKeyFor(d)];
      if (v !== null && v !== undefined) vals.push(v);
    }
    return vals.length > 0 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }

  // Verlässlichkeits-Check auf Basis der tatsächlichen (nicht geglätteten) Messungen im Fenster.
  const windowStart = new Date(today);
  windowStart.setDate(windowStart.getDate() - (windowDays - 1));
  const measuredDayKeys = new Set(
    log
      .map((w) => new Date(w.timestamp))
      .filter((d) => d >= windowStart && d <= today)
      .map((d) => dateKeyFor(d))
  );
  if (measuredDayKeys.size < MIN_TREND_MEASUREMENTS) return { insufficientData: true };
  const sortedKeys = [...measuredDayKeys].sort();
  const spanDays = Math.round((new Date(sortedKeys[sortedKeys.length - 1] + "T00:00:00") - new Date(sortedKeys[0] + "T00:00:00")) / 86400000);
  if (spanDays < MIN_TREND_SPAN_DAYS) return { insufficientData: true };

  const regressionPoints = [];
  for (let i = windowDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ma = maFor(d);
    if (ma !== null) regressionPoints.push({ x: windowDays - 1 - i, y: ma });
  }
  if (regressionPoints.length === 0) return { insufficientData: true };

  const n = regressionPoints.length;
  const sumX = regressionPoints.reduce((s, p) => s + p.x, 0);
  const sumY = regressionPoints.reduce((s, p) => s + p.y, 0);
  const sumXY = regressionPoints.reduce((s, p) => s + p.x * p.y, 0);
  const sumX2 = regressionPoints.reduce((s, p) => s + p.x * p.x, 0);
  const denom = n * sumX2 - sumX * sumX;
  if (denom === 0) return { insufficientData: true };
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  const todayX = windowDays - 1;
  const predictedToday = slope * todayX + intercept;
  const meaningfulSlope = Math.abs(slope) > 0.01 / 7;

  let targetDate = null;
  let daysToTarget = null;
  if (targetValue && meaningfulSlope) {
    const xTarget = (targetValue - intercept) / slope;
    const dt = Math.round(xTarget - todayX);
    if (dt > 0) {
      daysToTarget = dt;
      targetDate = new Date(today);
      targetDate.setDate(targetDate.getDate() + dt);
    }
  }

  let status;
  if (targetValue && Math.abs(predictedToday - targetValue) < 0.3) status = "reached";
  else if (!meaningfulSlope) status = "no_trend";
  else if (targetValue && daysToTarget === null) status = "wrong_direction";
  else status = "on_track";

  return {
    insufficientData: false,
    slope,
    slopePerWeek: round1(slope * 7),
    predictedToday: round1(predictedToday),
    targetDate,
    daysToTarget,
    status,
  };
}
function computeWeightTrend(weightLog, targetWeightKg) {
  return computeLinearTrend(weightLog, "weightKg", targetWeightKg);
}
function computeWaistTrend(waistLog, targetWaistCm) {
  return computeLinearTrend(waistLog, "waistCm", targetWaistCm);
}

// Automatisches Thema: folgt der Systemeinstellung (hell/dunkel). "system" ist kein eigenes
// Farbschema, sondern verweist je nach Systemzustand auf eines der vorhandenen.
const AUTO_THEME_ID = "auto";
const AUTO_THEME_DARK = "dark";
const AUTO_THEME_LIGHT = "paper";
function prefersDarkScheme() {
  try { return window.matchMedia && window.matchMedia("(prefers-color-scheme: dark)").matches; } catch (e) { return true; }
}
function resolveThemeId(id, systemDark) {
  if (id !== AUTO_THEME_ID) return id;
  return systemDark ? AUTO_THEME_DARK : AUTO_THEME_LIGHT;
}

const THEMES = [

// ---------- Alltagseinheiten (Rezeptbaukasten) & Flüssigkeitseinheiten ----------
// Generischer Fallback in Gramm, falls ein Lebensmittel keine eigene units-Angabe hat.
// Richtwerte für gestrichene Löffel bei "durchschnittlicher" Dichte; bewusst grobe Näherung.
const UNIT_DEFAULTS_G = { TL: 5, EL: 15, Tasse: 200, Prise: 0.5, Scheibe: 25, Stück: 100 };
const RECIPE_UNITS = ["g", "ml", "l", "TL", "EL", "Tasse", "Prise", "Scheibe", "Stück"];
// Rechnet eine Menge in einer beliebigen Einheit in Gramm um. Für ml/l wird vereinfachend
// 1 ml = 1 g angenommen (siehe Recherche: gilt gut für wässrige Lebensmittel/Getränke, bei sehr
// fett- oder zuckerreichen Flüssigkeiten leichte Abweichung, bewusst in Kauf genommen).
function resolveAmountToGrams(food, amount, unit) {
  const amt = Number(amount) || 0;
  if (unit === "g" || unit === "ml") return amt;
  if (unit === "l") return amt * 1000;
  const perUnit = (food && food.units && food.units[unit] !== undefined) ? food.units[unit] : UNIT_DEFAULTS_G[unit];
  return amt * (perUnit || 0);
}
// Kehrfunktion zu resolveAmountToGrams — rechnet Gramm zurück in die Menge einer Einheit, damit
// beim Wechsel der Einheit (z.B. von "g" zu "EL") ein sinnvoller, umgerechneter Wert angezeigt wird.
// Beim Wechsel der Einheit: Gewichts- und Volumenangaben lassen sich sinnvoll ineinander
// umrechnen (100 g bleiben 100 ml bzw. 0,1 l). Bei Stück-Einheiten wie Teelöffel, Scheibe oder
// Stück ist die Umrechnung dagegen unbrauchbar: Aus 100 g Leinsamen würden 20 Teelöffel, und wer
// von Gramm auf Teelöffel umstellt, meint fast immer einen. Deshalb wird dort auf 1 gesetzt.
const SCALE_UNITS = ["g", "ml", "l"];
function amountValueForNewUnit(food, grams, unit) {
  if (SCALE_UNITS.includes(unit)) return resolveGramsToUnitAmount(food, grams, unit);
  return 1;
}

function resolveGramsToUnitAmount(food, grams, unit) {
  const g = Number(grams) || 0;
  if (unit === "g" || unit === "ml") return round1(g);
  if (unit === "l") return round1(g / 1000);
  const perUnit = (food && food.units && food.units[unit] !== undefined) ? food.units[unit] : UNIT_DEFAULTS_G[unit];
  return perUnit ? round1(g / perUnit) : 0;
}

// Liefert Fisher-Yates-gemischte Indizes einer Länge n (für die Rotation ohne Wiederholung).
function shuffledFactIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
// Ein Fakt pro Tag, persistiert über eine gemischte Reihenfolge + Zeiger. Erst wenn alle Fakten
// einmal dran waren, wird neu gemischt — so wiederholt sich innerhalb eines Zyklus nichts.
function getDailyFact(resetMinutes) {
  const todayKey = effectiveTodayKey(resetMinutes);
  let order = null, pointer = 0, lastDay = null;
  const res = storageGet("dailyFactState");
  if (res && res.value) {
    try {
      const parsed = JSON.parse(res.value);
      order = Array.isArray(parsed.order) ? parsed.order : null;
      pointer = Number(parsed.pointer) || 0;
      lastDay = parsed.lastDay || null;
    } catch (e) {}
  }
  if (!order || order.length !== NUTRITION_FACTS.length) {
    order = shuffledFactIndices(NUTRITION_FACTS.length);
    pointer = 0;
    lastDay = null;
  }
  if (lastDay === null) {
    lastDay = todayKey;
    storageSet("dailyFactState", JSON.stringify({ order, pointer, lastDay }));
  } else if (lastDay !== todayKey) {
    pointer += 1;
    if (pointer >= order.length) {
      order = shuffledFactIndices(NUTRITION_FACTS.length);
      pointer = 0;
    }
    lastDay = todayKey;
    storageSet("dailyFactState", JSON.stringify({ order, pointer, lastDay }));
  }
  return NUTRITION_FACTS[order[pointer]];
}

// Zählt einen Zahlenwert weich hoch bzw. runter, statt ihn springen zu lassen.
function useCountUp(target, duration) {
  const [display, setDisplay] = useState(Number(target) || 0);
  const fromRef = useRef(Number(target) || 0);
  const rafRef = useRef(null);
  useEffect(() => {
    const from = fromRef.current;
    const to = Number(target) || 0;
    if (from === to) return;
    const ms = duration || 450;
    const startedAt = (typeof performance !== "undefined" ? performance.now() : Date.now());
    function step(now) {
      const elapsed = (now || Date.now()) - startedAt;
      const t = Math.min(1, elapsed / ms);
      const eased = 1 - Math.pow(1 - t, 3);
      const value = from + (to - from) * eased;
      setDisplay(Math.abs(to - from) < 10 ? round1(value) : Math.round(value));
      if (t < 1) rafRef.current = requestAnimationFrame(step);
      else { fromRef.current = to; setDisplay(to); }
    }
    rafRef.current = requestAnimationFrame(step);
    return () => {
      if (rafRef.current) cancelAnimationFrame(rafRef.current);
      fromRef.current = to;
    };
  }, [target, duration]);
  return display;
}

// ---------- Mahlzeiten ----------
// Jeder Eintrag gehört zu einer Mahlzeit. Das strukturiert die Tagesliste (statt einer einzigen
// langen Aufzählung) und zeigt, wie sich die Punkte über den Tag verteilen. Getränke bilden eine
// eigene Gruppe — sie ergeben sich aus der Kategorie und brauchen keine Zuordnung.
// Jede Mahlzeit bekommt eine eigene Farbe. Bewusst feste Farbwerte statt der Theme-Variablen:
// Sie müssen auf hellen wie dunklen Schemata lesbar bleiben und dürfen nicht mit den Ampelfarben
// (--good/--warn/--bad) verwechselt werden, die eine Bedeutung tragen.
const MEAL_COLORS = {
  fruehstueck: "#e0a458",
  mittag: "#5fb3a3",
  snack: "#c98bb9",
  abend: "#7c9ede",
  getraenke: "#6bb8d6",
  weitere: "#9aa0a8",
};

const MEALS = [
  { id: "fruehstueck", short: "Frühstück", label: "Frühstück" },
  { id: "mittag", short: "Mittag", label: "Mittagessen" },
  { id: "snack", short: "Snack", label: "Snack" },
  { id: "abend", short: "Abend", label: "Abendessen" },
];
// Vorauswahl nach Uhrzeit — wer um 8 Uhr etwas einträgt, meint fast immer das Frühstück.
function defaultMealForNow(date) {
  const d = date || new Date();
  const mins = d.getHours() * 60 + d.getMinutes();
  if (mins < 10 * 60 + 30) return "fruehstueck";
  if (mins < 15 * 60) return "mittag";
  if (mins < 17 * 60 + 30) return "snack";
  return "abend";
}
function isDrinkEntry(e) { return !e.isDirect && e.category === "Getränk"; }
// Gruppiert eine Tagesliste in Abschnitte. Einträge aus der Zeit vor den Mahlzeiten (oder solche
// ohne Zuordnung) landen gesammelt in "Weitere", damit nichts verschwindet.
function groupEntriesByMeal(list) {
  const groups = [];
  for (const meal of MEALS) {
    const items = list.filter((e) => !isDrinkEntry(e) && e.meal === meal.id);
    if (items.length > 0) groups.push({ id: meal.id, label: meal.label, items, color: MEAL_COLORS[meal.id] });
  }
  const drinks = list.filter(isDrinkEntry);
  if (drinks.length > 0) groups.push({ id: "getraenke", label: "Getränke", items: drinks, color: MEAL_COLORS.getraenke });
  const rest = list.filter((e) => !isDrinkEntry(e) && !MEALS.some((m) => m.id === e.meal));
  if (rest.length > 0) groups.push({ id: "weitere", label: "Weitere", items: rest, color: MEAL_COLORS.weitere });
  return groups;
}
// Fasst gleichartige Einträge einer Gruppe zusammen — fünf Gläser Wasser stehen dann als eine
// Zeile mit "× 5" statt als fünf identische Zeilen. Bearbeiten und Löschen wirken auf den zuletzt
// hinzugefügten Eintrag der Zeile.
function mergeSimilarEntries(items) {
  const out = [];
  for (const e of items) {
    const key = `${e.name}|${e.amountG}|${e.points}|${e.isDirect ? 1 : 0}`;
    const found = out.find((o) => o.key === key);
    if (found) {
      found.count += 1;
      found.points = round1(found.points + e.points);
      found.entries.push(e);
    } else {
      out.push({ key, count: 1, points: e.points, entries: [e], sample: e });
    }
  }
  return out;
}

// Beschreibungszeile unter dem Namen eines Eintrags. "full" zeigt zusätzlich die Makros.
function entryMetaText(e, full) {
  if (e.isDirect) return "Direkt eingetragen";
  const amount = e.amountG ? `${round1(e.amountG)} ${isDrinkEntry(e) ? "ml" : "g"} · ` : "";
  const base = e.calcBasis === "kohlenhydrate"
    ? `≈ ${e.calories} kcal (aus ${e.carbs} g Kohlenhydrate)`
    : `${e.calories} kcal`;
  if (!full) return `${amount}${base}`;
  return `${amount}${base} · ${e.fat} g Fett · ${e.protein} g Protein${e.fiber ? ` · ${e.fiber} g Ballaststoffe` : ""}`;
}

  useEffect(() => {

        if (parsed.profile && parsed.profile.dayResetMinutes) resetMinutesFromSettings = Number(parsed.profile.dayResetMinutes) || 0;
        if (parsed.matrix) setMatrix((prev) => ({ ...prev, ...parsed.matrix }));
        if (parsed.chartPrefs) {
          if (typeof parsed.chartPrefs.showWeightLine === "boolean") setShowWeightLine(parsed.chartPrefs.showWeightLine);
          if (typeof parsed.chartPrefs.showTrendLine === "boolean") setShowTrendLine(parsed.chartPrefs.showTrendLine);
          if (typeof parsed.chartPrefs.showWaistLine === "boolean") setShowWaistLine(parsed.chartPrefs.showWaistLine);
          if (typeof parsed.chartPrefs.waistEnabled === "boolean") setWaistEnabled(parsed.chartPrefs.waistEnabled);
          if (typeof parsed.chartPrefs.showDeficitLine === "boolean") setShowDeficitLine(parsed.chartPrefs.showDeficitLine);
        }
        if (parsed.uiPrefs) {
          if (parsed.uiPrefs.themeId) setThemeId(parsed.uiPrefs.themeId);
          if (parsed.uiPrefs.fontId) setFontId(parsed.uiPrefs.fontId);
        }
      } catch (e) {}
    }
    // Aufräumen: Getränke sind jetzt normale Einträge, der alte Wasser-Log wird nicht mehr gelesen.
    storageRemove("waterLog");
    const cel = storageGet("celebratedDay");
    if (cel && cel.value) setCelebratedDay(cel.value);
    const fd = storageGet("factDismissed");

    setActiveDayKey(effectiveTodayKey(resetMinutesFromSettings));
    const l = storageGet(`log:${effectiveTodayKey(resetMinutesFromSettings)}`);
    if (l && l.value) {
      try {
        const parsed = JSON.parse(l.value);
        setEntries(Array.isArray(parsed) ? parsed : parsed.entries || []);
        if (!Array.isArray(parsed) && parsed.sport) {
          setSportDone(!!parsed.sport.done);
          if (parsed.sport.intensity) setSportIntensity(parsed.sport.intensity);
          setSportTimeInput(formatSportTime(parsed.sport.hours, parsed.sport.minutes));
        }
      } catch (e) {}
    }
    const cd = storageGet("customDishes");
    if (cd && cd.value) {
      try { setCustomDishes(JSON.parse(cd.value)); } catch (e) {}
    }
    const cf = storageGet("customFoods");
    if (cf && cf.value) {
      try { setCustomFoods(JSON.parse(cf.value)); } catch (e) {}
    }
    const wl = storageGet("weightLog");

  useEffect(() => {
    if (!loaded) return;
    setDailyFact(getDailyFact(profile.dayResetMinutes || 0));
  }, [loaded, profile.dayResetMinutes]);

  // Beim Umschalten des Sattmacher-Modus (an oder aus) werden die HEUTIGEN Einträge einmalig mit
  // der jeweils neu geltenden Logik neu berechnet — vergangene Tage bleiben unangetastet, da deren
  // Punktzahl (wie überall sonst in der App) zum Zeitpunkt des Eintragens endgültig feststeht.
  // Wichtig: nur bei einem echten Umschalten, nicht schon beim ersten Laden der gespeicherten
  // Einstellung — sonst würden heutige Einträge bei jedem App-Start mit der aktuellen Matrix neu
  // bepunktet, obwohl ihre Punktzahl zum Zeitpunkt des Eintragens feststehen soll.
  const sattmacherSeenRef = useRef(null);
  useEffect(() => {
    if (!loaded) return;
    if (sattmacherSeenRef.current === null) { sattmacherSeenRef.current = !!profile.sattmacherMode; return; }
    if (sattmacherSeenRef.current === !!profile.sattmacherMode) return;
    sattmacherSeenRef.current = !!profile.sattmacherMode;
    setEntries((prev) => prev.map((e) => ({ ...e, points: recalcEntryPoints(e, matrix, profile.sattmacherMode) })));
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded, profile.sattmacherMode]);

  useEffect(() => {
    if (loaded) setTargetWeightInput(profile.targetWeightKg ? String(profile.targetWeightKg) : "");
    if (loaded) setTargetWaistInput(profile.targetWaistCm ? String(profile.targetWaistCm) : "");
    if (loaded && waistLog.length > 0) setWaistEnabled(true);
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [loaded]);

  useEffect(() => {
    if (!loaded) return;
    const ok = storageSet("settings", JSON.stringify({ profile, matrix, chartPrefs: { showWeightLine, showTrendLine, showWaistLine, waistEnabled, showDeficitLine }, uiPrefs: { themeId, fontId } }));
    setSaveError(!ok);
  }, [profile, matrix, showWeightLine, showTrendLine, showWaistLine, waistEnabled, showDeficitLine, themeId, fontId, loaded]);

  // Tageswechsel zur Laufzeit: Als PWA bleibt die App oft über Mitternacht (bzw. über die
  // eingestellte Reset-Zeit) hinweg geöffnet. Ohne diese Prüfung liefen die Einträge des alten
  // Tages weiter und würden beim nächsten Speichern unter dem neuen Datum landen.
  useEffect(() => {
    if (!loaded) return;
    function checkDayRollover() {
      const key = effectiveTodayKey(profile.dayResetMinutes || 0);
      if (key === activeDayKey) return;
      let nextEntries = [];
      let nextSport = null;
      const res = storageGet(`log:${key}`);
      if (res && res.value) {
        try {
          const parsed = JSON.parse(res.value);
          nextEntries = Array.isArray(parsed) ? parsed : parsed.entries || [];
          nextSport = !Array.isArray(parsed) && parsed.sport ? parsed.sport : null;
        } catch (e) {}
      }
      setEntries(nextEntries);
      setSportDone(nextSport ? !!nextSport.done : false);
      setSportIntensity(nextSport && nextSport.intensity ? nextSport.intensity : 5);
      setSportTimeInput(nextSport ? formatSportTime(nextSport.hours, nextSport.minutes) : "");
      setExpandedHistoryDay(null);
      setHistoryWeekMonday(mondayOf(effectiveNow(profile.dayResetMinutes || 0)));
      setActiveDayKey(key);
      setDataRevision((n) => n + 1);
    }
    checkDayRollover();
    const interval = setInterval(checkDayRollover, 30000);
    function handleVisibility() { if (!document.hidden) checkDayRollover(); }
    document.addEventListener("visibilitychange", handleVisibility);
    window.addEventListener("focus", checkDayRollover);
    return () => {
      clearInterval(interval);
      document.removeEventListener("visibilitychange", handleVisibility);
      window.removeEventListener("focus", checkDayRollover);
    };
  }, [loaded, activeDayKey, profile.dayResetMinutes]);

  const target = calcDailyTarget(profile, matrix);
  const trend = useMemo(
    () => computeWeightTrend(weightLog, Number(profile.targetWeightKg) || null),
    [weightLog, profile.targetWeightKg]
  );
  const waistTrend = useMemo(
    () => computeWaistTrend(waistLog, Number(profile.targetWaistCm) || null),
    [waistLog, profile.targetWaistCm]
  );
  // Bei "auto" entscheidet die Systemeinstellung, welches der vorhandenen Schemata gilt.
  const effectiveThemeId = resolveThemeId(themeId, systemDark);
  const currentTheme = useMemo(() => THEMES.find((t) => t.id === effectiveThemeId) || THEMES[0], [effectiveThemeId]);
  const bothSizesShown = showWeightLine && waistEnabled && showWaistLine;
  const weightRawValues = weightChartData.flatMap((d) => [d.weightKg, d.weightMA]);
  const waistRawValues = weightChartData.flatMap((d) => [d.waistCm, d.waistMA]);
  const deficitRawValues = weightChartData.map((d) => d.deficitPercent);
  // Die Achsen-Domänen werden gememoisiert: als bei jedem Render neu erzeugte Arrays wären sie
  // referenziell immer "neu" und würden das Diagramm bei jeder Kleinigkeit (Tastendruck, Toggle)
  // komplett zerstören und neu aufbauen lassen.
  const { weightDomain, waistDomain, deficitDomain } = useMemo(() => {
    const weightValues = [...weightRawValues];
    if (showWeightTarget && profile.targetWeightKg) weightValues.push(Number(profile.targetWeightKg));
    let wDomain = computeAxisDomain(weightValues, 0.15, weightViewMode === "monat" ? 0.8 : 1.5, false);
    const waistValues = [...waistRawValues];
    if (showWaistTarget && profile.targetWaistCm) waistValues.push(Number(profile.targetWaistCm));
    let waDomain = computeAxisDomain(waistValues, 0.15, weightViewMode === "monat" ? 0.8 : 1.5, false);
    if (bothSizesShown && wDomain[0] !== null) {
      const range = wDomain[1] - wDomain[0];
      wDomain = [round1(wDomain[0] - range * 0.45), wDomain[1]];
    }
    if (bothSizesShown && waDomain[0] !== null) {
      const range = waDomain[1] - waDomain[0];
      waDomain = [waDomain[0], round1(waDomain[1] + range * 0.45)];
    }
    wDomain = applyZoomToDomain(wDomain, weightRawValues, weightZoom);
    waDomain = applyZoomToDomain(waDomain, waistRawValues, waistZoom);
    const deficitValues = [...deficitRawValues];
    if (showDeficitTarget) deficitValues.push(-(Number(profile.deficitPercent) || 0));
    let dDomain = computeAxisDomain(deficitValues, 0.2, 5, false);
    // Die y-Achse zeigt negative Werte (0% oben = kein Defizit, negativ = im Defizit, je tiefer
    // desto größer das Defizit). Die obere Grenze wird daher auf mindestens 0% fixiert. Nur an
    // einem Tag mit echtem Kalorienüberschuss darf sie darüber hinausgehen.
    if (dDomain[1] !== null && dDomain[1] < 0) dDomain = [dDomain[0], 0];
    dDomain = applyZoomToDomain(dDomain, deficitRawValues, deficitZoom);
    return { weightDomain: wDomain, waistDomain: waDomain, deficitDomain: dDomain };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [weightChartData, bothSizesShown, weightViewMode, showWeightTarget, profile.targetWeightKg,
      showWaistTarget, profile.targetWaistCm, showDeficitTarget, profile.deficitPercent,
      weightZoom, waistZoom, deficitZoom]);

  const { hours: sportHoursParsed, minutes: sportMinutesParsed } = parseSportTime(sportTimeInput);
  const sportDurationHours = sportHoursParsed + sportMinutesParsed / 60;
  const sportMet = METS_BY_INTENSITY[Math.min(Math.max(sportIntensity, 1), 10) - 1];
  const caloriesBurned = sportDone ? Math.round(sportMet * profileWeightKg(profile) * sportDurationHours) : 0;
  const sportBonus = sportDone ? Math.max(0, Math.round((caloriesBurned * (matrix.sportFactor ?? 0.5)) / matrix.calDiv)) : 0;
  // Vorschauwerte für das Sport-Formular: Sie hängen bewusst NICHT an sportDone, weil der Sport dort
  // ja erst erfasst wird — sonst bliebe die Kalorienvorschau beim Neuanlegen immer leer.
  const caloriesBurnedPreview = Math.round(sportMet * profileWeightKg(profile) * sportDurationHours);
  const sportBonusPreview = Math.max(0, Math.round((caloriesBurnedPreview * (matrix.sportFactor ?? 0.5)) / matrix.calDiv));
  const used = entries.reduce((sum, e) => sum + e.points, 0);
  const effectiveTarget = target.total + sportBonus;

  // ---------- Nährstoffverteilung & Coach-Tipps (Heute-Bereich) ----------
  const todayMacro = computeMacroBreakdown(entries);
  const macroTotals = todayMacro.totals;
  const directEntriesCount = todayMacro.directCount;
  const macroKcalTotal = todayMacro.kcalTotal;
  const macroShares = todayMacro.shares;
  const macroSegments = todayMacro.segments;
  const DONUT_R = todayMacro.r;
  const DONUT_C = todayMacro.c;
  // Regelbasierte, lokale Coach-Tipps (kein KI-Aufruf) — orientiert an groben Ernährungsrichtwerten.
  const coachTips = [];
  if (macroTotals.calories >= 150) {
    if (macroShares.protein < 0.15) coachTips.push("Du könntest heute noch etwas mehr Protein einbauen.");
    if (macroShares.fat > 0.4) coachTips.push("Die Fettzufuhr liegt heute schon recht hoch — im Blick behalten.");
    if ((macroTotals.fiber / macroTotals.calories) * 1000 < 10) coachTips.push("Etwas mehr Ballaststoffe (Gemüse, Vollkorn, Hülsenfrüchte) würden guttun.");
    if (coachTips.length === 0) coachTips.push("Sieht ausgewogen aus — weiter so!");
  }

  // ---------- Ernährungsübersicht: Flüssigkeit, Obst/Gemüse, persönliche Makro-Ziele ----------
  // Die Flüssigkeitsmenge wird jetzt direkt aus den heutigen Getränke-Einträgen berechnet (nicht mehr
  // aus einem separaten ml-Zähler) — Getränke hinzufügen passiert über "Getränke heute" im Heute-Tab.
  const todayFluidMl = computeFluidMl(entries);
  const todayDrinkEntries = entries.filter((e) => !e.isDirect && e.category === "Getränk");
  // Getränke stehen als eigene Gruppe in derselben Tagesliste (siehe groupEntriesByMeal).
  // Flüssigkeit: Grundbedarf plus Sportzuschlag.
  //  • Minimum      = DGE-Richtwert von 1,5 l über Getränke pro Tag für Erwachsene.
  //  • Grundbedarf  = 25 ml je kg Körpergewicht, aber nie unter dem Minimum. Bewusst am unteren
  //    Ende des D-A-CH-Rahmens (30–40 ml/kg gelten für die Gesamtwasserzufuhr inklusive fester
  //    Nahrung) — als reines Trinkziel wäre mehr zu hoch gegriffen.
  //  • Sportzuschlag = 0,3 l/h bei leichter bis 0,8 l/h bei sehr intensiver Belastung
  //    (ACSM: 0,4–0,8 l/h bei intensiver Ausdauerbelastung). Wird aus der erfassten Dauer und
  //    Intensität berechnet, sodass niemand einen Regler nachführen muss.
  const FLUID_TARGET_ML = 1500;
  const FLUID_ML_PER_KG = 25;
  const fluidBaseMl = Math.max(FLUID_TARGET_ML, Math.round((profileWeightKg(profile) * FLUID_ML_PER_KG) / 100) * 100);
  const fluidSportMlPerHour = 300 + ((Math.max(1, Math.min(10, sportIntensity)) - 1) / 9) * 500;
  const fluidSportMl = sportDone ? Math.round((sportDurationHours * fluidSportMlPerHour) / 100) * 100 : 0;
  const fluidOptimalMl = fluidBaseMl + fluidSportMl;
  const todayFruitVegG = computeFruitVegGrams(entries);
  const FRUITVEG_TARGET_G = 650; // DGE "5 am Tag": 3 Portionen Gemüse (~400g) + 2 Portionen Obst (~250g)
  // Persönliche Makro-Ziele nach DACH-Referenzwerten: Protein nach Körpergewicht (0,8 g/kg, ab 65
  // Jahren 1,0 g/kg), Fett/Kohlenhydrate als Anteil am tatsächlichen Kalorienziel (nicht am
  // theoretischen Gesamtumsatz, da das für die tägliche Einordnung praxisnäher ist), Ballaststoffe
  // als fester DACH-Mindestwert.
  const proteinTargetG = round1(profileWeightKg(profile) * (effectiveAge(profile) >= 65 ? 1.0 : 0.8));
  const fatTargetG = round1((target.calorieTarget || 0) * 0.30 / 9);
  const carbTargetG = round1((target.calorieTarget || 0) * 0.50 / 4);
  const fiberTargetG = 30;
  // Rendert eine horizontale, animierte Fortschritts-Kachel (für Wasser/Obst-Gemüse/Makros).
  // Flüssigkeitsbalken mit zwei Zonen: bis zum Minimum, danach bis zum optimalen Tagesbedarf.
  // Die Trennlinie sitzt an der 1,5-l-Marke, damit auf einen Blick klar ist, welcher Teil des
  // Balkens schon "genug" bedeutet und was darüber hinaus als optimal gilt.
  function renderFluidBar() {
    const scale = fluidOptimalMl;
    const minPct = Math.min(1, FLUID_TARGET_ML / scale) * 100;
    const basePct = Math.min(todayFluidMl, FLUID_TARGET_ML) / scale * 100;
    const extraPct = Math.max(0, Math.min(todayFluidMl, scale) - FLUID_TARGET_ML) / scale * 100;
    const minReached = todayFluidMl >= FLUID_TARGET_ML;
    const optReached = todayFluidMl >= scale;
    const asL = (ml) => (ml / 1000).toFixed(1).replace(".", ",");
    return (
      <div style={{ marginBottom: 18 }}>
        <div style={{ display: "flex", justifyContent: "space-between", alignItems: "baseline", fontSize: 13, marginBottom: 6 }}>
          <span style={{ fontWeight: 600 }}>Flüssigkeit</span>
          <span style={{ color: optReached ? "var(--good)" : "var(--chalk-dim)", fontWeight: optReached ? 700 : 400 }}>
            {asL(todayFluidMl)} / {asL(scale)} l{optReached ? " ✓ optimal" : minReached ? " ✓ Minimum" : ""}
          </span>
        </div>
        <div className="npt-fluid-bar">
          <div className="npt-fluid-seg" style={{ width: `${basePct}%`, background: minReached ? "var(--good)" : "var(--teal)" }} />
          <div className="npt-fluid-seg" style={{ width: `${extraPct}%`, background: "var(--teal)", opacity: 0.55 }} />
          {minPct < 100 && <div className="npt-fluid-mark" style={{ left: `${minPct}%` }} />}
        </div>
        <div className="npt-fluid-scale">
          <span>Minimum {asL(FLUID_TARGET_ML)} l</span>
          <span>{fluidSportMl > 0 ? `Ziel ${asL(scale)} l (inkl. +${asL(fluidSportMl)} l Sport)` : `Ziel ${asL(scale)} l`}</span>
