          <span><span style={{ display: "inline-block", width: 10, height: 3, borderRadius: 2, background: COLOR_WEIGHT_LIGHT, marginRight: 4 }}></span>Ziel Gewicht</span>
        )}
        {showWeightLine && showTrendLine && trend && !trend.insufficientData && (
          <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: "50%", background: COLOR_WEIGHT, marginRight: 4, opacity: 0.6 }}></span>Prognose Gewicht</span>
        )}
        {waistEnabled && showWaistLine && (
          <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: "50%", background: COLOR_WAIST, marginRight: 4 }}></span>Bauchumfang</span>
        )}
        {waistEnabled && showWaistLine && showWaistTarget && profile.targetWaistCm && (
          <span><span style={{ display: "inline-block", width: 10, height: 3, borderRadius: 2, background: COLOR_WAIST_LIGHT, marginRight: 4 }}></span>Ziel Bauchumfang</span>
        )}
        {waistEnabled && showWaistLine && showWaistTrendLine && waistTrend && !waistTrend.insufficientData && (
          <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: "50%", background: COLOR_WAIST, marginRight: 4, opacity: 0.6 }}></span>Prognose Bauchumfang</span>
        )}
        {showDeficitLine && (
          <span><span style={{ display: "inline-block", width: 10, height: 10, borderRadius: "50%", background: COLOR_DEFICIT, marginRight: 4 }}></span>Kalorien-Defizit</span>
        )}
        {showDeficitLine && showDeficitTarget && (
          <span><span style={{ display: "inline-block", width: 10, height: 3, borderRadius: 2, background: COLOR_DEFICIT_LIGHT, marginRight: 4 }}></span>Ziel Defizit</span>
        )}
      </div>
    );
  }

  const todayOverage = Math.max(0, used - effectiveTarget);
  const currentWeekMonday = mondayOf(effectiveNow(profile.dayResetMinutes || 0));
  const flexAvailableBeforeToday = Math.max(0, WEEKLY_FLEX_TOTAL - flexUsedPriorDaysThisWeek);
  const flexOverflowToday = Math.max(0, todayOverage - flexAvailableBeforeToday);
  const flexConsumedToday = todayOverage - flexOverflowToday;
  const flexUsedThisWeekTotal = flexUsedPriorDaysThisWeek + flexConsumedToday;
  const flexRemaining = Math.max(0, WEEKLY_FLEX_TOTAL - flexUsedThisWeekTotal);
  const isOverLimit = flexOverflowToday > 0;

  // remaining bleibt bei 0 stehen, solange die Überschreitung durch Flexpoints gedeckt ist;
  // erst wenn auch die Flexpoints aufgebraucht sind, geht der Wert ins Negative.
  const remaining = used <= effectiveTarget ? effectiveTarget - used : isOverLimit ? -flexOverflowToday : 0;
  const ratio = effectiveTarget > 0 ? used / effectiveTarget : 0;
  // Nutzt eigene, vom Farbschema unabhängige Ampelfarben (--good/--warn/--bad), nicht die
  // dekorativen Theme-Akzentfarben (--teal/--amber/--coral), die je nach Schema z.B. rosa sind.
  // Ampel nach Dritteln des Tagesbudgets (ohne Flex): 1. Drittel grün, 2. Drittel gelb, ab dem
  // letzten Drittel rot — und bleibt rot, auch wenn per Flexpoints noch Puffer vorhanden ist
  // (Flex verändert effectiveTarget bewusst nicht, daher bleibt ratio und damit die Farbe stabil).
  const status = ratio > 2 / 3 ? "bad" : ratio > 1 / 3 ? "warn" : "good";

  // Einmal am Tag eine kleine Belohnung, wenn ein Tagesziel erreicht ist.
  useEffect(() => {
    if (!loaded || celebratedDay === activeDayKey) return;
    if (todayFruitVegG < FRUITVEG_TARGET_G && todayFluidMl < FLUID_TARGET_ML) return;
    setCelebratedDay(activeDayKey);
    storageSet("celebratedDay", activeDayKey);
    setCelebration(true);
    buzz([12, 60, 12]);
    const t = setTimeout(() => setCelebration(false), 2600);
    return () => clearTimeout(t);
  }, [loaded, celebratedDay, activeDayKey, todayFruitVegG, todayFluidMl, FRUITVEG_TARGET_G, FLUID_TARGET_ML]);

  // Serie: wie viele abgeschlossene Tage am Stück lagen im Budget?
  useEffect(() => {
    if (!loaded) return;
    let count = 0;
    const cursor = new Date(activeDayKey + "T12:00:00");
    for (let i = 0; i < 60; i++) {
      cursor.setDate(cursor.getDate() - 1);
      const res = storageGet(`log:${dateKeyFor(cursor)}`);
      if (!res || !res.value) break;
      try {
        const parsed = JSON.parse(res.value);
        const list = Array.isArray(parsed) ? parsed : parsed.entries || [];
        const dayTarget = !Array.isArray(parsed) && parsed.target ? parsed.target : 0;
        const bonus = !Array.isArray(parsed) && parsed.sport ? parsed.sport.bonusPoints || 0 : 0;
        if (list.length === 0 || dayTarget <= 0) break;
        if (list.reduce((sum, e) => sum + e.points, 0) > dayTarget + bonus) break;
        count += 1;
      } catch (e) { break; }
    }
    setStreakDays(count);
  }, [loaded, activeDayKey, dataRevision]);

  // Kennzahlen für den Gewicht-Bereich: aktueller Stand, Veränderung im letzten Monat, Zielabstand.
  const sortedWeights = [...weightLog].sort((a, b) => new Date(a.timestamp) - new Date(b.timestamp));
  const latestWeightEntry = sortedWeights.length > 0 ? sortedWeights[sortedWeights.length - 1] : null;
  const latestWeightKg = latestWeightEntry ? latestWeightEntry.weightKg : null;
  const weightRef30 = (() => {
    if (sortedWeights.length < 2) return null;
    const cutoff = Date.now() - 30 * 86400000;
    let best = null;
    for (const w of sortedWeights) {
      if (new Date(w.timestamp).getTime() <= cutoff) best = w;
    }
    return best || sortedWeights[0];
  })();
  const weightChange30 = latestWeightKg !== null && weightRef30 ? round1(latestWeightKg - weightRef30.weightKg) : null;
  const weightToTarget = latestWeightKg !== null && Number(profile.targetWeightKg) > 0
    ? round1(latestWeightKg - Number(profile.targetWeightKg))
    : null;

  const animatedRemaining = useCountUp(remaining);
  const animatedUsed = useCountUp(used);
  const r = 74;
  const circumference = 2 * Math.PI * r;
  const dashOffset = circumference * (1 - Math.min(ratio, 1));

  const combinedFoods = [...customFoods, ...FOOD_DATABASE];
  const nonAlcoholicDrinks = combinedFoods.filter((f) => f.category === "Getränk" && !f.alcoholic);

  const searchResults =
    searchQuery.trim().length > 0 && !form.selectedFoodId
      ? fuzzySearch(searchQuery, combinedFoods, 6)
      : [];

  // Getränke brauchen keine Mahlzeit-Zuordnung — sie bilden im Tag eine eigene Gruppe.
  const formIsDrink = (form.selectedFoodId
    ? (combinedFoods.find((f) => f.id === form.selectedFoodId) || {}).category
    : form.category) === "Getränk";
  const recentFoods = recentFoodIds
    .map((id) => combinedFoods.find((f) => f.id === id))
    .filter(Boolean)
    .slice(0, 8);
  const libFormOpen = showFoodForm && foodFormContext === "library";
  const ownFoodFormOpen = showFoodForm && foodFormContext === "own";
  const libSearchResults = libSearchQuery.trim().length > 0 ? fuzzySearch(libSearchQuery, combinedFoods, 15) : [];

  const dishSearchResults =
    dishSearchQuery.trim().length > 0 && !pointForm.selectedDishId
      ? fuzzySearch(dishSearchQuery, customDishes, 6)
      : [];

  function selectFood(food) {
    const defaultAmountG = food.isRecipe && food.recipeServingG ? food.recipeServingG : 100;
    const factor = defaultAmountG / 100;
    setForm((prev) => ({
      ...prev, name: food.name, selectedFoodId: food.id, amountG: defaultAmountG, amountUnitValue: defaultAmountG, amountUnit: food.category === "Getränk" ? "ml" : "g", carbs: "",
      calories: Math.round(food.calories * factor), fat: round1(food.fat * factor), protein: round1(food.protein * factor), fiber: round1(food.fiber * factor),
    }));
    setNutrientBasis("kalorien");
    setSearchQuery(food.name);
    setDropdownOpen(false);
  }
  // Öffnet das "Essen hinzufügen"-Fenster direkt mit einem aus der Lebensmittel-Datenbanksuche
  // gewählten Eintrag — zeigt Nährwerte je Menge und bietet direkt den Hinzufügen-Button, ohne den
  // Umweg über die Essen-Suche im Heute-Bereich.
  function quickAddFromLibrary(food) {
    setForm(EMPTY_FORM);
    selectFood(food);
    setFormMode("naehrwerte");
    setEntryMethod("search");
    setEditingEntryId(null);
    setEditingEntryOriginal(null);
    setFormMeal(defaultMealForNow());
    setFormTargetDay(null);
    setShowForm(true);
  }
  // Trägt ein Getränk (z.B. "1 Glas Wasser") direkt und ohne Umweg über das Formular ein — für die
  // Schnellauswahl-Buttons bei "Getränke heute".
  // Merkt sich ein gerade verwendetes Lebensmittel ganz vorn in der Liste (ohne Dubletten).
  function rememberRecentFood(foodId) {
    if (foodId === null || foodId === undefined) return;
    setRecentFoodIds((prev) => [foodId, ...prev.filter((id) => id !== foodId)].slice(0, 12));
  }
  // Schnellwahl-Getränke immer aus der mitgelieferten Datenbank auflösen. Ein selbst angelegtes
  // Lebensmittel mit gleichem Namen steht in combinedFoods weiter vorn und würde sonst gewinnen —
  // ihm fehlt aber die Angabe, ob es zur Flüssigkeitsbilanz zählt, und der Kaffee wäre "unsichtbar".
  function resolveDrinkFood(foodName) {
    return FOOD_DATABASE.find((f) => f.name === foodName) || combinedFoods.find((f) => f.name === foodName);
  }

  function quickAddDirectDrink(foodName, amountG) {
    const food = resolveDrinkFood(foodName);
    if (!food) return;
    const factor = amountG / 100;
    const calories = Math.round(food.calories * factor);
    const fat = round1(food.fat * factor);
    const protein = round1(food.protein * factor);
    const fiber = round1(food.fiber * factor);
    const points = calcFoodPointsWithMode({ calories, fat, protein, fiber }, matrix, profile.sattmacherMode, food.category, !!food.sattmacherExempt);
    rememberRecentFood(food.id);
    const entryData = {
      name: food.name, calories, carbs: null, fat, protein, fiber,
      calcBasis: "kalorien", points,
      category: food.category, sattmacherExempt: !!food.sattmacherExempt, countsToFluid: !!food.countsToFluid,
      recipeSnapshot: null, amountG, meal: "getraenke", createdAt: new Date().toISOString(),
    };
    setEntries((prev) => [...prev, { id: newId(), ...entryData }]);
    flashPoints(entryData.points);
  }
  // Fügt das im Getränke-Picker per Dropdown gewählte Getränk mit der eingegebenen Menge hinzu.
  function addSelectedDrink() {
    const food = combinedFoods.find((f) => String(f.id) === String(drinkPickerSelectedId));
    const amountG = Number(drinkPickerAmount) || 0;
    if (!food || amountG <= 0) return;
    quickAddDirectDrink(food.name, amountG);
    setDrinkPickerSelectedId("");
    setDrinkPickerAmount(200);
    closeForm();
  }

  // Setzt Menge + Einheit (g, ml, l oder Alltagseinheit wie EL/TL/Scheibe/Tasse/Stück) und rechnet
  // die Nährwerte proportional um.
  function updateAmountUnit(rawAmount, unit) {
    const food = combinedFoods.find((f) => f.id === form.selectedFoodId);
    if (rawAmount === "") {
      setForm({ ...form, amountG: "", amountUnitValue: "", amountUnit: unit });
      return;
    }
    const grams = resolveAmountToGrams(food, rawAmount, unit);
    const factor = grams / 100;
    setForm({
      ...form, amountG: round1(grams), amountUnitValue: rawAmount, amountUnit: unit,
      calories: food ? Math.round(food.calories * factor) : form.calories,
      fat: food ? round1(food.fat * factor) : form.fat,
      protein: food ? round1(food.protein * factor) : form.protein,
      fiber: food ? round1(food.fiber * factor) : form.fiber,
    });
  }

  function resetForm() { setForm(EMPTY_FORM); setSearchQuery(""); setDropdownOpen(false); setEntryFormAttempted(false); }
  function resetPointForm() { setPointForm(EMPTY_POINT_FORM); setDishSearchQuery(""); setDishDropdownOpen(false); }
  function closeForm() { resetForm(); resetPointForm(); resetRecipeBuilder(); setShowForm(false); setEditingEntryId(null); setEditingEntryOriginal(null); setFormTargetDay(null); setFormMode("naehrwerte"); setEntryMethod(null); }
  // Zurück zur Methoden-Übersicht — setzt die bisherige Eingabe zurück, damit man nicht mit einer
  // veralteten Auswahl (z.B. schon gewähltes Lebensmittel) in eine andere Methode wechselt.
  function backToEntryMenu() { resetForm(); resetPointForm(); resetRecipeBuilder(); setFormMode("naehrwerte"); setEntryMethod(null); }

  // ---------- Swipe-Navigation zwischen den Tabs ----------
  const touchStartRef = useRef(null);
  const nptBodyRef = useRef(null);
  const lastTabRef = useRef(tab);
  // Setzt die Scrollposition beim Tab-Wechsel zurück, damit man nicht mitten im Verlauf des
  // vorherigen Tabs landet, wenn man dort weit runtergescrollt hatte.
  useEffect(() => {
    if (nptBodyRef.current) nptBodyRef.current.scrollTop = 0;
  }, [tab]);
  // Richtung für die Wechsel-Animation: anhand der Tab-Reihenfolge, nicht der Wisch-Richtung
  // selbst, damit Antippen der unteren Leiste und Wischen sich gleich anfühlen.
  const tabIdx = TAB_ORDER.indexOf(tab);
  const lastTabIdx = TAB_ORDER.indexOf(lastTabRef.current);
  const tabSlideDir = tabIdx >= lastTabIdx ? 1 : -1;
  lastTabRef.current = tab;
  function handleTabSwipeStart(ev) {
    // Während Tour, Formularen, Scanner oder gezoomtem Diagramm keine Swipe-Navigation, und nicht
    // wenn die Berührung auf einem Regler/Eingabefeld beginnt (die brauchen horizontales Ziehen).
    if (tourActive || showForm || showScanner || chartZoomed) { touchStartRef.current = null; return; }
    const target = ev.target;
    if (target.closest && target.closest("input, select, textarea, .npt-tour-overlay, .npt-chip-row")) { touchStartRef.current = null; return; }
    const t = ev.touches[0];
    touchStartRef.current = { x: t.clientX, y: t.clientY };
  }
  function handleTabSwipeEnd(ev) {
    if (rowSwipeGuardRef.current) { touchStartRef.current = null; return; }
    if (!touchStartRef.current) return;
    const t = ev.changedTouches[0];
    const dx = t.clientX - touchStartRef.current.x;
    const dy = t.clientY - touchStartRef.current.y;
    touchStartRef.current = null;
    // Mindestens 60px und deutlich horizontaler als vertikaler Ausschlag, sonst war's Scrollen.
    if (Math.abs(dx) < 60 || Math.abs(dx) < Math.abs(dy) * 1.5) return;
    const idx = TAB_ORDER.indexOf(tab);
    if (dx < 0 && idx < TAB_ORDER.length - 1) setTab(TAB_ORDER[idx + 1]);
    else if (dx > 0 && idx > 0) setTab(TAB_ORDER[idx - 1]);
  }

  // ---------- Onboarding-Tour ----------
  function stopTourSpeech() {
    if (window.speechSynthesis) window.speechSynthesis.cancel();
    setTourSpeaking(false);
  }
  function startTour() {
    setShowForm(false);
    setShowThemePanel(false);
    setTourStep(0);
    setTourSpotlight(null);
    setTourActive(true);
  }
  function endTour() {
    stopTourSpeech();
    setTourActive(false);
    setTourSpotlight(null);
  }
  function goToTourStep(i) {
    stopTourSpeech();
    const clamped = Math.max(0, Math.min(TOUR_STEPS.length - 1, i));
    setTourSpotlight(null);
    setTourStep(clamped);
  }
  function nextTourStep() { tourStep >= TOUR_STEPS.length - 1 ? endTour() : goToTourStep(tourStep + 1); }
  function prevTourStep() { goToTourStep(tourStep - 1); }
  function speakTourStep() {
    if (!window.speechSynthesis) return;
    window.speechSynthesis.cancel();
    const step = TOUR_STEPS[tourStep];
    const utter = new SpeechSynthesisUtterance(`${step.title}. ${step.text}`);
    utter.lang = "de-DE";
    utter.onstart = () => setTourSpeaking(true);
    utter.onend = () => setTourSpeaking(false);
    utter.onerror = () => setTourSpeaking(false);
    window.speechSynthesis.speak(utter);
  }

  // Bei Schrittwechsel: passenden Tab (und ggf. Essen/Sport-Unterreiter) aktivieren, zum
  // markierten Element scrollen und dessen Position für das Spotlight-Overlay vermessen.
  // Bei Schrittwechsel: passenden Tab (und ggf. Essen/Sport-Unterreiter) aktivieren, zum
  // markierten Element scrollen und dessen Position mehrfach nachjustiert vermessen — eine
  // einzelne Messung kurz nach dem Wechsel war zu unzuverlässig, wenn sich das Layout (Tab-
  // Wechsel, bedingt gerenderte Karten) erst mit etwas Verzögerung endgültig stabilisiert hat.
  useEffect(() => {
    if (!tourActive) return;
    const step = TOUR_STEPS[tourStep];
    if (step.tab) setTab(step.tab);
    if (step.forceHeuteSubTab) setHeuteSubTab(step.forceHeuteSubTab);
    if (step.forceVerlaufSubTab) setVerlaufSubTab(step.forceVerlaufSubTab);
    if (step.forceOpenProfilSection) setOpenProfilSection(step.forceOpenProfilSection);
    stopTourSpeech();
    let cancelled = false;
    const timers = [];
    const measure = () => {
      if (cancelled) return;
      const el = step.ref ? tourRefs.current[step.ref] : null;
      if (el) {
        const rect = el.getBoundingClientRect();
        setTourSpotlight({ top: rect.top, left: rect.left, width: rect.width, height: rect.height });
      } else {
        setTourSpotlight(null);
      }
    };
    const t0 = setTimeout(() => {
      const el = step.ref ? tourRefs.current[step.ref] : null;
      if (el) el.scrollIntoView({ behavior: "smooth", block: "center" });
      [150, 350, 550, 800].forEach((delay) => timers.push(setTimeout(measure, delay)));
    }, 50);
    return () => { cancelled = true; clearTimeout(t0); timers.forEach(clearTimeout); };
    // eslint-disable-next-line react-hooks/exhaustive-deps
  }, [tourActive, tourStep]);

  function persistDayEntries(dayKey, list) {
    const res = storageGet(`log:${dayKey}`);
    let dayObj = {};
    if (res && res.value) {
      try {
        const parsed = JSON.parse(res.value);
        dayObj = Array.isArray(parsed) ? {} : parsed;
      } catch (e) {}
    }
    storageSet(`log:${dayKey}`, JSON.stringify({ ...dayObj, entries: list }));
    setHistoryDays((prev) => prev.map((d) => (d.key === dayKey ? { ...d, used: list.length > 0 ? list.reduce((s, e) => s + e.points, 0) : null, target: list.length > 0 ? d.target : null } : d)));
    // Ein vergangener Tag wurde direkt im Speicher geändert — abhängige Auswertungen (Flexpoints,
    // Diagramme, Wochenübersicht) müssen neu gelesen werden.
    setDataRevision((n) => n + 1);
  }

  // Live-Punkte-Vorschau während der Eingabe im Eintrage-Formular — zeigt die Punktzahl für die
  // aktuell eingegebene Portion (nicht nur je 100g), damit man sofort sieht, wie teuer das wird.
  function computeFormPreviewPoints() {
    const amountG = Number(form.amountG) || 0;
    if (amountG <= 0) return null;
    const factor = amountG / 100;
    if (form.selectedFoodId) {
      if (form.calories === "") return null;
      const selectedFood = combinedFoods.find((f) => f.id === form.selectedFoodId);
      if (selectedFood && selectedFood.isRecipe) return calcRecipePoints(selectedFood, amountG, matrix, profile.sattmacherMode);
      const cat = selectedFood ? selectedFood.category : undefined;
      const exempt = selectedFood ? !!selectedFood.sattmacherExempt : false;
      return calcFoodPointsWithMode(
        { calories: Number(form.calories) || 0, fat: Number(form.fat) || 0, protein: Number(form.protein) || 0, fiber: Number(form.fiber) || 0 },
        matrix, profile.sattmacherMode, cat, exempt
      );
    }
    let calories;
    if (nutrientBasis === "kalorien") {
      if (form.calories === "") return null;
      calories = (Number(form.calories) || 0) * factor;
    } else {
      if (form.carbs === "") return null;
      calories = ((Number(form.carbs) || 0) * 4 + (Number(form.protein) || 0) * 4 + (Number(form.fat) || 0) * 9) * factor;
    }
    return calcFoodPointsWithMode(
      { calories, fat: (Number(form.fat) || 0) * factor, protein: (Number(form.protein) || 0) * factor, fiber: (Number(form.fiber) || 0) * factor },
      matrix, profile.sattmacherMode, form.category, false
    );
  }

  function addEntry() {
    if (!form.name.trim()) { setEntryFormAttempted(true); return; }

    let calories, carbsForEntry, fat, protein, fiber;

    if (form.selectedFoodId) {
      if (form.calories === "") { setEntryFormAttempted(true); return; }
      calories = Number(form.calories) || 0;
      fat = Number(form.fat) || 0;
      protein = Number(form.protein) || 0;
      fiber = Number(form.fiber) || 0;
      carbsForEntry = null;
    } else {
      if (nutrientBasis === "kalorien" && form.calories === "") { setEntryFormAttempted(true); return; }
      if (nutrientBasis === "kohlenhydrate" && form.carbs === "") { setEntryFormAttempted(true); return; }

      const factor = (Number(form.amountG) || 0) / 100;
      const fat100 = Number(form.fat) || 0;
      const protein100 = Number(form.protein) || 0;
      const fiber100 = Number(form.fiber) || 0;
      let calories100;
      let carbs100 = null;
      if (nutrientBasis === "kohlenhydrate") {
        carbs100 = Number(form.carbs) || 0;
        calories100 = Math.round(carbs100 * 4 + protein100 * 4 + fat100 * 9);
      } else {
        calories100 = Number(form.calories) || 0;
      }

      calories = Math.round(calories100 * factor);
      fat = round1(fat100 * factor);
      protein = round1(protein100 * factor);
      fiber = round1(fiber100 * factor);
      carbsForEntry = carbs100 !== null ? round1(carbs100 * factor) : null;

      setCustomFoods((prev) => {
        const idx = prev.findIndex((f) => f.name.toLowerCase() === form.name.trim().toLowerCase());
        // Ein gleichnamiges Rezept wird nicht überschrieben — seine Zutatenliste ginge sonst verloren.
        if (idx >= 0 && prev[idx].isRecipe) return prev;
        // Vorhandene Zusatzinfos (Kategorie, Sattmacher-Ausnahme) bleiben erhalten, wenn im Formular
        // nichts Neues angegeben wurde.
        const existing = idx >= 0 ? prev[idx] : null;
        const newFood = {
          ...(existing || {}),
          id: existing ? existing.id : newId(),
          name: form.name.trim(),
          calories: calories100, fat: fat100, protein: protein100, fiber: fiber100,
          category: form.category || (existing ? existing.category : undefined),
        };
        if (idx >= 0) { const copy = [...prev]; copy[idx] = newFood; return copy; }
        return [...prev, newFood];
      });
    }

    const selectedFoodForPoints = form.selectedFoodId ? combinedFoods.find((f) => f.id === form.selectedFoodId) : null;
    const entryCategory = selectedFoodForPoints ? selectedFoodForPoints.category : form.category;
    const entryExempt = selectedFoodForPoints ? !!selectedFoodForPoints.sattmacherExempt : false;
    // Beim Bearbeiten ist kein Datenbank-Lebensmittel mehr ausgewählt — die Getränke-Einstufung muss
    // dann aus dem ursprünglichen Eintrag übernommen werden, sonst fällt ein korrigiertes Getränk
    // stillschweigend aus der Flüssigkeitsbilanz.
    const entryCountsToFluid = selectedFoodForPoints
      ? !!selectedFoodForPoints.countsToFluid
      : editingEntryOriginal
      ? !!editingEntryOriginal.countsToFluid
      : false;
    const isRecipeEntry = !!(selectedFoodForPoints && selectedFoodForPoints.isRecipe);
    // Für Rezepte wird ein bereits auf die verzehrte Menge skalierter Zutaten-Snapshot mitgespeichert
    // (nicht nur Name/Kategorie des Gesamt-"Lebensmittels") — nur so lässt sich die Punktzahl später
    // beim Umschalten des Sattmacher-Modus zutatengenau neu berechnen, statt verloren zu gehen.
    let recipeSnapshot = null;
    if (isRecipeEntry && selectedFoodForPoints.recipeIngredients && selectedFoodForPoints.recipeTotalG) {
      const consumedG = Number(form.amountG) || 0;
      const fraction = consumedG / selectedFoodForPoints.recipeTotalG;
      recipeSnapshot = {
        recipeTotalG: consumedG,
        recipeIngredients: selectedFoodForPoints.recipeIngredients.map((ing) => ({ ...ing, amountG: (ing.amountG || 0) * fraction })),
      };
    }
    // Beim Bearbeiten eines Rezept-Eintrags ist kein Lebensmittel mehr ausgewählt. Damit die
    // zutatengenaue Sattmacher-Berechnung erhalten bleibt, wird der vorhandene Snapshot
    // übernommen und auf die (ggf. geänderte) Menge skaliert.
    if (!recipeSnapshot && !form.selectedFoodId && editingEntryOriginal && editingEntryOriginal.recipeSnapshot && editingEntryOriginal.recipeSnapshot.recipeIngredients) {
      const prevSnap = editingEntryOriginal.recipeSnapshot;
      const prevG = Number(editingEntryOriginal.amountG) || Number(prevSnap.recipeTotalG) || 0;
      const newG = Number(form.amountG) || 0;
      const scale = prevG > 0 && newG > 0 ? newG / prevG : 1;
      recipeSnapshot = {
        recipeTotalG: round1((Number(prevSnap.recipeTotalG) || 0) * scale),
        recipeIngredients: prevSnap.recipeIngredients.map((ing) => ({ ...ing, amountG: (ing.amountG || 0) * scale })),
      };
    }
    if (form.selectedFoodId) rememberRecentFood(form.selectedFoodId);
    const hasRecipeBasis = isRecipeEntry || recipeSnapshot !== null;
    const points = isRecipeEntry
      ? calcRecipePoints(selectedFoodForPoints, Number(form.amountG) || 0, matrix, profile.sattmacherMode)
      : recipeSnapshot
      ? calcRecipePoints(recipeSnapshot, recipeSnapshot.recipeTotalG, matrix, profile.sattmacherMode)
      : calcFoodPointsWithMode({ calories, fat, protein, fiber }, matrix, profile.sattmacherMode, entryCategory, entryExempt);
    const entryData = {
      name: form.name.trim(), calories, carbs: carbsForEntry, fat, protein, fiber,
      calcBasis: form.selectedFoodId ? "kalorien" : nutrientBasis, points,
      category: hasRecipeBasis ? undefined : entryCategory,
      sattmacherExempt: hasRecipeBasis ? undefined : entryExempt,
      countsToFluid: hasRecipeBasis ? undefined : entryCountsToFluid,
      recipeSnapshot,
      amountG: Number(form.amountG) || 100,
      meal: entryCategory === "Getränk" ? "getraenke" : formMeal,
      createdAt: (editingEntryOriginal && editingEntryOriginal.createdAt) || new Date().toISOString(),
    };
    if (formTargetDay && formTargetDay !== activeDayKey) {
      const entryWithId = editingEntryId ? { ...entryData, id: editingEntryId } : { ...entryData, id: newId() };
      setExpandedDayEntries((prev) => {
        const updated = editingEntryId ? prev.map((e) => (e.id === editingEntryId ? entryWithId : e)) : [...prev, entryWithId];
        persistDayEntries(formTargetDay, updated);
        return updated;
      });
    } else if (editingEntryId) {
      setEntries((prev) => prev.map((e) => (e.id === editingEntryId ? { ...entryData, id: editingEntryId } : e)));
    } else {
      setEntries((prev) => [...prev, { id: newId(), ...entryData }]);
      flashPoints(entryData.points);
    }
    closeForm();
  }

  function startEditEntry(entry, dayKey = null) {
    setEditingEntryId(entry.id);
    setEditingEntryOriginal(entry);
    setFormMeal(MEALS.some((m) => m.id === entry.meal) ? entry.meal : defaultMealForNow());
    setFormTargetDay(dayKey);
    setEntryMethod("manual");
    if (entry.isDirect) {
      setFormMode("punkte");
      setPointForm({ name: entry.name, points: String(entry.points), selectedDishId: null });
      setDishSearchQuery("");
    } else {
      setFormMode("naehrwerte");
      const basis = entry.calcBasis === "kohlenhydrate" ? "kohlenhydrate" : "kalorien";
      setNutrientBasis(basis);
      // Ein Eintrag speichert die GESAMTWERTE für die tatsächlich verzehrte Menge, das Formular
      // arbeitet aber mit Werten je 100g + separater Menge. Beim erneuten Öffnen müssen die
      // Gesamtwerte daher auf je 100g zurückgerechnet werden — sonst zeigt das Formular plötzlich
      // ganz andere Zahlen als ursprünglich eingetragen, und ein Ändern der Menge würde die Werte
      // zusätzlich falsch (doppelt) skalieren.
      const amountG = Number(entry.amountG) || 100;
      const factor = amountG / 100;
      setForm({
        ...EMPTY_FORM,
        name: entry.name,
        amountG: amountG,
        // Anzeigemenge mitsetzen — sonst zeigt das Formular beim Bearbeiten immer "100", obwohl
        // intern die tatsächliche Menge gilt (die Punktevorschau war dadurch irreführend).
        amountUnitValue: amountG,
        amountUnit: entry.category === "Getränk" ? "ml" : "g",
        selectedFoodId: null,
        category: entry.category || "",
        calories: basis === "kalorien" ? String(round1((Number(entry.calories) || 0) / factor)) : "",
        carbs: basis === "kohlenhydrate" ? String(round1((Number(entry.carbs) || 0) / factor)) : "",
        fat: String(round1((Number(entry.fat) || 0) / factor)),
        protein: String(round1((Number(entry.protein) || 0) / factor)),
        fiber: String(round1((Number(entry.fiber) || 0) / factor)),
      });
      setSearchQuery("");
    }
    setShowForm(true);
  }

  function startAddForDay(dayKey) {
    resetForm();
    resetPointForm();
    setFormMeal(defaultMealForNow());
    setEditingEntryId(null);
    setEditingEntryOriginal(null);
    setFormTargetDay(dayKey);
    setShowForm(true);
  }

  function handleBarcodeDetected(result) {
    const code = result && result.codeResult ? result.codeResult.code : null;
    if (!code) return;
    try { Quagga.offDetected(handleBarcodeDetected); Quagga.stop(); } catch (e) {}
    setScanStatus("looking-up");
    fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,nutriments`)
      .then((res) => res.json())
      .then((json) => {
        if (!json || json.status !== 1 || !json.product) {
          setScanStatus("notfound");
          return;
        }
        const n = json.product.nutriments || {};
        const name = json.product.product_name || `Produkt ${code}`;
        setFormMode("naehrwerte");
        setNutrientBasis("kalorien");
        setEntryMethod("manual");
        setForm({
          ...EMPTY_FORM,
          name,
          amountG: 100,
          selectedFoodId: null,
          calories: String(Math.round(n["energy-kcal_100g"] || 0)),
          fat: String(round1(n["fat_100g"] || 0)),
          protein: String(round1(n["proteins_100g"] || 0)),
          fiber: String(round1(n["fiber_100g"] || 0)),
        });
        setSearchQuery("");
        setShowForm(true);
        setShowScanner(false);
        setScanStatus(null);
      })
      .catch(() => setScanStatus("error"));
  }

  function startScanner() {
    if (typeof Quagga === "undefined") { setScanStatus("error"); setShowScanner(true); return; }
    setShowScanner(true);
    setScanStatus("scanning");
    setTimeout(() => {
      if (!scannerContainerRef.current) return;
      Quagga.init(
        {
          inputStream: { type: "LiveStream", target: scannerContainerRef.current, constraints: { facingMode: "environment" } },
          decoder: { readers: ["ean_reader", "upc_reader", "upc_e_reader"] },
          locate: true,
        },
        (err) => {
          if (err) { setScanStatus("error"); return; }
          Quagga.start();
        }
      );
      Quagga.onDetected(handleBarcodeDetected);
    }, 150);
  }

  function stopScanner() {
    try { Quagga.offDetected(handleBarcodeDetected); Quagga.stop(); } catch (e) {}
    setShowScanner(false);
    setScanStatus(null);
  }

  function selectDish(dish) {
    setPointForm({ name: dish.name, points: dish.points, selectedDishId: dish.id });
    setDishSearchQuery(dish.name);
    setDishDropdownOpen(false);
  }

  function addDirectEntry() {
    if (!pointForm.name.trim() || pointForm.points === "") return;
    const pts = roundToHalf(Number(pointForm.points)) || 0;
    const dishName = pointForm.name.trim();
    const entryData = { name: dishName, points: pts, isDirect: true, meal: formMeal, createdAt: (editingEntryOriginal && editingEntryOriginal.createdAt) || new Date().toISOString() };
    if (formTargetDay && formTargetDay !== activeDayKey) {
      const entryWithId = editingEntryId ? { ...entryData, id: editingEntryId } : { ...entryData, id: newId() };
      setExpandedDayEntries((prev) => {
        const updated = editingEntryId ? prev.map((e) => (e.id === editingEntryId ? entryWithId : e)) : [...prev, entryWithId];
        persistDayEntries(formTargetDay, updated);
        return updated;
      });
    } else if (editingEntryId) {
      setEntries((prev) => prev.map((e) => (e.id === editingEntryId ? { ...entryData, id: editingEntryId } : e)));
    } else {
      setEntries((prev) => [...prev, { id: newId(), ...entryData }]);
      flashPoints(entryData.points);
    }
    setCustomDishes((prev) => {
      const idx = prev.findIndex((d) => d.name.toLowerCase() === dishName.toLowerCase());
      if (idx >= 0) {
        const copy = [...prev];
        copy[idx] = { ...copy[idx], points: pts };
        return copy;
      }
      return [...prev, { id: newId(), name: dishName, points: pts }];
    });
    closeForm();
  }

  // Rendert eine Tagesliste gruppiert nach Mahlzeiten, mit Punktesumme je Abschnitt. Wird von der
  // Heute-Ansicht und von der Tagesansicht im Verlauf genutzt, damit beide identisch aussehen.
  function renderEntryGroups(list, onEdit, onDelete, full) {
    return groupEntriesByMeal(list).map((group) => {
      // Zweite Ebene: Die Abschnitte sind standardmäßig zu, damit die Tagesliste auch abends
      // überschaubar bleibt — erst ein Tipp öffnet die Einträge einer Mahlzeit.
      const open = collapsedGroups[group.id] === false;
      const sum = round1(group.items.reduce((total, e) => total + e.points, 0));
      const rows = mergeSimilarEntries(group.items);
      return (
        <div className="npt-meal-card" style={{ borderLeftColor: group.color }} key={group.id}>
          <button className="npt-meal-head" onClick={() => toggleMealGroup(group.id)} aria-expanded={open}>
            <span className="npt-meal-dot" style={{ background: group.color }} />
            <span className="npt-meal-label" style={{ color: group.color }}>{group.label}</span>
            <span className="npt-meal-meta">{group.items.length} · {sum} P</span>
            <IconChevronDown size={16} style={{ transform: open ? "none" : "rotate(-90deg)", transition: "transform 0.2s ease", opacity: 0.6 }} />
          </button>
          {open && (
            <div className="npt-meal-body">
              {rows.map((row) => {
                const last = row.entries[row.entries.length - 1];
                return (
                  <div className="npt-entry-row" key={row.key}
                    onTouchStart={handleRowSwipeStart} onTouchMove={handleRowSwipeMove} onTouchEnd={() => handleRowSwipeEnd(() => onDelete(last))}>
                    <div>
                      <div className="npt-entry-name">
                        {row.sample.name}
                        {row.count > 1 && <span className="npt-entry-count">× {row.count}</span>}
                      </div>
                      <div className="npt-entry-meta">{entryMetaText(row.sample, full)}</div>
                    </div>
                    <div style={{ display: "flex", alignItems: "center" }}>
                      <div className="npt-entry-points npt-font-display">{row.points}</div>
                      <button className="npt-del-btn" onClick={() => onEdit(last)} aria-label="Eintrag bearbeiten"><IconPencil size={15} /></button>
                      <button className="npt-del-btn danger" onClick={() => onDelete(last)} aria-label="Eintrag löschen"><IconTrash size={16} /></button>
                    </div>
                  </div>
                );
              })}
            </div>
          )}
        </div>
      );
    });
  }

  // Sicherheitsabfrage vor dem Löschen. Sie erscheint mittig im Bildfeld, nicht am Seitenende —
  // ein Undo-Hinweis unten bringt nichts, wenn man ihn erst durch Scrollen findet.
  const [confirmDialog, setConfirmDialog] = useState(null);
  function askDelete(message, onConfirm) {
    setConfirmDialog({ message, onConfirm });
  }

  function showUndoToast(message, restoreFn) {
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setUndoToast({ message, restore: restoreFn });
    undoTimerRef.current = setTimeout(() => setUndoToast(null), 6000);
  }
  function undoLastDelete() {
    if (undoToast) undoToast.restore();
    if (undoTimerRef.current) clearTimeout(undoTimerRef.current);
    setUndoToast(null);
  }

  function toggleHistoryDay(dayKey, isToday) {
    if (expandedHistoryDay === dayKey) { setExpandedHistoryDay(null); return; }
    setExpandedHistoryDay(dayKey);
    if (isToday) {
      setExpandedDayEntries(entries);
      setExpandedDayMeta({ baseTarget: target.total, sport: { done: sportDone, bonusPoints: sportBonus, caloriesBurned } });
      return;
    }
    setExpandedDayLoading(true);
    const res = storageGet(`log:${dayKey}`);
    if (res && res.value) {
      try {
        const parsed = JSON.parse(res.value);
        setExpandedDayEntries(Array.isArray(parsed) ? parsed : parsed.entries || []);
        setExpandedDayMeta(Array.isArray(parsed) ? null : { baseTarget: parsed.target ?? null, sport: parsed.sport || null });
      } catch (e) {
        setExpandedDayEntries([]);
        setExpandedDayMeta(null);
      }
    } else {
      setExpandedDayEntries([]);
      setExpandedDayMeta(null);
    }
    setExpandedDayLoading(false);
  }

  function deleteExpandedDayEntry(entryId) {
    if (expandedHistoryDay === activeDayKey) { deleteEntry(entryId); return; }
    const idx = expandedDayEntries.findIndex((e) => e.id === entryId);
    if (idx === -1) return;
    const item = expandedDayEntries[idx];
    const dayKeyAtCall = expandedHistoryDay;
    askDelete(`„${item.name}“ aus diesem Tag entfernen?`, () => {
      const updated = expandedDayEntries.filter((e) => e.id !== entryId);
      setExpandedDayEntries(updated);
      persistDayEntries(dayKeyAtCall, updated);
      showUndoToast("Eintrag gelöscht", () => {
        setExpandedDayEntries((prev) => {
          const restored = [...prev];
          restored.splice(Math.min(idx, restored.length), 0, item);
          persistDayEntries(dayKeyAtCall, restored);
          return restored;
        });
      });
    });
  }

  // Stellt ein gelöschtes Element an seiner ursprünglichen Position wieder her, statt es ans Ende
  // der Liste zu hängen.
  function restoreAt(setter, item, index) {
    setter((prev) => {
      const copy = [...prev];
      copy.splice(Math.min(index, copy.length), 0, item);
      return copy;
    });
  }

  function deleteEntry(id) {
    const idx = entries.findIndex((e) => e.id === id);
    if (idx === -1) return;
    const item = entries[idx];
    askDelete(`„${item.name}“ aus dem heutigen Tag entfernen?`, () => {
      setEntries((prev) => prev.filter((e) => e.id !== id));
      showUndoToast("Eintrag gelöscht", () => restoreAt(setEntries, item, idx));
    });
  }
  function deleteDish(id) {
    const idx = customDishes.findIndex((d) => d.id === id);
    if (idx === -1) return;
    const item = customDishes[idx];
    askDelete(`Gericht „${item.name}“ löschen?`, () => {
      setCustomDishes((prev) => prev.filter((d) => d.id !== id));
      showUndoToast("Gericht gelöscht", () => restoreAt(setCustomDishes, item, idx));
    });
  }
  function deleteFood(id) {
    const idx = customFoods.findIndex((f) => f.id === id);
    if (idx === -1) return;
    const item = customFoods[idx];
    // Ein gelöschtes Lebensmittel darf nicht als "Leiche" in den Favoriten zurückbleiben.
    const wasFavorite = favoriteFoodIds.includes(id);
    askDelete(`„${item.name}“ aus deinen Lebensmitteln löschen?`, () => {
      setCustomFoods((prev) => prev.filter((f) => f.id !== id));
      if (wasFavorite) setFavoriteFoodIds((prev) => prev.filter((fid) => fid !== id));
      showUndoToast("Lebensmittel gelöscht", () => {
        restoreAt(setCustomFoods, item, idx);
        if (wasFavorite) setFavoriteFoodIds((prev) => (prev.includes(id) ? prev : [...prev, id]));
      });
    });
  }

  // ---------- Eigenes Lebensmittel anlegen/bearbeiten (nur einfache Lebensmittel, keine Rezepte —
  // die haben eine Zutatenliste, die dieses einfache Formular nicht abbilden kann). ----------
  function openNewFood(context = "own") {
    setFoodForm({ name: "", calories: "", fat: "", protein: "", fiber: "", category: "", countsToFluid: false, alcoholic: false });
    setEditingFoodId(null);
    setFoodFormAttempted(false);
    setCategoryPrompt(false);
    setFoodLogPrompt(false);
    setFoodFormContext(context);
    setShowFoodForm(true);
  }
  // Wie openNewFood, aber mit vorausgefülltem Namen — genutzt von der Datenbanksuche, wenn ein
  // getippter Suchbegriff nicht gefunden wird und direkt als neues Lebensmittel angelegt werden soll.
  function openNewFoodFromSearch(name, context = "library") {
    setFoodForm({ name, calories: "", fat: "", protein: "", fiber: "", category: "", countsToFluid: false, alcoholic: false });
    setEditingFoodId(null);
    setFoodFormAttempted(false);
    setCategoryPrompt(false);
    setFoodLogPrompt(false);
    setFoodFormContext(context);
    setShowFoodForm(true);
    if (context === "library") setOpenProfilSection("search");
  }
  // Formular zum Anlegen/Bearbeiten eines einfachen Lebensmittels — wird sowohl bei "Eigene
  // Lebensmittel" als auch direkt aus der Datenbanksuche heraus verwendet (dieselbe UI, dasselbe
  // Formular, nur zwei verschiedene Startpunkte).
  function renderFoodForm() {
    return (
      <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
        <div style={{ fontWeight: 700, marginBottom: 8 }}>{editingFoodId ? "Lebensmittel bearbeiten" : "Neues Lebensmittel"} (je 100g)</div>
        <div className="npt-field"><label>Name *</label><input type="text" className={!foodForm.name.trim() ? "npt-input-error" : ""} value={foodForm.name} onChange={(ev) => setFoodForm({ ...foodForm, name: ev.target.value })} /></div>
        <div className="npt-field"><label>Kalorien (kcal) *</label><input type="number" inputMode="decimal" className={foodForm.calories === "" ? "npt-input-error" : ""} value={foodForm.calories} onChange={(ev) => setFoodForm({ ...foodForm, calories: ev.target.value })} /></div>
        <div className="npt-form-grid">
          <div className="npt-field"><label>Fett (g)</label><input type="number" inputMode="decimal" value={foodForm.fat} onChange={(ev) => setFoodForm({ ...foodForm, fat: ev.target.value })} /></div>
          <div className="npt-field"><label>Protein (g)</label><input type="number" inputMode="decimal" value={foodForm.protein} onChange={(ev) => setFoodForm({ ...foodForm, protein: ev.target.value })} /></div>
          <div className="npt-field"><label>Ballaststoffe (g)</label><input type="number" inputMode="decimal" value={foodForm.fiber} onChange={(ev) => setFoodForm({ ...foodForm, fiber: ev.target.value })} /></div>
        </div>
        <div className="npt-field-hint" style={{ marginTop: -10, marginBottom: 12 }}>* Pflichtfelder. Fett/Protein/Ballaststoffe dürfen leer bleiben, falls (noch) unbekannt — zählen dann als 0 und lassen sich später ergänzen.</div>
        <div className="npt-field">
          <label>Kategorie (optional)</label>
          <div className="npt-cat-row">
            {FOOD_CATEGORIES.map((c) => (
              <button key={c} className={`npt-cat-chip${foodForm.category === c ? " active" : ""}`}
                onClick={() => { setFoodForm({ ...foodForm, category: foodForm.category === c ? "" : c }); setCategoryPrompt(false); }}>{c}</button>
            ))}
          </div>
          <div className="npt-field-hint" style={{ marginTop: 6 }}>Bestimmt unter anderem, ob es in die Obst-&amp;-Gemüse-Bilanz zählt und wie der Sattmacher-Modus rechnet.</div>
        </div>
        {foodForm.category === "Getränk" && (
          <div className="npt-field">
            <label>Getränke-Einstufung</label>
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13, marginBottom: 6 }}>
              <input type="checkbox" className="npt-checkbox" checked={!!foodForm.countsToFluid}
                onChange={(ev) => setFoodForm({ ...foodForm, countsToFluid: ev.target.checked })} />
              Zählt zur täglichen Flüssigkeitsmenge
            </label>
            <label style={{ display: "flex", alignItems: "center", gap: 8, fontSize: 13 }}>
              <input type="checkbox" className="npt-checkbox" checked={!!foodForm.alcoholic}
                onChange={(ev) => setFoodForm({ ...foodForm, alcoholic: ev.target.checked, countsToFluid: ev.target.checked ? false : foodForm.countsToFluid })} />
              Alkoholisch
            </label>
            <div className="npt-field-hint">Wasser, ungesüßter Tee, Kaffee in Maßen und verdünnte Schorlen zählen mit — Alkohol, pure Säfte und Softdrinks nicht.</div>
          </div>
        )}
        {foodForm.calories !== "" && (
          <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
            ≈ <strong className="npt-font-display">{calcFoodPointsWithMode({ calories: Number(foodForm.calories) || 0, fat: Number(foodForm.fat) || 0, protein: Number(foodForm.protein) || 0, fiber: Number(foodForm.fiber) || 0 }, matrix, profile.sattmacherMode, foodForm.category, false)} Punkte</strong> je 100g
          </div>
        )}
        {categoryPrompt && (
          <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
            <div style={{ marginBottom: 10 }}>Du hast keine Kategorie gewählt. Sie steuert, ob das Lebensmittel in die Obst-&amp;-Gemüse-Bilanz zählt und wie der Sattmacher-Modus rechnet. Jetzt eine auswählen?</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="npt-btn-secondary" style={{ flex: 1 }} onClick={() => setCategoryPrompt(false)}>Ja, auswählen</button>
              <button className="npt-btn-primary" style={{ flex: 1 }} onClick={() => saveFoodForm(true)}>Nein, so speichern</button>
            </div>
          </div>
        )}
        {foodLogPrompt && (
          <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
            <div style={{ marginBottom: 10 }}>Fertig. Nur in die Datenbank aufnehmen — oder gleich für heute eintragen?</div>
            <div className="npt-field">
              <label>Menge für heute ({foodForm.category === "Getränk" ? "ml" : "g"})</label>
              <input type="number" inputMode="decimal" value={foodLogAmount} onChange={(ev) => setFoodLogAmount(ev.target.value)} />
            </div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="npt-btn-secondary" style={{ flex: 1 }} onClick={() => saveFoodForm(true, "save")}>Nur speichern</button>
              <button className="npt-btn-primary" style={{ flex: 1 }} onClick={() => saveFoodForm(true, "log")} disabled={!(Number(foodLogAmount) > 0)}>Speichern &amp; eintragen</button>
            </div>
          </div>
        )}
        {!categoryPrompt && !foodLogPrompt && (
        <div style={{ display: "flex", gap: 8 }}>
          <button className="npt-btn-secondary" style={{ flex: 1 }} onClick={cancelFoodForm}>Abbrechen</button>
          <button className="npt-btn-primary" style={{ flex: 1 }} onClick={() => saveFoodForm()} disabled={!foodForm.name.trim() || foodForm.calories === ""}>Speichern</button>
        </div>
        )}
      </div>
    );
  }
  function openEditFood(food) {
    setFoodForm({
      name: food.name, calories: String(food.calories), fat: String(food.fat),
      protein: String(food.protein), fiber: String(food.fiber), category: food.category || "",
      countsToFluid: !!food.countsToFluid, alcoholic: !!food.alcoholic,
    });
    setEditingFoodId(food.id);
    setFoodFormAttempted(false);
    setCategoryPrompt(false);
    setFoodLogPrompt(false);
    setFoodFormContext("own");
    setShowFoodForm(true);
  }
  function cancelFoodForm() {
    setShowFoodForm(false);
    setEditingFoodId(null);
    setFoodFormAttempted(false);
    setCategoryPrompt(false);
    setFoodLogPrompt(false);
  }
  // Bucht ein gerade angelegtes Lebensmittel direkt als heutigen Eintrag — ohne Umweg über die
  // Suche im Eintragsformular.
  function logFoodDirect(food, amount) {
    const grams = Number(amount) || 0;
    if (grams <= 0) return;
    const factor = grams / 100;
    const calories = Math.round((Number(food.calories) || 0) * factor);
    const fat = round1((Number(food.fat) || 0) * factor);
    const protein = round1((Number(food.protein) || 0) * factor);
    const fiber = round1((Number(food.fiber) || 0) * factor);
    const points = calcFoodPointsWithMode({ calories, fat, protein, fiber }, matrix, profile.sattmacherMode, food.category, !!food.sattmacherExempt);
    const entryData = {
      name: food.name, calories, carbs: null, fat, protein, fiber,
      calcBasis: "kalorien", points,
      category: food.category, sattmacherExempt: !!food.sattmacherExempt, countsToFluid: !!food.countsToFluid,
      recipeSnapshot: null, amountG: grams,
      meal: food.category === "Getränk" ? "getraenke" : defaultMealForNow(),
      createdAt: new Date().toISOString(),
    };
    setEntries((prev) => [...prev, { id: newId(), ...entryData }]);
    flashPoints(points);
    rememberRecentFood(food.id);
  }

  function saveFoodForm(skipCategoryCheck, logChoice) {
    // Nur Name + Kalorien sind Pflicht — Fett/Protein/Ballaststoffe dürfen leer bleiben, falls sie
    // (noch) nicht bekannt sind; sie zählen dann einfach als 0, das Lebensmittel lässt sich später
    // jederzeit über den Bearbeiten-Button vervollständigen.
    if (!foodForm.name.trim() || foodForm.calories === "") {
      setFoodFormAttempted(true);
      return;
    }
    if (!foodForm.category && skipCategoryCheck !== true) {
      setCategoryPrompt(true);
      return;
    }
    setCategoryPrompt(false);
    // Neu angelegt und nicht aus dem Eintragsformular heraus (dort wird es ohnehin direkt in den
    // offenen Eintrag übernommen)? Dann einmal nachfragen, ob es auch heute zählen soll.
    if (!editingFoodId && foodFormContext !== "entry" && logChoice === undefined) {
      setFoodLogAmount(foodForm.category === "Getränk" ? 200 : 100);
      setFoodLogPrompt(true);
      return;
    }
    setFoodLogPrompt(false);
    const data = {
      name: foodForm.name.trim(),
      calories: Number(foodForm.calories) || 0,
      fat: Number(foodForm.fat) || 0,
      protein: Number(foodForm.protein) || 0,
      fiber: Number(foodForm.fiber) || 0,
      category: foodForm.category || undefined,
      // Nur für Getränke relevant: zählt es zur Flüssigkeitsbilanz, ist es alkoholisch?

      alcoholic: foodForm.category === "Getränk" ? !!foodForm.alcoholic : undefined,
    };

      return [savedFood, ...prev];
    });
    // Aus dem Eintragsformular heraus angelegt: direkt übernehmen, statt es erneut suchen zu lassen.
    if (foodFormContext === "entry") {

  // Systemweiten Hell/Dunkel-Wechsel mitbekommen, solange die App offen ist.
  useEffect(() => {
    let mq;
    try { mq = window.matchMedia("(prefers-color-scheme: dark)"); } catch (e) { return; }
    if (!mq) return;
    const onChange = (ev) => setSystemDark(ev.matches);
    if (mq.addEventListener) mq.addEventListener("change", onChange);
    else if (mq.addListener) mq.addListener(onChange);
    return () => {
      if (mq.removeEventListener) mq.removeEventListener("change", onChange);

  // ---------- Zurück-Taste des Geräts ----------
  // Auf Android erwartet man, dass die Zurück-Taste eine Ebene nach oben führt und nicht die App
  // schließt. Die App legt dazu beim Start einen zusätzlichen Verlaufseintrag an: Bei jedem
  // Zurück wird die oberste offene Ebene geschlossen und der Eintrag neu gesetzt. Erst wenn
  // nichts mehr offen ist und der Heute-Reiter aktiv ist, läuft das Zurück durch — dann schließt
  // sich die App wie gewohnt.
  const backHandlerRef = useRef(() => false);
  backHandlerRef.current = () => {
    if (confirmDialog) { setConfirmDialog(null); return true; }
    if (showScanner) { stopScanner(); return true; }
    if (chartZoomed) { setChartZoomed(false); return true; }
    if (showFoodForm) { cancelFoodForm(); return true; }
    if (showSportForm) { cancelSportForm(); return true; }
    if (showWeightSettings) { setShowWeightSettings(false); return true; }
    if (showForm) { closeForm(); return true; }
    if (tourActive) { endTour(); return true; }
    if (expandedHistoryDay) { setExpandedHistoryDay(null); return true; }
    if (expandedRecipeId) { setExpandedRecipeId(null); return true; }
    if (openProfilSection) { setOpenProfilSection(null); return true; }
    if (showChartOptions) { setShowChartOptions(false); return true; }
    if (tab !== "heute") { setTab("heute"); return true; }
    return false;
  };

  // Jede offene Ebene bekommt ihren eigenen Verlaufseintrag — und zwar in dem Moment, in dem sie
  // geöffnet wird. Ein Eintrag, der erst während des Zurück-Ereignisses nachgeschoben wird, kommt
  // auf Android nicht zuverlässig an; deshalb wird hier vorgesorgt statt nachgebessert.
  const openLayerCount =
    (confirmDialog ? 1 : 0) + (showScanner ? 1 : 0) + (chartZoomed ? 1 : 0) +
    (showFoodForm ? 1 : 0) + (showSportForm ? 1 : 0) + (showWeightSettings ? 1 : 0) +
    (showForm ? 1 : 0) + (tourActive ? 1 : 0) + (expandedHistoryDay ? 1 : 0) +
    (expandedRecipeId ? 1 : 0) + (openProfilSection ? 1 : 0) + (showChartOptions ? 1 : 0) +
    (tab !== "heute" ? 1 : 0);
  const navDepthRef = useRef(0);

  useEffect(() => {
    if (openLayerCount <= navDepthRef.current) return;
    const missing = openLayerCount - navDepthRef.current;
    for (let i = 0; i < missing; i++) {
      try { window.history.pushState({ npt: true }, ""); } catch (e) { return; }
    }
    navDepthRef.current = openLayerCount;
  }, [openLayerCount]);

  useEffect(() => {
    function onPop() {
      navDepthRef.current = Math.max(0, navDepthRef.current - 1);
      // Oberste Ebene schließen — oder, wenn keine mehr offen ist, auf den Heute-Reiter springen.
      if (backHandlerRef.current()) return;
      // Ein überzähliger Eintrag (die Ebene wurde vorher schon über die Oberfläche geschlossen)
      // wird stillschweigend verbraucht, damit die App nicht zu früh verschwindet.
      if (navDepthRef.current > 0) return;
      window.removeEventListener("popstate", onPop);
      try { window.history.back(); } catch (e) {}
    }
    window.addEventListener("popstate", onPop);
    return () => window.removeEventListener("popstate", onPop);
  }, []);

  // ---------- Wischen zum Löschen ----------
  // Die Zeile wird direkt über den DOM verschoben (kein Re-Render pro Fingerbewegung). Ab 90px
  // nach links gilt es als Löschen — rückgängig machen lässt es sich über den Undo-Hinweis.
  const rowSwipeRef = useRef({ el: null, x: 0, moved: 0, active: false });
  // Wird beim Wischen einer Zeile gesetzt und erst nach dem Hochblubbern des Ereignisses wieder
  // gelöscht — sonst würde derselbe Wisch zusätzlich den Tab wechseln.
  const rowSwipeGuardRef = useRef(false);
  function handleRowSwipeStart(ev) {
    const t = ev.touches[0];
    rowSwipeRef.current = { el: ev.currentTarget, x: t.clientX, moved: 0, active: true };
    rowSwipeGuardRef.current = true;
  }
  function handleRowSwipeMove(ev) {
    const st = rowSwipeRef.current;
    if (!st.active || !st.el) return;
    const dx = Math.min(0, ev.touches[0].clientX - st.x);
    st.moved = dx;
    st.el.style.transform = `translateX(${dx}px)`;
    st.el.style.opacity = String(Math.max(0.3, 1 + dx / 280));
  }
  function handleRowSwipeEnd(onDelete) {
    const st = rowSwipeRef.current;
    const el = st.el;
    const moved = st.moved || 0;
    rowSwipeRef.current = { el: null, x: 0, moved: 0, active: false };
    if (el) {
      el.style.transition = "transform 0.2s ease, opacity 0.2s ease";
      el.style.transform = "";
      el.style.opacity = "";
      setTimeout(() => { if (el) el.style.transition = ""; }, 220);
    }
    if (moved < -90) { buzz(12); onDelete(); }
    // Erst nach dem aktuellen Ereignisdurchlauf freigeben, damit der Seitencontainer die Geste
    // noch als "gehört zur Zeile" erkennt und keinen Tab-Wechsel auslöst.
    setTimeout(() => { rowSwipeGuardRef.current = false; }, 0);
  }
  // Zeigt kurz die gerade gebuchten Punkte an und gibt eine haptische Rückmeldung.
  function flashPoints(value) {
    buzz(10);
    if (!value) return;
    setPointsFlash({ id: newId(), value });
    if (flashTimerRef.current) clearTimeout(flashTimerRef.current);
    flashTimerRef.current = setTimeout(() => setPointsFlash(null), 1300);
  }

  // ---------- Sport-Formular ----------
  // Intensität und Dauer liegen im gemeinsamen Tages-State (sie fließen direkt in die Bonuspunkte).
  // Damit "Abbrechen" trotzdem wirklich abbricht, wird der Stand beim Öffnen gesichert.
  // Zwei getrennte Zahlenfelder für Stunden und Minuten. Auf dem Handy öffnet sich sonst das
  // Ziffernfeld ohne Doppelpunkt, und die Eingabe "1:29" ist gar nicht tippbar.
  function setSportPart(which, raw) {
    const digits = String(raw).replace(/\D/g, "").slice(-2);
    const cur = parseSportTime(sportTimeInput);
    const value = digits === "" ? 0 : Number(digits);
    const hours = which === "h" ? Math.min(23, value) : cur.hours;
    const minutes = which === "m" ? Math.min(59, value) : cur.minutes;
    setSportTimeInput(`${hours}:${String(minutes).padStart(2, "0")}`);
  }

  // ---------- Rezept-Baukasten ----------
  function selectRecipeIngredient(food) {

  // Erlaubt, eine im Rezeptbaukasten nicht gefundene Zutat direkt an Ort und Stelle anzulegen,
  // statt den Baukasten verlassen zu müssen. Landet dauerhaft in "Eigene Lebensmittel".
  function openInlineNewIngredient() {
    setInlineNewFood({ name: recipeIngredientQuery.trim(), calories: "", fat: "", protein: "", fiber: "", category: "" });
    setInlineFoodAttempted(false);

    const newFood = {

  function addRecipeIngredient() {
    if (!recipeIngredientSelected || !recipeIngredientAmount || recipeIngredientAmount <= 0) return;
    const amountG = resolveAmountToGrams(recipeIngredientSelected, recipeIngredientAmount, recipeIngredientUnit);
    if (!amountG || amountG <= 0) return;
    setRecipeIngredients((prev) => [
      ...prev,
      {
        tempId: newId(), foodId: recipeIngredientSelected.id, name: recipeIngredientSelected.name,
        amount: recipeIngredientAmount, unit: recipeIngredientUnit, amountG: round1(amountG),
        calories100: recipeIngredientSelected.calories, fat100: recipeIngredientSelected.fat, protein100: recipeIngredientSelected.protein, fiber100: recipeIngredientSelected.fiber,
        category: recipeIngredientSelected.category, sattmacherExempt: !!recipeIngredientSelected.sattmacherExempt,
      },
    ]);
    setRecipeIngredientSelected(null);
    setRecipeIngredientQuery("");
    setRecipeIngredientAmount(100);
    setRecipeIngredientUnit("g");
  }
  function removeRecipeIngredient(tempId) {
    setRecipeIngredients((prev) => prev.filter((i) => i.tempId !== tempId));
  }
  function updateRecipeIngredientAmount(tempId, newAmountG) {
    setRecipeIngredients((prev) => prev.map((i) => (i.tempId === tempId ? { ...i, amountG: newAmountG } : i)));
  }
  const recipeTotals = recipeIngredients.reduce(
    (acc, i) => {
      const factor = (Number(i.amountG) || 0) / 100;
      return {
        totalG: acc.totalG + (Number(i.amountG) || 0),
        calories: acc.calories + i.calories100 * factor,
        fat: acc.fat + i.fat100 * factor,
        protein: acc.protein + i.protein100 * factor,
        fiber: acc.fiber + i.fiber100 * factor,
      };
    },
    { totalG: 0, calories: 0, fat: 0, protein: 0, fiber: 0 }
  );
  function resetRecipeBuilder() {
    setRecipeSavePrompt(false);
    setRecipeIngredients([]);
    setRecipeName("");
    setRecipeServings(1);
    setRecipeIngredientQuery("");
    setRecipeIngredientSelected(null);
    setRecipeIngredientAmount(100);
    setRecipeIngredientUnit("g");
    setEditingRecipeId(null);
  }
  // Lädt ein bestehendes Rezept zurück in den Baukasten, um es zu ändern — z.B. wenn eine Zutat
  // vergessen wurde oder sich die Zusammensetzung geändert hat. Landet beim Speichern wieder unter
  // derselben ID, ersetzt also das bestehende Rezept statt ein zweites anzulegen.
  function startEditRecipe(food) {
    setRecipeName(food.name);
    setRecipeServings(food.recipeServings || 1);
    setRecipeIngredients((food.recipeIngredients || []).map((ing) => ({ ...ing })));
    setRecipeIngredientQuery("");
    setRecipeIngredientSelected(null);
    setEditingRecipeId(food.id);
    setOpenProfilSection("recipeBuilder");
  }
  function buildRecipeFood() {
    const servings = Math.max(1, Number(recipeServings) || 1);
    const factor100 = 100 / recipeTotals.totalG;
    return {
      id: newId(),
      name: recipeName.trim(),
      calories: round1(recipeTotals.calories * factor100),
      fat: round1(recipeTotals.fat * factor100),
      protein: round1(recipeTotals.protein * factor100),
      fiber: round1(recipeTotals.fiber * factor100),
      isRecipe: true,
      recipeIngredients: recipeIngredients.map((i) => ({
        name: i.name, amountG: i.amountG, amount: i.amount, unit: i.unit,
        calories100: i.calories100, fat100: i.fat100, protein100: i.protein100, fiber100: i.fiber100,
        category: i.category, sattmacherExempt: !!i.sattmacherExempt,
      })),
      recipeTotalG: round1(recipeTotals.totalG),
      recipeServings: servings,
      recipeServingG: round1(recipeTotals.totalG / servings),
    };
  }
  // Punktevorschau für das gerade zusammengestellte Rezept — die Zutaten sind schon mit ihren
  // Nährwerten je 100 g gespeichert, also lässt sich derselbe Rechenweg nutzen wie beim Eintragen.
  const recipeDraft = { recipeIngredients, recipeTotalG: recipeTotals.totalG };
  const recipeDraftPoints = recipeTotals.totalG > 0 ? calcRecipePoints(recipeDraft, recipeTotals.totalG, matrix, profile.sattmacherMode) : 0;
  const recipeDraftPortionPoints = recipeTotals.totalG > 0
    ? calcRecipePoints(recipeDraft, recipeTotals.totalG / Math.max(1, Number(recipeServings) || 1), matrix, profile.sattmacherMode)
    : 0;

  function saveRecipe() {
    if (!recipeName.trim() || recipeIngredients.length === 0 || recipeTotals.totalG <= 0) return;
    const newFood = buildRecipeFood();
    if (editingRecipeId) {
      const updatedFood = { ...newFood, id: editingRecipeId };
      setCustomFoods((prev) => prev.map((f) => (f.id === editingRecipeId ? updatedFood : f)));
    } else {
      setCustomFoods((prev) => [newFood, ...prev]);
    }
    resetRecipeBuilder();
  }
  // Speichert das Rezept als eigenes Lebensmittel UND trägt direkt eine Portion als Eintrag ein —
  // für den Rezeptbaukasten-Zugriff direkt beim Essen-Eintragen im Heute-Bereich.
  function saveRecipeAndLog(mealOverride) {
    if (!recipeName.trim() || recipeIngredients.length === 0 || recipeTotals.totalG <= 0) return;
    const newFood = buildRecipeFood();
    setCustomFoods((prev) => [newFood, ...prev]);
    const factor = newFood.recipeServingG / 100;
    const calories = Math.round(newFood.calories * factor);
    const fat = round1(newFood.fat * factor);
    const protein = round1(newFood.protein * factor);
    const fiber = round1(newFood.fiber * factor);
    const points = calcRecipePoints(newFood, newFood.recipeServingG, matrix, profile.sattmacherMode);
    const recipeSnapshot = {
      recipeTotalG: newFood.recipeServingG,
      recipeIngredients: newFood.recipeIngredients.map((ing) => ({ ...ing, amountG: (ing.amountG || 0) * (newFood.recipeServingG / newFood.recipeTotalG) })),
    };
    const entryData = { name: newFood.name, calories, carbs: null, fat, protein, fiber, calcBasis: "kalorien", points, recipeSnapshot, amountG: newFood.recipeServingG, meal: mealOverride || formMeal, createdAt: new Date().toISOString() };

        return updated;
      });
    } else {
      setEntries((prev) => [...prev, { id: newId(), ...entryData }]);
      flashPoints(entryData.points);
    }
    closeForm();
  }

  const recipeIngredientResults =

  function startAddWeightForDay(dayKey) { setAddingWeightDayKey(dayKey); setAddWeightDayValue(""); }
  function saveAddWeightForDay(dayKey) {

            </div>

            <div className="npt-section-title" style={{ marginTop: 4 }}>Trend &amp; Prognose</div>

            {trend && trend.insufficientData && (

            {trend && !trend.insufficientData && (
              <div className={`npt-sample-box ${profile.targetWeightKg && (trend.status === "wrong_direction" || trend.status === "no_trend") ? "warn" : "info"}`} style={{ marginBottom: 16 }}>

                {profile.targetWeightKg && trend.status === "no_trend" && <div style={{ marginTop: 4 }}>Dein Gewicht hält sich aktuell stabil — noch keine klare Richtung erkennbar. Bleib dran, in ein paar Tagen zeigt sich mehr.</div>}

                  <div style={{ marginTop: 8, fontSize: 11, opacity: 0.85 }}>

            {waistEnabled && showWaistTrendLine && waistTrend && !waistTrend.insufficientData && (

                        <div style={{ fontSize: 11.5, color: "var(--chalk-dim)", marginTop: 6 }}>

                  </div>

                  <div className="npt-field">

                        <button key={o.key} className={`npt-chip ${profile.gender === o.key ? "active" : ""}`} onClick={() => setProfile({ ...profile, gender: o.key })}>{o.label}</button>
                      ))}
                    </div>
                  </div>

                  <div className="npt-field"><label>Gewicht (kg)</label><input type="number" value={profile.weightKg} onChange={(ev) => setProfile({ ...profile, weightKg: ev.target.value === "" ? "" : Number(ev.target.value) || 0 })} /></div>
                  <div className="npt-field"><label>Größe (cm)</label><input type="number" value={profile.heightCm} onChange={(ev) => setProfile({ ...profile, heightCm: ev.target.value === "" ? "" : Number(ev.target.value) || 0 })} /></div>
                  <div className="npt-field">
                    <label>Bauchumfang (cm, optional)</label>
                    <input type="number" value={profile.waistCm} onChange={(ev) => setProfile({ ...profile, waistCm: ev.target.value === "" ? "" : Number(ev.target.value) || 0 })} />

                        <button key={o.key} className={`npt-chip ${profile.activity === o.key ? "active" : ""}`} onClick={() => setProfile({ ...profile, activity: o.key })}>{o.label}</button>

                    </div>
                  </div>

                      Standard 00:00. Eingaben zwischen Mitternacht und dieser Uhrzeit zählen noch zum Vortag — praktisch z. B. bei einem langen Abend, damit ein später Drink nicht schon das neue Tageskontingent anbricht.

                  </div>

                  <div className="npt-field">
                    <label>Tägliche Trinkmenge</label>
                    <div className="npt-sample-box info" style={{ marginBottom: 0 }}>
                      Grundbedarf <strong>{(fluidBaseMl / 1000).toFixed(1).replace(".", ",")} l</strong> — 25 ml je kg Körpergewicht, mindestens aber die von der DGE empfohlenen 1,5 l. Machst du Sport, kommen je nach Intensität und Dauer 0,3 bis 0,8 l pro Stunde automatisch dazu, sobald du ihn im Heute-Tab einträgst.
                    </div>
                    <div className="npt-field-hint" style={{ marginTop: 6 }}>Bei Hitze oder Fieber zusätzlich trinken. Bei Herz- oder Nierenerkrankungen gilt eine ärztlich verordnete Trinkmenge vor.</div>

                  <div className="npt-field" ref={setTourRef("profil-sattmacher")}>

                      <input type="checkbox" className="npt-checkbox" checked={profile.sattmacherMode} onChange={(ev) => setProfile({ ...profile, sattmacherMode: ev.target.checked })} aria-label="Sattmacher-Modus" />

                        <div style={{ marginBottom: 6 }}><strong>Sattmacher-Modus:</strong> Lebensmittel der Kategorie "Obst" oder "Gemüse" zählen 0 Punkte, egal wie viel du davon isst (Ausnahmen wie Avocado bleiben normal bepunktet, da sie sehr fettreich ist). Lebensmittel der Kategorie "Kohlenhydrat" (Reis, Nudeln, Kartoffeln u. ä.) sind auf maximal 7 Punkte pro Eintrag gedeckelt, egal wie groß die Portion ist. Alle anderen Kategorien (Fleisch, Fisch, Milchprodukte, Fett/Öl, Süßes, Getränke) werden unverändert normal bepunktet.</div>
                        <div style={{ marginBottom: 6 }}>Die angezeigten Nährwerte (Kalorien, Makros, Diagramme) bleiben in beiden Modi immer ehrlich und unverändert — nur die Punktzahl wird angepasst.</div>
                        <div>Das gilt auch für Rezepte aus dem Rezeptbaukasten: Jede Zutat wird einzeln nach ihrer Kategorie bepunktet, bevor die Punkte zusammengezählt werden. Dein tägliches Punktebudget selbst wird durch den Modus nicht automatisch verändert — falls gewünscht, kannst du das manuell über den Kaloriendefizit-Regler oder die Punkte-Matrix anpassen.</div>
                      </div>

                      </div>

                    <div className="npt-target-breakdown">

            <div className="npt-accordion-section">

                  </div>
                  <div className="npt-field">

                    <input type="range" min="5" max="20" step="1" value={matrix.fatDiv} onChange={(ev) => setMatrix({ ...matrix, fatDiv: Number(ev.target.value) })} />

                  </div>
                  <div className="npt-field">
                    <div className="npt-matrix-label-row">
                      <label>Protein-Divisor <span className="npt-range-val">{matrix.proteinDiv}</span></label>
                      <button className="npt-info-btn npt-matrix-info-btn" onClick={() => setOpenMatrixInfo(openMatrixInfo === "proteinDiv" ? null : "proteinDiv")} aria-label="Protein-Divisor erklären">ⓘ</button>
                    </div>
                    <input type="range" min="5" max="25" step="1" value={matrix.proteinDiv} onChange={(ev) => setMatrix({ ...matrix, proteinDiv: Number(ev.target.value) })} />
                    {openMatrixInfo === "proteinDiv" && <div className="npt-field-hint">Protein senkt die Punktzahl eines Lebensmittels — anders als bei den anderen Reglern zählt hier: niedrigerer Wert = Protein wird stärker belohnt (mehr Punkterabatt). Höherer Wert = Protein zählt weniger.</div>}
                  </div>
                  <div className="npt-field">
                    <div className="npt-matrix-label-row">
                      <label>Ballaststoff-Divisor <span className="npt-range-val">{matrix.fiberDiv}</span></label>
                      <button className="npt-info-btn npt-matrix-info-btn" onClick={() => setOpenMatrixInfo(openMatrixInfo === "fiberDiv" ? null : "fiberDiv")} aria-label="Ballaststoff-Divisor erklären">ⓘ</button>
                    </div>
                    <input type="range" min="2" max="10" step="1" value={matrix.fiberDiv} onChange={(ev) => setMatrix({ ...matrix, fiberDiv: Number(ev.target.value) })} />

                  </div>
                  <div className="npt-field">
                    <div className="npt-matrix-label-row">
                      <label>Ballaststoff-Deckel (g) <span className="npt-range-val">{matrix.fiberCap}</span></label>

                    </div>
                    <input type="range" min="0" max="10" step="1" value={matrix.fiberCap} onChange={(ev) => setMatrix({ ...matrix, fiberCap: Number(ev.target.value) })} />

                      <button className="npt-info-btn npt-matrix-info-btn" onClick={() => setOpenMatrixInfo(openMatrixInfo === "bonusCapPct" ? null : "bonusCapPct")} aria-label="Erkl\u00e4rung zum Abzug-Deckel">\u24d8</button>
                    </div>

                  </div>
                  <div className="npt-field">
                    <div className="npt-matrix-label-row">
                      <label>Sport-Anrechnung (%) <span className="npt-range-val">{Math.round((matrix.sportFactor ?? 0.5) * 100)}</span></label>
                      <button className="npt-info-btn npt-matrix-info-btn" onClick={() => setOpenMatrixInfo(openMatrixInfo === "sportFactor" ? null : "sportFactor")} aria-label="Sport-Anrechnung erklären">ⓘ</button>

                    {openMatrixInfo === "sportFactor" && <div className="npt-field-hint">Legt fest, wie viel Prozent der beim Sport verbrannten Kalorien als zusätzliches Punktebudget gutgeschrieben werden. Höherer Wert = mehr Bonuspunkte pro Trainingseinheit.</div>}

                </div>

            <div className="npt-accordion-section">

                  <input type="file" accept="application/json" ref={fileInputRef} style={{ display: "none" }}
