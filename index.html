                    {searchQuery.trim().length > 1 && !form.selectedFoodId && !(showFoodForm && foodFormContext === "entry") && (
                      <button className="npt-btn-secondary" style={{ width: "100%", marginTop: 8 }}
                        onClick={() => openNewFoodFromSearch(searchQuery.trim(), "entry")}>
                        + "{searchQuery.trim()}" als neues Lebensmittel anlegen
                      </button>
                    )}
                    {showFoodForm && foodFormContext === "entry" && renderFoodForm()}
                    {dropdownOpen && searchResults.length > 0 && (
                      <div className="npt-dropdown">
                        {searchResults.map((f) => (
                          <div key={f.id} className="npt-dropdown-item" onClick={() => selectFood(f)}>
                            <span style={{ overflow: "hidden", textOverflow: "ellipsis", whiteSpace: "nowrap" }}>{f.name}</span>
                            <span style={{ display: "flex", alignItems: "center", gap: 8, flexShrink: 0 }}>
                              <span className="npt-dropdown-kcal">{f.calories} kcal · {calcFoodPointsWithMode(f, matrix, profile.sattmacherMode, f.category, !!f.sattmacherExempt)} P</span>
                              <button className={`npt-fav-btn${favoriteFoodIds.includes(f.id) ? " active" : ""}`} onClick={(ev) => { ev.stopPropagation(); toggleFavorite(f.id); }} aria-label={favoriteFoodIds.includes(f.id) ? "Favorit entfernen" : "Als Favorit markieren"}>
                                <IconHeart size={15} filled={favoriteFoodIds.includes(f.id)} />
                              </button>
                            </span>
                          </div>
                        ))}
                      </div>
                    )}
                  </div>
                )}

                {form.selectedFoodId ? (
                  <>
                    <div className="npt-form-row" style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
                      <div style={{ flex: 1 }}>
                        <label>Menge</label>
                        <input type="number" inputMode="decimal" value={form.amountUnitValue}
                          onChange={(ev) => updateAmountUnit(ev.target.value === "" ? "" : Number(ev.target.value) || 0, form.amountUnit)} />
                      </div>
                      <div style={{ flex: "0 0 84px" }}>
                        <label>Einheit</label>
                        <select value={form.amountUnit} onChange={(ev) => {
                          const food = combinedFoods.find((f) => f.id === form.selectedFoodId);
                          const newUnitValue = amountValueForNewUnit(food, form.amountG, ev.target.value);
                          updateAmountUnit(newUnitValue, ev.target.value);
                        }}>
                          {RECIPE_UNITS.map((u) => <option key={u} value={u}>{u}</option>)}
                        </select>
                      </div>
                    </div>
                    <div className="npt-form-row">
                      <label>Bezeichnung *</label>
                      <input type="text" className={!form.name.trim() ? "npt-input-error" : ""} value={form.name} onChange={(ev) => setForm({ ...form, name: ev.target.value })} />
                    </div>
                    <div className="npt-form-row">
                      <label>Kalorien (kcal) *</label>
                      <input type="number" inputMode="decimal" className={form.calories === "" ? "npt-input-error" : ""} value={form.calories} onChange={(ev) => setForm({ ...form, calories: ev.target.value })} />
                    </div>
                    <div className="npt-form-grid">
                      <div className="npt-form-row"><label>Fett (g)</label><input type="number" inputMode="decimal" value={form.fat} onChange={(ev) => setForm({ ...form, fat: ev.target.value })} /></div>
                      <div className="npt-form-row"><label>Protein (g)</label><input type="number" inputMode="decimal" value={form.protein} onChange={(ev) => setForm({ ...form, protein: ev.target.value })} /></div>
                      <div className="npt-form-row"><label>Ballaststoffe (g)</label><input type="number" inputMode="decimal" value={form.fiber} onChange={(ev) => setForm({ ...form, fiber: ev.target.value })} /></div>
                    </div>
                    {computeFormPreviewPoints() !== null && (
                      <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
                        ≈ <strong className="npt-font-display">{computeFormPreviewPoints()} Punkte</strong> für {form.amountUnitValue} {form.amountUnit}
                      </div>
                    )}
                  </>
                ) : entryMethod === "manual" ? (
                  <>
                    <div className="npt-form-row">
                      <label>Bezeichnung *</label>
                      <input type="text" placeholder="z. B. Makrelenhäppchen" className={!form.name.trim() ? "npt-input-error" : ""} value={form.name} onChange={(ev) => setForm({ ...form, name: ev.target.value })} />
                    </div>
                    <div className="npt-form-row" style={{ display: "flex", gap: 8, alignItems: "flex-end" }}>
                      <div style={{ flex: 1 }}>
                        <label>Menge, die du isst</label>
                        <input type="number" inputMode="decimal" value={form.amountUnitValue}
                          onChange={(ev) => {
                            const raw = ev.target.value;
                            const grams = raw === "" ? "" : resolveAmountToGrams(null, raw, form.amountUnit);
                            setForm({ ...form, amountUnitValue: raw, amountG: grams === "" ? "" : round1(grams) });
                          }} />
                      </div>
                      <div style={{ flex: "0 0 84px" }}>
                        <label>Einheit</label>
                        <select value={form.amountUnit} onChange={(ev) => {
                          const newUnitValue = amountValueForNewUnit(null, form.amountG, ev.target.value);
                          const grams = resolveAmountToGrams(null, newUnitValue, ev.target.value);
                          setForm({ ...form, amountUnit: ev.target.value, amountUnitValue: newUnitValue, amountG: round1(grams) });
                        }}>
                          {RECIPE_UNITS.map((u) => <option key={u} value={u}>{u}</option>)}
                        </select>
                      </div>
                    </div>

                    {nutrientBasis === "kalorien" ? (
                      <div className="npt-form-row">
                        <label>Kalorien je 100g (kcal) *</label>
                        <input type="number" inputMode="decimal" className={form.calories === "" ? "npt-input-error" : ""} value={form.calories} onChange={(ev) => setForm({ ...form, calories: ev.target.value })} />
                      </div>
                    ) : (
                      <div className="npt-form-row">
                        <label>Kohlenhydrate je 100g (g) *</label>
                        <input type="number" inputMode="decimal" className={form.carbs === "" ? "npt-input-error" : ""} value={form.carbs} onChange={(ev) => setForm({ ...form, carbs: ev.target.value })} />
                      </div>
                    )}

                    <div className="npt-form-grid">
                      <div className="npt-form-row"><label>Fett je 100g (g)</label><input type="number" inputMode="decimal" value={form.fat} onChange={(ev) => setForm({ ...form, fat: ev.target.value })} /></div>
                      <div className="npt-form-row"><label>Protein je 100g (g)</label><input type="number" inputMode="decimal" value={form.protein} onChange={(ev) => setForm({ ...form, protein: ev.target.value })} /></div>
                      <div className="npt-form-row"><label>Ballaststoffe je 100g (g)</label><input type="number" inputMode="decimal" value={form.fiber} onChange={(ev) => setForm({ ...form, fiber: ev.target.value })} /></div>
                    </div>

                    {nutrientBasis === "kohlenhydrate" && (
                      <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
                        ≈ berechnete Kalorien je 100g: <strong>{Math.round((Number(form.carbs) || 0) * 4 + (Number(form.protein) || 0) * 4 + (Number(form.fat) || 0) * 9)} kcal</strong> (4 kcal/g Kohlenhydrate + 4 kcal/g Protein + 9 kcal/g Fett)
                      </div>
                    )}

                    {computeFormPreviewPoints() !== null && (
                      <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
                        ≈ <strong className="npt-font-display">{computeFormPreviewPoints()} Punkte</strong> für {form.amountUnitValue} {form.amountUnit}
                      </div>
                    )}

                    <div className="npt-form-row">
                      <label>Kategorie (optional)</label>
                      <select value={form.category} onChange={(ev) => setForm({ ...form, category: ev.target.value })}>
                        <option value="">– keine –</option>
                        {FOOD_CATEGORIES.map((c) => <option key={c} value={c}>{c}</option>)}
                      </select>
                      <div className="npt-field-hint">Wird für den Sattmacher-Modus gebraucht: "Obst"/"Gemüse" zählen dort 0 Punkte, "Kohlenhydrat" ist auf max. 7 Punkte gedeckelt.</div>
                    </div>

                    <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
                      Wird automatisch als eigenes Lebensmittel gespeichert, damit du "{form.name.trim() || "es"}" beim nächsten Mal direkt in der Suche findest.
                    </div>
                  </>
                ) : (
                  <div className="npt-empty">Tippe oben in die Suche, um ein Lebensmittel zu finden.</div>
                )}

                <div className="npt-form-actions">
                  <button className="npt-btn-secondary" onClick={closeForm}>Abbrechen</button>
                  <button className="npt-btn-primary" onClick={addEntry} disabled={!form.name.trim() || (form.selectedFoodId ? form.calories === "" : (nutrientBasis === "kalorien" ? form.calories === "" : form.carbs === ""))}>{editingEntryId ? "Speichern" : "Hinzufügen"}</button>
                </div>
              </>
            )}

            {entryMethod === "manual" && formMode === "punkte" && (
              <>
                <div className="npt-form-row">
                  <label>Eigenes Gericht suchen (optional)</label>
                  <input type="text" placeholder="z. B. Frühstück, Mittagessen A…" value={dishSearchQuery}
                    onChange={(ev) => { setDishSearchQuery(ev.target.value); setPointForm((f) => ({ ...f, selectedDishId: null })); setDishDropdownOpen(true); }}
                    onFocus={() => setDishDropdownOpen(true)} />
                  {dishDropdownOpen && dishSearchResults.length > 0 && (
                    <div className="npt-dropdown">
                      {dishSearchResults.map((d) => (
                        <button key={d.id} className="npt-dropdown-item" onClick={() => selectDish(d)}>
                          <span>{d.name}</span><span className="npt-dropdown-kcal">{d.points} Punkte</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>
                <div className="npt-form-row">
                  <label>Bezeichnung *</label>
                  <input type="text" placeholder="z. B. Frühstück" className={!pointForm.name.trim() ? "npt-input-error" : ""} value={pointForm.name} onChange={(ev) => setPointForm({ ...pointForm, name: ev.target.value })} />
                </div>
                <div className="npt-form-row">
                  <label>Punkte *</label>
                  <input type="number" inputMode="decimal" step="0.5" className={pointForm.points === "" ? "npt-input-error" : ""} value={pointForm.points} onChange={(ev) => setPointForm({ ...pointForm, points: ev.target.value })} />
                </div>
                <div className="npt-form-actions">
                  <button className="npt-btn-secondary" onClick={closeForm}>Abbrechen</button>
                  <button className="npt-btn-primary" onClick={addDirectEntry} disabled={!pointForm.name.trim() || pointForm.points === ""}>{editingEntryId ? "Speichern" : "Hinzufügen"}</button>
                </div>
              </>
            )}
              </>
            )}
          </div>
        </div>
      )}

      {showScanner && (
        <div className="npt-scanner-overlay">
          <div className="npt-scanner-box">
            <div ref={scannerContainerRef} className="npt-scanner-video"></div>
            <div className="npt-scanner-hint">
              {scanStatus === "scanning" && "Barcode in den Rahmen halten …"}
              {scanStatus === "looking-up" && "Suche Produkt bei OpenFoodFacts …"}
              {scanStatus === "notfound" && "Produkt nicht in der Datenbank gefunden. Bitte manuell eintragen."}
              {scanStatus === "error" && "Kamera nicht verfügbar oder Zugriff verweigert. Funktioniert nur über https:// (z. B. GitHub Pages), nicht als lokale Datei."}
            </div>
            <button className="npt-btn-secondary" style={{ width: "100%", marginTop: 12 }} onClick={stopScanner}>Abbrechen</button>
          </div>
        </div>
      )}

      {confirmDialog && (
        <div className="npt-confirm-overlay" onClick={() => setConfirmDialog(null)}>
          <div className="npt-confirm-box" onClick={(ev) => ev.stopPropagation()}>
            <div className="npt-confirm-text">{confirmDialog.message}</div>
            <div style={{ display: "flex", gap: 8 }}>
              <button className="npt-btn-secondary" style={{ flex: 1 }} onClick={() => setConfirmDialog(null)}>Abbrechen</button>
              <button className="npt-btn-danger" style={{ flex: 1 }} onClick={() => { const fn = confirmDialog.onConfirm; setConfirmDialog(null); fn(); }}>Löschen</button>
            </div>
          </div>
        </div>
      )}

      {undoToast && (
        <div className="npt-toast">
          <span>{undoToast.message}</span>
          <button onClick={undoLastDelete}>Rückgängig</button>
        </div>
      )}

      {celebration && (
        <div className="npt-confetti" aria-hidden="true">
          {CONFETTI_PIECES.map((p, i) => (
            <span key={i} style={{ left: `${p.left}%`, background: p.color, animationDelay: `${p.delay}s` }} />
          ))}
        </div>
      )}

      <div className="npt-tabbar">
        <button className={`npt-tab ${tab === "heute" ? "active" : ""}`} onClick={() => setTab("heute")}><IconUtensils size={18} />Heute</button>
        <button className={`npt-tab ${tab === "ernaehrung" ? "active" : ""}`} onClick={() => setTab("ernaehrung")}><IconDroplet size={18} />Ernährung</button>
        <button className={`npt-tab ${tab === "lebensmittel" ? "active" : ""}`} onClick={() => setTab("lebensmittel")}><IconBasket size={18} />Lebensmittel</button>
        <button className={`npt-tab ${tab === "verlauf" ? "active" : ""}`} onClick={() => setTab("verlauf")}><IconHistory size={18} />Verlauf</button>
        <button className={`npt-tab ${tab === "profil" ? "active" : ""}`} onClick={() => setTab("profil")}><IconSliders size={18} />Einstellungen</button>
      </div>

      {tourActive && TOUR_STEPS[tourStep] && (
        <div className="npt-tour-overlay">
          {tourSpotlight ? (
            <div className="npt-tour-hole" style={{
              top: tourSpotlight.top - 8, left: tourSpotlight.left - 8,
              width: tourSpotlight.width + 16, height: tourSpotlight.height + 16,
            }} />
          ) : (
            <div className="npt-tour-dim" />
          )}
          <div className="npt-tour-card" style={tourCardStyle}>
            <div className="npt-tour-card-header">
              <div className="npt-tour-card-title">{TOUR_STEPS[tourStep].title}</div>
              <button className="npt-info-btn" onClick={() => (tourSpeaking ? stopTourSpeech() : speakTourStep())} aria-label={tourSpeaking ? "Vorlesen stoppen" : "Vorlesen"}>
                {tourSpeaking ? "◼" : "🔊"}
              </button>
            </div>
            <div className="npt-tour-card-text">{TOUR_STEPS[tourStep].text}</div>
            <div className="npt-tour-dots">
              {TOUR_STEPS.map((s, i) => (
                <button key={s.id} className={`npt-tour-dot ${i === tourStep ? "active" : ""}`} onClick={() => goToTourStep(i)} aria-label={`Zu Schritt ${i + 1}: ${s.title}`} />
              ))}
            </div>
            <div className="npt-tour-actions">
              <button className="npt-btn-secondary" onClick={endTour}>Beenden</button>
              <div style={{ display: "flex", gap: 8 }}>
                {tourStep > 0 && <button className="npt-btn-secondary" onClick={prevTourStep}>‹ Zurück</button>}
                <button className="npt-btn-primary" onClick={nextTourStep}>{tourStep === TOUR_STEPS.length - 1 ? "Fertig" : "Weiter ›"}</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

// Erst wiederherstellen (falls nötig), dann rendern — sonst läse die App einen leeren Speicher.
restoreFromMirror().then(() => {
  ReactDOM.createRoot(document.getElementById("root")).render(<NutritionPointsTracker />);
});
</script>

<script>
  // Service Worker nur registrieren, wenn über https:// (oder localhost)
  // aufgerufen — genau wie beim Kamera-Scan ist das eine Voraussetzung des
  // Browsers, kein Bug. Als lokale file:// -Datei greift das nicht, dort
  // läuft die App aber ohnehin nur eingeschränkt (siehe Kamera-Scan-Hinweis).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
