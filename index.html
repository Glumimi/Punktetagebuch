// ---------- lokale Speicherung (im Browser dieses Geräts) ----------

const STORAGE_PREFIX = "npt:";

function storageGet(key) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw === null ? null : { value: raw };
  } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, value); return true; } catch (e) { return false; }
}
function storageListKeys() {
  const keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const fullKey = localStorage.key(i);
      if (fullKey && fullKey.startsWith(STORAGE_PREFIX)) keys.push(fullKey.slice(STORAGE_PREFIX.length));
    }
  } catch (e) {}
  return keys;
}

// ---------- Hilfsfunktionen ----------

function dateKeyFor(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayKey() { return dateKeyFor(new Date()); }
function weekKey() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d);
  monday.setDate(diff);
  return dateKeyFor(monday);
}
function round1(x) { return Math.round(x * 10) / 10; }

function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function isoWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const diff = d - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
}

function formatShortDate(d) {
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
}

function calcDailyTarget(p, matrix) {
  let bmrOffset;
  if (p.gender === "mann") bmrOffset = 5;
  else if (p.gender === "frau") bmrOffset = -161;
  else bmrOffset = -78;
  const bmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * p.age + bmrOffset;
  const activityFactorMap = { sitzend: 1.2, stehend: 1.375, gehend: 1.55, schwer: 1.725 };
  const activityFactor = activityFactorMap[p.activity] ?? 1.2;
  const tdee = bmr * activityFactor;
  const deficitFactor = 1 - (Number(p.deficitPercent) || 0) / 100;
  const rawCalorieTarget = tdee * deficitFactor;
  const floorApplied = rawCalorieTarget < 1200;
  const calorieTarget = Math.max(rawCalorieTarget, 1200);
  const total = Math.max(0, Math.round(calorieTarget / matrix.calDiv));
  return { total, bmr: Math.round(bmr), tdee: Math.round(tdee), calorieTarget: Math.round(calorieTarget), floorApplied };
}

function calcFoodPoints(food, matrix) {
  const fiberUsed = Math.min(Number(food.fiber) || 0, matrix.fiberCap);
  const raw =
    (Number(food.calories) || 0) / matrix.calDiv +
    (Number(food.fat) || 0) / matrix.fatDiv -
    fiberUsed / matrix.fiberDiv -
    (Number(food.protein) || 0) / matrix.proteinDiv;
  return Math.max(0, Math.round(raw));
}

function dayStatus(used, target) {
  if (used === null || !target) return { ratio: 0, color: "var(--line)" };
  const ratio = target > 0 ? used / target : 0;
  const color = ratio <= 0.8 ? "var(--teal)" : ratio <= 1 ? "var(--amber)" : "var(--coral)";
  return { ratio, color };
}

// Berechnet eine Achsen-Domäne, die sich an den tatsächlichen Datenwerten orientiert (nicht an
// Ziel-/Prognoselinien), mit Puffer nach oben UND unten, damit Schwankungen gut ablesbar sind.
function computeAxisDomain(values, paddingRatio, minPadding, floorAtZero) {
  const nums = values.filter((v) => v !== null && v !== undefined && !isNaN(v));
  if (nums.length === 0) return [null, null];
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const range = max - min;
  const pad = Math.max(minPadding, range * paddingRatio, Math.abs(max) * 0.02);
  let lo = round1(min - pad);
  let hi = round1(max + pad);
  if (floorAtZero && lo < 0) lo = 0;
  return [lo, hi];
}

// Trendprognose: lineare Regression über die 7-Tage-geglätteten Gewichtswerte der letzten 3 Wochen.
// Braucht mind. 10 Tage mit Daten in diesem Fenster, sonst gilt die Prognose als nicht verlässlich.
function computeWeightTrend(weightLog, targetWeightKg) {
  if (weightLog.length === 0) return { insufficientData: true };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const windowDays = 21;
  const totalDays = windowDays + 7;
  const dailyMap = {};
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = dateKeyFor(d);
    const entries = weightLog.filter((w) => dateKeyFor(new Date(w.timestamp)) === key);
    dailyMap[key] = entries.length > 0 ? entries.reduce((s, w) => s + w.weightKg, 0) / entries.length : null;
  }
  function maFor(targetDate) {
    const vals = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(targetDate);
      d.setDate(d.getDate() - i);
      const v = dailyMap[dateKeyFor(d)];
      if (v !== null && v !== undefined) vals.push(v);
    }
    return vals.length > 0 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }
  const regressionPoints = [];
  for (let i = windowDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ma = maFor(d);
    if (ma !== null) regressionPoints.push({ x: windowDays - 1 - i, y: ma });
  }
  if (regressionPoints.length < 10) return { insufficientData: true };

  const n = regressionPoints.length;
  const sumX = regressionPoints.reduce((s, p) => s + p.x, 0);
  const sumY = regressionPoints.reduce((s, p) => s + p.y, 0);
  const sumXY = regressionPoints.reduce((s, p) => s + p.x * p.y, 0);
  const sumX2 = regressionPoints.reduce((s, p) => s + p.x * p.x, 0);
  const denom = n * sumX2 - sumX * sumX;
  if (denom === 0) return { insufficientData: true };
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  const todayX = windowDays - 1;
  const predictedToday = slope * todayX + intercept;
  const meaningfulSlope = Math.abs(slope) > 0.01 / 7;

  let targetDate = null;
  let daysToTarget = null;
  if (targetWeightKg && meaningfulSlope) {
    const xTarget = (targetWeightKg - intercept) / slope;
    const dt = Math.round(xTarget - todayX);
    if (dt > 0) {
      daysToTarget = dt;
      targetDate = new Date(today);
      targetDate.setDate(targetDate.getDate() + dt);
    }
  }

  let status;
  if (targetWeightKg && Math.abs(predictedToday - targetWeightKg) < 0.3) status = "reached";
  else if (!meaningfulSlope) status = "no_trend";
  else if (targetWeightKg && daysToTarget === null) status = "wrong_direction";
  else status = "on_track";

  return {
    insufficientData: false,
    slope,
    slopePerWeek: round1(slope * 7),
    predictedToday: round1(predictedToday),
    targetDate,
    daysToTarget,
    status,
  };
}

  function avgInRange(log, field, startDate, endDate) {
    const startKey = dateKeyFor(startDate);

      return k >= startKey && k <= endKey;

    if (entries.length === 0) return null;

                    <label>Geschlecht (fließt in den Grundumsatz ein)</label>
                    <div className="npt-chip-row">
                      {[{ key: "frau", label: "Weiblich" }, { key: "mann", label: "Männlich" }, { key: "neutral", label: "Neutral" }].map((o) => (
                        <button key={o.key} className={`npt-chip ${profile.gender === o.key ? "active" : ""}`} onClick={() => setProfile({ ...profile, gender: o.key })}>{o.label}</button>
                      ))}
                    </div>
                  </div>

                  <div className="npt-field"><label>Gewicht (kg)</label><input type="number" value={profile.weightKg} onChange={(ev) => setProfile({ ...profile, weightKg: Number(ev.target.value) || 0 })} /></div>
                  <div className="npt-field"><label>Größe (cm)</label><input type="number" value={profile.heightCm} onChange={(ev) => setProfile({ ...profile, heightCm: Number(ev.target.value) || 0 })} /></div>
                  <div className="npt-field"><label>Alter</label><input type="number" value={profile.age} onChange={(ev) => setProfile({ ...profile, age: Number(ev.target.value) || 0 })} /></div>

                  <div className="npt-field">
                    <label>Grundaktivität im Alltag (nicht das Training selbst)</label>
                    <div className="npt-chip-row">
                      {[{ key: "sitzend", label: "Überwiegend sitzend" }, { key: "stehend", label: "Überwiegend stehend" }, { key: "gehend", label: "Viel zu Fuß" }, { key: "schwer", label: "Körperlich schwer" }].map((o) => (
                        <button key={o.key} className={`npt-chip ${profile.activity === o.key ? "active" : ""}`} onClick={() => setProfile({ ...profile, activity: o.key })}>{o.label}</button>
                      ))}
                    </div>
                  </div>

                  <div className="npt-field">
                    <label>Kaloriendefizit für Abnehmziel (%) <span className="npt-range-val">{profile.deficitPercent}</span></label>
                    <input type="range" min="0" max="35" step="5" value={profile.deficitPercent} onChange={(ev) => setProfile({ ...profile, deficitPercent: Number(ev.target.value) })} />
                  </div>

                  <div className="npt-target-box">
                    <div className="npt-target-num">{target.total} Punkte / Tag</div>
                    <div className="npt-target-breakdown">
                      Grundumsatz {target.bmr} kcal · Gesamtumsatz {target.tdee} kcal · Kalorienziel {target.calorieTarget} kcal
                      {target.floorApplied ? " (auf 1200 kcal als Sicherheitsuntergrenze angehoben)" : ""}
                    </div>
                  </div>
                </div>
              )}
            </div>

            <div className="npt-accordion-section">
              <button className={`npt-accordion-header ${openProfilSection === "matrix" ? "open" : ""}`} onClick={() => setOpenProfilSection(openProfilSection === "matrix" ? null : "matrix")}>
                <span>Punkte-Matrix</span>
                <IconChevronDown size={18} />
              </button>
              {openProfilSection === "matrix" && (
                <div className="npt-accordion-body">
                  <div className="npt-field"><label>Kalorien-Divisor <span className="npt-range-val">{matrix.calDiv}</span></label><input type="range" min="20" max="80" step="1" value={matrix.calDiv} onChange={(ev) => setMatrix({ ...matrix, calDiv: Number(ev.target.value) })} /></div>
                  <div className="npt-field"><label>Fett-Divisor <span className="npt-range-val">{matrix.fatDiv}</span></label><input type="range" min="5" max="20" step="1" value={matrix.fatDiv} onChange={(ev) => setMatrix({ ...matrix, fatDiv: Number(ev.target.value) })} /></div>
                  <div className="npt-field"><label>Protein-Divisor (höher = Protein zählt weniger) <span className="npt-range-val">{matrix.proteinDiv}</span></label><input type="range" min="5" max="25" step="1" value={matrix.proteinDiv} onChange={(ev) => setMatrix({ ...matrix, proteinDiv: Number(ev.target.value) })} /></div>
                  <div className="npt-field"><label>Ballaststoff-Divisor <span className="npt-range-val">{matrix.fiberDiv}</span></label><input type="range" min="2" max="10" step="1" value={matrix.fiberDiv} onChange={(ev) => setMatrix({ ...matrix, fiberDiv: Number(ev.target.value) })} /></div>
                  <div className="npt-field"><label>Ballaststoff-Deckel (g) <span className="npt-range-val">{matrix.fiberCap}</span></label><input type="range" min="0" max="10" step="1" value={matrix.fiberCap} onChange={(ev) => setMatrix({ ...matrix, fiberCap: Number(ev.target.value) })} /></div>
                  <div className="npt-field"><label>Sport-Anrechnung (%) <span className="npt-range-val">{Math.round((matrix.sportFactor ?? 0.5) * 100)}</span></label><input type="range" min="0" max="100" step="5" value={Math.round((matrix.sportFactor ?? 0.5) * 100)} onChange={(ev) => setMatrix({ ...matrix, sportFactor: Number(ev.target.value) / 100 })} /></div>
                  <div className="npt-sample-box info">Beispiel: 250 kcal · 10 g Fett · 20 g Protein · 3 g Ballaststoffe → <strong>{samplePoints} Punkte</strong></div>
                  <button className="npt-reset-btn" onClick={() => setMatrix(DEFAULT_MATRIX)}><IconReset size={14} /> Matrix auf Standard zurücksetzen</button>
                </div>
              )}
            </div>

            <div className="npt-accordion-section">
              <button className={`npt-accordion-header ${openProfilSection === "dishes" ? "open" : ""}`} onClick={() => setOpenProfilSection(openProfilSection === "dishes" ? null : "dishes")}>
                <span>Eigene Gerichte (Punkte direkt){customDishes.length > 0 ? ` · ${customDishes.length}` : ""}</span>
                <IconChevronDown size={18} />
              </button>
              {openProfilSection === "dishes" && (
                <div className="npt-accordion-body">
                  {customDishes.length === 0 && <div className="npt-empty">Noch keine eigenen Gerichte gespeichert. Sie entstehen automatisch, sobald du beim Eintragen "Punkte direkt" nutzt.</div>}
                  {customDishes.map((d) => (
                    <div className="npt-entry-row" key={d.id}>
                      <div className="npt-entry-name">{d.name}</div>
                      <div style={{ display: "flex", alignItems: "center" }}>
                        <div className="npt-entry-points npt-font-display">{d.points}</div>
                        <button className="npt-del-btn" onClick={() => deleteDish(d.id)} aria-label="Gericht löschen"><IconTrash size={16} /></button>
                      </div>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="npt-accordion-section">
              <button className={`npt-accordion-header ${openProfilSection === "foods" ? "open" : ""}`} onClick={() => setOpenProfilSection(openProfilSection === "foods" ? null : "foods")}>
                <span>Eigene Lebensmittel (je 100g){customFoods.length > 0 ? ` · ${customFoods.length}` : ""}</span>
                <IconChevronDown size={18} />
              </button>
              {openProfilSection === "foods" && (
                <div className="npt-accordion-body">
                  {customFoods.length === 0 && <div className="npt-empty">Noch keine eigenen Lebensmittel gespeichert. Sie entstehen automatisch, wenn du beim Eintragen "Als eigenes Lebensmittel speichern" ankreuzt.</div>}
                  {customFoods.map((f) => (
                    <div className="npt-entry-row" key={f.id}>
                      <div>
                        <div className="npt-entry-name">{f.name}</div>
                        <div className="npt-entry-meta">{f.calories} kcal · {f.fat} g Fett · {f.protein} g Protein · {f.fiber} g Ballaststoffe (je 100g)</div>
                      </div>
                      <button className="npt-del-btn" onClick={() => deleteFood(f.id)} aria-label="Lebensmittel löschen"><IconTrash size={16} /></button>
                    </div>
                  ))}
                </div>
              )}
            </div>

            <div className="npt-accordion-section">
              <button className={`npt-accordion-header ${openProfilSection === "backup" ? "open" : ""}`} onClick={() => setOpenProfilSection(openProfilSection === "backup" ? null : "backup")}>
                <span>Datensicherung</span>
                <IconChevronDown size={18} />
              </button>
              {openProfilSection === "backup" && (
                <div className="npt-accordion-body">
                  <div className="npt-sample-box info" style={{ marginBottom: 12 }}>
                    Enthält Profil, Matrix, eigene Gerichte/Lebensmittel, deinen Gewichtsverlauf und deinen kompletten bisherigen Punkte-Verlauf. Speichere die Datei z. B. in Google Drive, Dropbox oder einem privaten GitHub-Repo, um Datenverlust vorzubeugen.
                  </div>
                  <div className="npt-form-actions">
                    <button className="npt-btn-secondary" onClick={exportBackup}><IconDownload size={14} />Backup exportieren</button>
                    <button className="npt-btn-secondary" onClick={() => fileInputRef.current && fileInputRef.current.click()}><IconUpload size={14} />Backup importieren</button>
                  </div>
                  <input type="file" accept="application/json" ref={fileInputRef} style={{ display: "none" }}
                    onChange={(ev) => { const f = ev.target.files[0]; if (f) setPendingImportFile(f); ev.target.value = ""; }} />
                  {pendingImportFile && (
                    <div className="npt-sample-box warn" style={{ marginTop: 12 }}>
                      <div style={{ marginBottom: 10 }}>
                        Alle aktuellen Daten (Profil, Matrix, Verlauf, Gewicht, Bauchumfang, eigene Gerichte/Lebensmittel) werden durch den Inhalt von <strong>„{pendingImportFile.name}“</strong> ersetzt. Das lässt sich nicht rückgängig machen.
                      </div>
                      <div className="npt-form-actions">
                        <button className="npt-btn-secondary" onClick={cancelImport}>Abbrechen</button>
                        <button className="npt-btn-primary" style={{ background: "var(--coral)" }} onClick={confirmImport}>Ja, überschreiben</button>
                      </div>
                    </div>
                  )}
                  {backupMessage && <div className="npt-gauge-sub" style={{ marginTop: 10 }}>{backupMessage}</div>}
                </div>
              )}
            </div>
          </>
        )}
      </div>

      {showScanner && (
        <div className="npt-scanner-overlay">
          <div className="npt-scanner-box">
            <div ref={scannerContainerRef} className="npt-scanner-video"></div>
            <div className="npt-scanner-hint">
              {scanStatus === "scanning" && "Barcode in den Rahmen halten …"}
              {scanStatus === "looking-up" && "Suche Produkt bei OpenFoodFacts …"}
              {scanStatus === "notfound" && "Produkt nicht in der Datenbank gefunden. Bitte manuell eintragen."}
              {scanStatus === "error" && "Kamera nicht verfügbar oder Zugriff verweigert. Funktioniert nur über https:// (z. B. GitHub Pages), nicht als lokale Datei."}
            </div>
            <button className="npt-btn-secondary" style={{ width: "100%", marginTop: 12 }} onClick={stopScanner}>Abbrechen</button>
          </div>
        </div>
      )}

      {undoToast && (
        <div className="npt-toast">
          <span>{undoToast.message}</span>
          <button onClick={undoLastDelete}>Rückgängig</button>
        </div>
      )}

      <div className="npt-tabbar">
        <button className={`npt-tab ${tab === "heute" ? "active" : ""}`} onClick={() => setTab("heute")}><IconUtensils size={18} />Heute</button>
        <button className={`npt-tab ${tab === "verlauf" ? "active" : ""}`} onClick={() => setTab("verlauf")}><IconHistory size={18} />Verlauf</button>
        <button className={`npt-tab ${tab === "gewicht" ? "active" : ""}`} onClick={() => setTab("gewicht")}><IconLineChart size={18} />Gewicht</button>
        <button className={`npt-tab ${tab === "profil" ? "active" : ""}`} onClick={() => setTab("profil")}><IconSliders size={18} />Profil</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NutritionPointsTracker />);
</script>
</body>
</html>
