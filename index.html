// ---------- lokale Speicherung (im Browser dieses Geräts) ----------

const STORAGE_PREFIX = "npt:";

function storageGet(key) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw === null ? null : { value: raw };
  } catch (e) {
    return null;
  }
}

function storageSet(key, value) {
  try {
    localStorage.setItem(STORAGE_PREFIX + key, value);
    return true;
  } catch (e) {
    return false;
  }
}

// ---------- Hilfsfunktionen ----------

function dateKeyFor(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayKey() { return dateKeyFor(new Date()); }
function weekKey() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d);
  monday.setDate(diff);
  return dateKeyFor(monday);
}
function round1(x) { return Math.round(x * 10) / 10; }

function calcDailyTarget(p) {
  const weightLbs = p.weightKg * 2.20462;
  const weightPoints = Math.floor(weightLbs * 0.1);
  const genderPoints = p.gender === "mann" ? 8 : p.gender === "frau" ? 2 : 5;
  let agePoints;
  if (p.age <= 26) agePoints = 4;
  else if (p.age <= 37) agePoints = 3;
  else if (p.age <= 47) agePoints = 2;
  else if (p.age <= 58) agePoints = 1;
  else agePoints = 0;
  const heightIn = p.heightCm / 2.54;
  let heightPoints;
  if (heightIn < 61) heightPoints = 0;
  else if (heightIn <= 70) heightPoints = 1;
  else heightPoints = 2;
  const activityMap = { sitzend: 0, stehend: 2, gehend: 4, schwer: 6 };
  const activityPoints = activityMap[p.activity] ?? 0;
  const rawTotal = weightPoints + genderPoints + agePoints + heightPoints + activityPoints;
  const total = Math.min(44, Math.max(18, rawTotal));
  return { total, weightPoints, genderPoints, agePoints, heightPoints, activityPoints, rawTotal };
}

function calcFoodPoints(food, matrix) {
  const fiberUsed = Math.min(Number(food.fiber) || 0, matrix.fiberCap);
  const raw =
    (Number(food.calories) || 0) / matrix.calDiv +
    (Number(food.fat) || 0) / matrix.fatDiv -
    fiberUsed / matrix.fiberDiv -
    (Number(food.protein) || 0) / matrix.proteinDiv;
  return Math.max(0, Math.round(raw));
}

function dayStatus(used, target) {
  if (used === null || !target) return { ratio: 0, color: "var(--line)" };
  const ratio = target > 0 ? used / target : 0;
  const color = ratio <= 0.8 ? "var(--teal)" : ratio <= 1 ? "var(--amber)" : "var(--coral)";
  return { ratio, color };
}

const DEFAULT_PROFILE = { gender: "neutral", weightKg: 86, heightCm: 186, age: 42, activity: "sitzend" };
const DEFAULT_MATRIX = { calDiv: 50, fatDiv: 12, proteinDiv: 10, fiberDiv: 5, fiberCap: 4 };
const SAMPLE_FOOD = { calories: 250, fat: 10, protein: 20, fiber: 3 };
const WEEKLY_FLEX_TOTAL = 35;
const EMPTY_FORM = { name: "", calories: "", fat: "", protein: "", fiber: "", amountG: 100, selectedFoodId: null };

// ---------- Komponente ----------

function NutritionPointsTracker() {
  const [tab, setTab] = useState("heute");
  const [loaded, setLoaded] = useState(false);
  const [profile, setProfile] = useState(DEFAULT_PROFILE);
  const [matrix, setMatrix] = useState(DEFAULT_MATRIX);
  const [entries, setEntries] = useState([]);
  const [flexUsed, setFlexUsed] = useState(0);
  const [historyDays, setHistoryDays] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [form, setForm] = useState(EMPTY_FORM);
  const [searchQuery, setSearchQuery] = useState("");
  const [dropdownOpen, setDropdownOpen] = useState(false);
  const [saveError, setSaveError] = useState(false);
  const [backupMessage, setBackupMessage] = useState("");
  const fileInputRef = useRef(null);

  useEffect(() => {
    const s = storageGet("settings");
    if (s && s.value) {
      try {
        const parsed = JSON.parse(s.value);
        if (parsed.profile) setProfile((prev) => ({ ...prev, ...parsed.profile }));
        if (parsed.matrix) setMatrix((prev) => ({ ...prev, ...parsed.matrix }));
      } catch (e) {}
    }
    const l = storageGet(`log:${todayKey()}`);
    if (l && l.value) {
      try {
        const parsed = JSON.parse(l.value);
        setEntries(Array.isArray(parsed) ? parsed : parsed.entries || []);
      } catch (e) {}
    }
    const f = storageGet(`flex:${weekKey()}`);
    if (f && f.value) setFlexUsed(Number(f.value) || 0);

    const days = [];
    for (let i = 6; i >= 1; i--) {
      const d = new Date();
      d.setDate(d.getDate() - i);
      const key = dateKeyFor(d);
      const label = d.toLocaleDateString("de-DE", { weekday: "short" });
      const res = storageGet(`log:${key}`);
      if (res && res.value) {
        try {
          const parsed = JSON.parse(res.value);
          const list = Array.isArray(parsed) ? parsed : parsed.entries || [];
          const dayUsed = list.reduce((s, e) => s + e.points, 0);
          days.push({ key, label, used: dayUsed, target: (!Array.isArray(parsed) && parsed.target) || null });
        } catch (e) {
          days.push({ key, label, used: null, target: null });
        }
      } else {
        days.push({ key, label, used: null, target: null });
      }
    }
    setHistoryDays(days);
    setLoaded(true);
  }, []);

  useEffect(() => {
    if (!loaded) return;
    const ok = storageSet("settings", JSON.stringify({ profile, matrix }));
    setSaveError(!ok);
  }, [profile, matrix, loaded]);

  const target = calcDailyTarget(profile);

  useEffect(() => {
    if (!loaded) return;
    const ok = storageSet(`log:${todayKey()}`, JSON.stringify({ target: target.total, entries }));
    setSaveError(!ok);
  }, [entries, loaded, target.total]);

  useEffect(() => {
    if (!loaded) return;
    const ok = storageSet(`flex:${weekKey()}`, String(flexUsed));
    setSaveError(!ok);
  }, [flexUsed, loaded]);

  const used = entries.reduce((sum, e) => sum + e.points, 0);
  const remaining = target.total - used;
  const ratio = target.total > 0 ? used / target.total : 0;
  const status = ratio <= 0.8 ? "teal" : ratio <= 1 ? "amber" : "coral";

  const r = 74;
  const circumference = 2 * Math.PI * r;
  const dashOffset = circumference * (1 - Math.min(ratio, 1));

  const searchResults =
    searchQuery.trim().length > 0 && !form.selectedFoodId
      ? FOOD_DATABASE.filter((f) => f.name.toLowerCase().includes(searchQuery.trim().toLowerCase())).slice(0, 6)
      : [];

  function selectFood(food) {
    setForm({
      ...form, name: food.name, selectedFoodId: food.id, amountG: 100,
      calories: Math.round(food.calories), fat: round1(food.fat), protein: round1(food.protein), fiber: round1(food.fiber),
    });
    setSearchQuery(food.name);
    setDropdownOpen(false);
  }

  function updateAmount(newAmountG) {
    const food = FOOD_DATABASE.find((f) => f.id === form.selectedFoodId);
    if (!food) { setForm({ ...form, amountG: newAmountG }); return; }
    const factor = newAmountG / 100;
    setForm({
      ...form, amountG: newAmountG,
      calories: Math.round(food.calories * factor), fat: round1(food.fat * factor),
      protein: round1(food.protein * factor), fiber: round1(food.fiber * factor),
    });
  }

  function resetForm() {
    setForm(EMPTY_FORM);
    setSearchQuery("");
    setDropdownOpen(false);
  }

  function addEntry() {
    if (!form.name.trim() || form.calories === "") return;
    const points = calcFoodPoints(form, matrix);
    const entry = {
      id: Date.now(), name: form.name.trim(),
      calories: Number(form.calories) || 0, fat: Number(form.fat) || 0,
      protein: Number(form.protein) || 0, fiber: Number(form.fiber) || 0, points,
    };
    setEntries((prev) => [...prev, entry]);
    resetForm();
    setShowForm(false);
  }

  function deleteEntry(id) { setEntries((prev) => prev.filter((e) => e.id !== id)); }

  function exportBackup() {
    setBackupMessage("");
    try {
      const data = {};
      for (let i = 0; i < localStorage.length; i++) {
        const fullKey = localStorage.key(i);
        if (fullKey && fullKey.startsWith(STORAGE_PREFIX)) {
          data[fullKey.slice(STORAGE_PREFIX.length)] = localStorage.getItem(fullKey);
        }
      }
      const payload = { exportedAt: new Date().toISOString(), app: "punktetagebuch", data };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
      const url = URL.createObjectURL(blob);
      const a = document.createElement("a");
      a.href = url;
      a.download = `punktetagebuch-backup-${todayKey()}.json`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
      URL.revokeObjectURL(url);
      setBackupMessage("Backup heruntergeladen.");
    } catch (e) {
      setBackupMessage("Export ist fehlgeschlagen.");
    }
  }

  function importBackupFile(file) {
    setBackupMessage("");
    const reader = new FileReader();
    reader.onload = (ev) => {
      try {
        const payload = JSON.parse(ev.target.result);
        const data = payload.data || payload;
        Object.keys(data).forEach((logicalKey) => {
          localStorage.setItem(STORAGE_PREFIX + logicalKey, data[logicalKey]);
        });
        setBackupMessage("Backup wiederhergestellt — Ansicht wird neu geladen …");
        setTimeout(() => window.location.reload(), 600);
      } catch (e) {
        setBackupMessage("Datei konnte nicht gelesen werden — ist es eine gültige Backup-Datei?");
      }
    };
    reader.readAsText(file);
  }

  const samplePoints = calcFoodPoints(SAMPLE_FOOD, matrix);
  const flexRemaining = WEEKLY_FLEX_TOTAL - flexUsed;
  const allHistoryDays = [...historyDays, { key: todayKey(), label: "Heute", used, target: target.total, isToday: true }];

  return (
    <div className="npt-root">
      <style>{`
        .npt-root {
          --bg: #1b1d22; --surface: #23262c; --chalk: #f1efe7; --chalk-dim: #9aa0a8;
          --teal: #5fb3a3; --amber: #e3a548; --coral: #e2604f; --line: rgba(241,239,231,0.14);
          font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
          background: var(--bg); color: var(--chalk); max-width: 420px; margin: 0 auto;
          border-radius: 20px; overflow: hidden; min-height: 100vh; display: flex; flex-direction: column;
        }
        .npt-root * { box-sizing: border-box; }
        .npt-font-display { font-family: 'Space Mono', monospace; }
        .npt-header { padding: 20px 22px 14px; border-bottom: 1px solid var(--line); }
        .npt-title { font-size: 15px; font-weight: 600; letter-spacing: 0.02em; }
        .npt-subtitle { font-size: 12.5px; color: var(--chalk-dim); margin-top: 2px; }
        .npt-body { flex: 1; overflow-y: auto; padding: 22px; }
        .npt-gauge-wrap { display: flex; flex-direction: column; align-items: center; margin-bottom: 20px; }
        .npt-gauge-sub { font-size: 12.5px; color: var(--chalk-dim); margin-top: 10px; text-align: center; }
        .npt-flex-box { background: var(--surface); border-radius: 12px; padding: 12px 16px; margin-bottom: 22px; display: flex; align-items: center; justify-content: space-between; }
        .npt-flex-label { font-size: 13px; font-weight: 600; }
        .npt-flex-sub { font-size: 11.5px; color: var(--chalk-dim); margin-top: 2px; }
        .npt-flex-controls { display: flex; align-items: center; gap: 10px; }
        .npt-flex-controls button { width: 28px; height: 28px; border-radius: 8px; border: 1px solid var(--line); background: transparent; color: var(--chalk); font-size: 16px; cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .npt-flex-controls button:hover { border-color: var(--teal); color: var(--teal); }
        .npt-flex-controls span { font-family: 'Space Mono', monospace; font-size: 15px; min-width: 18px; text-align: center; }
        .npt-section-title { font-size: 13.5px; font-weight: 600; margin-bottom: 10px; color: var(--chalk); }
        .npt-divider { height: 1px; background: var(--line); margin: 12px 0; }
        .npt-entry-row { display: flex; align-items: center; justify-content: space-between; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .npt-entry-row:last-child { border-bottom: none; }
        .npt-entry-name { font-size: 14px; font-weight: 500; }
        .npt-entry-meta { font-size: 11.5px; color: var(--chalk-dim); margin-top: 2px; }
        .npt-entry-points { font-family: 'Space Mono', monospace; font-size: 15px; margin-right: 10px; min-width: 26px; text-align: right; }
        .npt-del-btn { background: none; border: none; color: var(--chalk-dim); cursor: pointer; padding: 6px; display: flex; }
        .npt-del-btn:hover { color: var(--coral); }
        .npt-empty { font-size: 13px; color: var(--chalk-dim); padding: 18px 0; text-align: center; }
        .npt-add-btn { width: 100%; margin-top: 16px; padding: 13px; border-radius: 12px; border: 1px dashed var(--line); background: transparent; color: var(--chalk); font-size: 14px; font-weight: 500; display: flex; align-items: center; justify-content: center; gap: 8px; cursor: pointer; }
        .npt-add-btn:hover { border-color: var(--teal); color: var(--teal); }
        .npt-form { margin-top: 16px; padding: 16px; background: var(--surface); border-radius: 14px; }
        .npt-form-row { margin-bottom: 12px; position: relative; }
        .npt-form-row label { display: block; font-size: 12px; color: var(--chalk-dim); margin-bottom: 5px; }
        .npt-form-row input { width: 100%; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 9px 10px; color: var(--chalk); font-size: 14px; font-family: 'Inter', sans-serif; }
        .npt-form-row input:focus { outline: none; border-color: var(--teal); }
        .npt-form-grid { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; }
        .npt-form-actions { display: flex; gap: 10px; margin-top: 4px; }
        .npt-btn-primary, .npt-btn-secondary { flex: 1; padding: 10px; border-radius: 8px; font-size: 13.5px; font-weight: 600; cursor: pointer; border: none; }
        .npt-btn-primary { background: var(--teal); color: #12201d; }
        .npt-btn-secondary { background: transparent; color: var(--chalk-dim); border: 1px solid var(--line); }
        .npt-dropdown { position: absolute; left: 0; right: 0; top: 100%; margin-top: 4px; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; overflow-y: auto; max-height: 220px; z-index: 5; }
        .npt-dropdown-item { width: 100%; display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 9px 12px; background: transparent; border: none; border-bottom: 1px solid var(--line); color: var(--chalk); font-size: 13px; cursor: pointer; text-align: left; }
        .npt-dropdown-item:last-child { border-bottom: none; }
        .npt-dropdown-item:hover { background: var(--surface); }
        .npt-dropdown-kcal { font-family: 'Space Mono', monospace; font-size: 11px; color: var(--chalk-dim); flex-shrink: 0; }
        .npt-chip-row { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 16px; }
        .npt-chip { padding: 8px 14px; border-radius: 999px; border: 1px solid var(--line); background: transparent; color: var(--chalk-dim); font-size: 13px; cursor: pointer; }
        .npt-chip.active { background: var(--teal); border-color: var(--teal); color: #12201d; font-weight: 600; }
        .npt-field { margin-bottom: 16px; }
        .npt-field label { display: block; font-size: 12.5px; color: var(--chalk-dim); margin-bottom: 6px; }
        .npt-field input[type="number"] { width: 100%; background: var(--surface); border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; color: var(--chalk); font-size: 15px; }
        .npt-field input[type="range"] { width: 100%; accent-color: var(--teal); }
        .npt-range-val { font-family: 'Space Mono', monospace; font-size: 13px; color: var(--teal); float: right; }
        .npt-target-box { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-top: 4px; }
        .npt-target-box .npt-target-num { font-family: 'Space Mono', monospace; font-size: 26px; font-weight: 700; }
        .npt-target-breakdown { font-size: 11.5px; color: var(--chalk-dim); margin-top: 6px; line-height: 1.6; }
        .npt-sample-box { background: var(--surface); border-radius: 12px; padding: 14px 16px; margin-top: 6px; font-size: 12.5px; color: var(--chalk-dim); }
        .npt-sample-box strong { color: var(--chalk); font-family: 'Space Mono', monospace; font-size: 15px; }
        .npt-reset-btn { margin-top: 18px; width: 100%; padding: 10px; border-radius: 8px; background: transparent; border: 1px solid var(--line); color: var(--chalk-dim); font-size: 13px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
        .npt-reset-btn:hover { color: var(--chalk); border-color: var(--chalk-dim); }
        .npt-history-row { display: flex; align-items: center; gap: 12px; padding: 10px 0; border-bottom: 1px solid var(--line); }
        .npt-history-row:last-child { border-bottom: none; }
        .npt-history-row.today .npt-history-label { color: var(--teal); font-weight: 700; }
        .npt-history-label { width: 42px; font-size: 12.5px; color: var(--chalk-dim); flex-shrink: 0; }
        .npt-history-bar { flex: 1; height: 10px; border-radius: 6px; background: var(--line); overflow: hidden; }
        .npt-history-bar-inner { height: 100%; border-radius: 6px; transition: width 0.3s ease; }
        .npt-history-val { font-family: 'Space Mono', monospace; font-size: 12px; color: var(--chalk-dim); width: 74px; text-align: right; flex-shrink: 0; }
        .npt-tabbar { display: flex; border-top: 1px solid var(--line); background: var(--surface); }
        .npt-tab { flex: 1; padding: 13px 0; text-align: center; background: none; border: none; cursor: pointer; color: var(--chalk-dim); font-size: 12.5px; display: flex; flex-direction: column; align-items: center; gap: 4px; }
        .npt-tab.active { color: var(--teal); }
        .npt-warn { font-size: 11.5px; color: var(--amber); text-align: center; padding: 6px 22px 0; }
      `}</style>

      <div className="npt-header">
        <div className="npt-title">Punktetagebuch</div>
        <div className="npt-subtitle">{new Date().toLocaleDateString("de-DE", { weekday: "long", day: "2-digit", month: "long" })}</div>
      </div>

      {saveError && <div className="npt-warn">Speichern hat gerade nicht geklappt — bitte Browser-Speicher/privaten Modus prüfen.</div>}

      <div className="npt-body">
        {tab === "heute" && (
          <>
            <div className="npt-gauge-wrap">
              <svg width="180" height="180" viewBox="0 0 180 180">
                <circle cx="90" cy="90" r={r} fill="none" stroke="var(--line)" strokeWidth="12" />
                <circle cx="90" cy="90" r={r} fill="none" stroke={`var(--${status})`} strokeWidth="12" strokeLinecap="round"
                  strokeDasharray={circumference} strokeDashoffset={dashOffset} transform="rotate(-90 90 90)"
                  style={{ transition: "stroke-dashoffset 0.4s ease, stroke 0.4s ease" }} />
                <text x="90" y="86" textAnchor="middle" className="npt-font-display" fontSize="34" fontWeight="700" fill="var(--chalk)">{remaining}</text>
                <text x="90" y="108" textAnchor="middle" fontSize="11" fill="var(--chalk-dim)" fontFamily="Inter, sans-serif">Punkte übrig</text>
              </svg>
              <div className="npt-gauge-sub">{used} von {target.total} Punkten heute verbraucht</div>
            </div>

            <div className="npt-flex-box">
              <div>
                <div className="npt-flex-label">Wochenpuffer</div>
                <div className="npt-flex-sub">{flexRemaining} von {WEEKLY_FLEX_TOTAL} Flex-Punkten übrig</div>
              </div>
              <div className="npt-flex-controls">
                <button onClick={() => setFlexUsed(Math.max(0, flexUsed - 1))} aria-label="Flex-Punkt zurückgeben">−</button>
                <span>{flexUsed}</span>
                <button onClick={() => setFlexUsed(Math.min(WEEKLY_FLEX_TOTAL, flexUsed + 1))} aria-label="Flex-Punkt nutzen">+</button>
              </div>
            </div>

            <div className="npt-section-title">Heute gegessen</div>
            {entries.length === 0 && <div className="npt-empty">Noch nichts eingetragen. Leg mit dem ersten Eintrag los.</div>}
            {entries.map((e) => (
              <div className="npt-entry-row" key={e.id}>
                <div>
                  <div className="npt-entry-name">{e.name}</div>
                  <div className="npt-entry-meta">{e.calories} kcal · {e.fat} g Fett · {e.protein} g Protein{e.fiber ? ` · ${e.fiber} g Ballaststoffe` : ""}</div>
                </div>
                <div style={{ display: "flex", alignItems: "center" }}>
                  <div className="npt-entry-points npt-font-display">{e.points}</div>
                  <button className="npt-del-btn" onClick={() => deleteEntry(e.id)} aria-label="Eintrag löschen"><IconTrash size={16} /></button>
                </div>
              </div>
            ))}

            {!showForm && (
              <button className="npt-add-btn" onClick={() => setShowForm(true)}><IconPlus size={16} /> Essen hinzufügen</button>
            )}

            {showForm && (
              <div className="npt-form">
                <div className="npt-form-row">
                  <label>Aus Datenbank suchen (optional)</label>
                  <input type="text" placeholder="z. B. Linsen, Lachs, Sojamilch…" value={searchQuery}
                    onChange={(ev) => { setSearchQuery(ev.target.value); setForm((f) => ({ ...f, selectedFoodId: null })); setDropdownOpen(true); }}
                    onFocus={() => setDropdownOpen(true)} />
                  {dropdownOpen && searchResults.length > 0 && (
                    <div className="npt-dropdown">
                      {searchResults.map((f) => (
                        <button key={f.id} className="npt-dropdown-item" onClick={() => selectFood(f)}>
                          <span>{f.name}</span><span className="npt-dropdown-kcal">{f.calories} kcal/100g</span>
                        </button>
                      ))}
                    </div>
                  )}
                </div>

                {form.selectedFoodId && (
                  <div className="npt-form-row">
                    <label>Menge (g)</label>
                    <input type="number" inputMode="decimal" value={form.amountG} onChange={(ev) => updateAmount(Number(ev.target.value) || 0)} />
                  </div>
                )}

                <div className="npt-form-row">
                  <label>Bezeichnung</label>
                  <input type="text" placeholder="z. B. Haferflocken mit Hafermilch" value={form.name} onChange={(ev) => setForm({ ...form, name: ev.target.value })} />
                </div>
                <div className="npt-form-row">
                  <label>Kalorien (kcal)</label>
                  <input type="number" inputMode="decimal" value={form.calories} onChange={(ev) => setForm({ ...form, calories: ev.target.value })} />
                </div>
                <div className="npt-form-grid">
                  <div className="npt-form-row"><label>Fett (g)</label><input type="number" inputMode="decimal" value={form.fat} onChange={(ev) => setForm({ ...form, fat: ev.target.value })} /></div>
                  <div className="npt-form-row"><label>Protein (g)</label><input type="number" inputMode="decimal" value={form.protein} onChange={(ev) => setForm({ ...form, protein: ev.target.value })} /></div>
                  <div className="npt-form-row"><label>Ballaststoffe (g)</label><input type="number" inputMode="decimal" value={form.fiber} onChange={(ev) => setForm({ ...form, fiber: ev.target.value })} /></div>
                </div>
                <div className="npt-form-actions">
                  <button className="npt-btn-secondary" onClick={() => { resetForm(); setShowForm(false); }}>Abbrechen</button>
                  <button className="npt-btn-primary" onClick={addEntry}>Hinzufügen</button>
                </div>
              </div>
            )}
          </>
        )}

        {tab === "verlauf" && (
          <>
            <div className="npt-section-title">Letzte 7 Tage</div>
            {allHistoryDays.map((d) => {
              const st = dayStatus(d.used, d.target || target.total);
              return (
                <div className={`npt-history-row ${d.isToday ? "today" : ""}`} key={d.key}>
                  <div className="npt-history-label">{d.label}</div>
                  <div className="npt-history-bar"><div className="npt-history-bar-inner" style={{ width: `${Math.min(st.ratio, 1) * 100}%`, background: st.color }} /></div>
                  <div className="npt-history-val">{d.used === null ? "keine Daten" : `${d.used}/${d.target || target.total}`}</div>
                </div>
              );
            })}
            <div className="npt-divider" />
            <div className="npt-sample-box">Die Balken zeigen verbrauchte Punkte im Verhältnis zum jeweiligen Tagesziel. Tage ohne Eintrag zeigen "keine Daten" statt 0.</div>
          </>
        )}

        {tab === "profil" && (
          <>
            <div className="npt-section-title">Dein Profil</div>
            <div className="npt-field">
              <label>Geschlecht (bestimmt die Basispunkte)</label>
              <div className="npt-chip-row">
                {[{ key: "frau", label: "Weiblich" }, { key: "mann", label: "Männlich" }, { key: "neutral", label: "Neutral" }].map((o) => (
                  <button key={o.key} className={`npt-chip ${profile.gender === o.key ? "active" : ""}`} onClick={() => setProfile({ ...profile, gender: o.key })}>{o.label}</button>
                ))}
              </div>
            </div>
            <div className="npt-field"><label>Gewicht (kg)</label><input type="number" value={profile.weightKg} onChange={(ev) => setProfile({ ...profile, weightKg: Number(ev.target.value) || 0 })} /></div>
            <div className="npt-field"><label>Größe (cm)</label><input type="number" value={profile.heightCm} onChange={(ev) => setProfile({ ...profile, heightCm: Number(ev.target.value) || 0 })} /></div>
            <div className="npt-field"><label>Alter</label><input type="number" value={profile.age} onChange={(ev) => setProfile({ ...profile, age: Number(ev.target.value) || 0 })} /></div>
            <div className="npt-field">
              <label>Grundaktivität im Alltag (nicht das Training selbst)</label>
              <div className="npt-chip-row">
                {[{ key: "sitzend", label: "Überwiegend sitzend" }, { key: "stehend", label: "Überwiegend stehend" }, { key: "gehend", label: "Viel zu Fuß" }, { key: "schwer", label: "Körperlich schwer" }].map((o) => (
                  <button key={o.key} className={`npt-chip ${profile.activity === o.key ? "active" : ""}`} onClick={() => setProfile({ ...profile, activity: o.key })}>{o.label}</button>
                ))}
              </div>
            </div>
            <div className="npt-target-box">
              <div className="npt-target-num">{target.total} Punkte / Tag</div>
              <div className="npt-target-breakdown">
                Gewicht {target.weightPoints} · Geschlecht {target.genderPoints} · Alter {target.agePoints} · Größe {target.heightPoints} · Aktivität {target.activityPoints}
                {target.rawTotal !== target.total ? ` (auf ${target.total} gedeckelt)` : ""}
              </div>
            </div>
            <div className="npt-divider" />
            <div className="npt-section-title">Punkte-Matrix</div>
            <div className="npt-field"><label>Kalorien-Divisor <span className="npt-range-val">{matrix.calDiv}</span></label><input type="range" min="30" max="80" step="1" value={matrix.calDiv} onChange={(ev) => setMatrix({ ...matrix, calDiv: Number(ev.target.value) })} /></div>
            <div className="npt-field"><label>Fett-Divisor <span className="npt-range-val">{matrix.fatDiv}</span></label><input type="range" min="5" max="20" step="1" value={matrix.fatDiv} onChange={(ev) => setMatrix({ ...matrix, fatDiv: Number(ev.target.value) })} /></div>
            <div className="npt-field"><label>Protein-Divisor (höher = Protein zählt weniger) <span className="npt-range-val">{matrix.proteinDiv}</span></label><input type="range" min="5" max="25" step="1" value={matrix.proteinDiv} onChange={(ev) => setMatrix({ ...matrix, proteinDiv: Number(ev.target.value) })} /></div>
            <div className="npt-field"><label>Ballaststoff-Divisor <span className="npt-range-val">{matrix.fiberDiv}</span></label><input type="range" min="2" max="10" step="1" value={matrix.fiberDiv} onChange={(ev) => setMatrix({ ...matrix, fiberDiv: Number(ev.target.value) })} /></div>
            <div className="npt-field"><label>Ballaststoff-Deckel (g) <span className="npt-range-val">{matrix.fiberCap}</span></label><input type="range" min="0" max="10" step="1" value={matrix.fiberCap} onChange={(ev) => setMatrix({ ...matrix, fiberCap: Number(ev.target.value) })} /></div>
            <div className="npt-sample-box">Beispiel: 250 kcal · 10 g Fett · 20 g Protein · 3 g Ballaststoffe → <strong>{samplePoints} Punkte</strong></div>
            <button className="npt-reset-btn" onClick={() => setMatrix(DEFAULT_MATRIX)}><IconReset size={14} /> Matrix auf Standard zurücksetzen</button>

            <div className="npt-divider" />

            <div className="npt-section-title">Datensicherung</div>
            <div className="npt-sample-box" style={{ marginBottom: 12 }}>
              Enthält Profil, Matrix und deinen kompletten bisherigen Verlauf (nicht nur die letzten 7 Tage). Speichere die Datei z. B. in Google Drive, Dropbox oder einem privaten GitHub-Repo, um Datenverlust vorzubeugen.
            </div>
            <div className="npt-form-actions">
              <button className="npt-btn-secondary" onClick={exportBackup}><IconDownload size={14} />Backup exportieren</button>
              <button className="npt-btn-secondary" onClick={() => fileInputRef.current && fileInputRef.current.click()}><IconUpload size={14} />Backup importieren</button>
            </div>
            <input type="file" accept="application/json" ref={fileInputRef} style={{ display: "none" }}
              onChange={(ev) => { const f = ev.target.files[0]; if (f) importBackupFile(f); ev.target.value = ""; }} />
            {backupMessage && <div className="npt-gauge-sub" style={{ marginTop: 10 }}>{backupMessage}</div>}
          </>
        )}
      </div>

      <div className="npt-tabbar">
        <button className={`npt-tab ${tab === "heute" ? "active" : ""}`} onClick={() => setTab("heute")}><IconUtensils size={18} />Heute</button>
        <button className={`npt-tab ${tab === "verlauf" ? "active" : ""}`} onClick={() => setTab("verlauf")}><IconHistory size={18} />Verlauf</button>
        <button className={`npt-tab ${tab === "profil" ? "active" : ""}`} onClick={() => setTab("profil")}><IconSliders size={18} />Profil & Matrix</button>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NutritionPointsTracker />);
</script>
</body>
</html>
