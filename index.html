// ---------- lokale Speicherung (im Browser dieses Geräts) ----------

const STORAGE_PREFIX = "npt:";

function storageGet(key) {
  try {
    const raw = localStorage.getItem(STORAGE_PREFIX + key);
    return raw === null ? null : { value: raw };
  } catch (e) { return null; }
}
function storageSet(key, value) {
  try { localStorage.setItem(STORAGE_PREFIX + key, value); return true; } catch (e) { return false; }
}
function storageListKeys() {
  const keys = [];
  try {
    for (let i = 0; i < localStorage.length; i++) {
      const fullKey = localStorage.key(i);
      if (fullKey && fullKey.startsWith(STORAGE_PREFIX)) keys.push(fullKey.slice(STORAGE_PREFIX.length));
    }
  } catch (e) {}
  return keys;
}

// ---------- Hilfsfunktionen ----------

function dateKeyFor(d) {
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, "0")}-${String(d.getDate()).padStart(2, "0")}`;
}
function todayKey() { return dateKeyFor(new Date()); }
// ---------- Individuelle Tages-Reset-Zeit ----------
// "Effektiv jetzt" verschiebt die Uhrzeit um die eingestellte Reset-Minute zurück, bevor der
// Kalendertag bestimmt wird. Beispiel: Reset um 02:00 Uhr (=120 Minuten) -> 01:30 Uhr zählt noch
// zum Vortag, 02:30 Uhr zählt schon zum neuen Tag.
function effectiveNow(resetMinutes) {
  const d = new Date();
  if (!resetMinutes) return d;
  return new Date(d.getTime() - resetMinutes * 60000);
}
function effectiveTodayKey(resetMinutes) {
  return dateKeyFor(effectiveNow(resetMinutes));
}
// Summiert die Flexpoint-Überschreitung (Tagespunkte > Tagesbudget inkl. Sportbonus) über eine
// Woche (Montag als Date). Der Tag, der der effektiven "heute"-Grenze entspricht, wird nicht aus
// dem Speicher gelesen (der könnte noch nicht persistiert sein), sondern über liveTodayOverage
// übergeben, damit der Live-Stand aus dem React-State sofort korrekt einfließt.
function computeWeekFlexUsage(mondayDate, resetMinutes, liveTodayOverage) {
  const effToday = effectiveTodayKey(resetMinutes);
  let total = 0;
  for (let i = 0; i < 7; i++) {
    const d = new Date(mondayDate);
    d.setDate(mondayDate.getDate() + i);
    const key = dateKeyFor(d);
    if (key === effToday) {
      total += Math.max(0, liveTodayOverage || 0);
      continue;
    }
    const res = storageGet(`log:${key}`);
    if (res && res.value) {
      try {
        const parsed = JSON.parse(res.value);
        const list = Array.isArray(parsed) ? parsed : parsed.entries || [];
        const dayUsed = list.reduce((s, e) => s + e.points, 0);
        const baseTarget = (!Array.isArray(parsed) && parsed.target) || null;
        const sportBonusDay = (!Array.isArray(parsed) && parsed.sport && parsed.sport.done) ? Number(parsed.sport.bonusPoints) || 0 : 0;
        const dayEffectiveTarget = baseTarget !== null ? baseTarget + sportBonusDay : null;
        if (dayEffectiveTarget !== null) total += Math.max(0, dayUsed - dayEffectiveTarget);
      } catch (e) {}
    }
  }
  return total;
}
function weekKey() {
  const d = new Date();
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  const monday = new Date(d);
  monday.setDate(diff);
  return dateKeyFor(monday);
}
function round1(x) { return Math.round(x * 10) / 10; }

// ---------- Tippfehlertolerante Suche ----------
// Levenshtein-Distanz zwischen zwei Strings (Anzahl der Einfüge-/Lösch-/Ersetz-Operationen).
function levenshteinDistance(a, b) {
  const m = a.length, n = b.length;
  if (m === 0) return n;
  if (n === 0) return m;
  const prev = new Array(n + 1);
  const curr = new Array(n + 1);
  for (let j = 0; j <= n; j++) prev[j] = j;
  for (let i = 1; i <= m; i++) {
    curr[0] = i;
    for (let j = 1; j <= n; j++) {
      const cost = a[i - 1] === b[j - 1] ? 0 : 1;
      curr[j] = Math.min(curr[j - 1] + 1, prev[j] + 1, prev[j - 1] + cost);
    }
    for (let j = 0; j <= n; j++) prev[j] = curr[j];
  }
  return prev[n];
}
// Bewertet, wie gut ein Suchbegriff zu einem Namen passt. Höher = besser, -1 = kein Treffer.
// Exakte Teilstring-Treffer (v. a. am Wortanfang) werden bevorzugt; Tippfehler werden über
// eine Levenshtein-Distanz auf Wortebene toleriert (Toleranz wächst mit der Suchbegriff-Länge).
function fuzzyMatchScore(query, name) {
  const q = query.toLowerCase().trim();
  const n = name.toLowerCase();
  if (!q) return -1;
  const idx = n.indexOf(q);
  if (idx !== -1) return idx === 0 ? 1000 : 500 - idx;
  const maxDist = q.length <= 4 ? 1 : q.length <= 8 ? 2 : 3;
  const words = n.split(/[\s,()]+/).filter(Boolean);
  let best = Infinity;
  for (const w of words) {
    const wCompare = w.length > q.length + maxDist ? w.slice(0, q.length + maxDist) : w;
    const d = levenshteinDistance(q, wCompare);
    if (d < best) best = d;
  }
  return best <= maxDist ? 100 - best * 10 : -1;
}
// Filtert und sortiert eine Liste von Objekten mit .name nach Suchrelevanz.
function fuzzySearch(query, items, limit) {
  return items
    .map((item) => ({ item, score: fuzzyMatchScore(query, item.name) }))
    .filter((x) => x.score > -1)
    .sort((a, b) => b.score - a.score)
    .slice(0, limit)
    .map((x) => x.item);
}

function hexToRgba(hex, alpha) {
  const h = hex.replace("#", "");
  const r = parseInt(h.substring(0, 2), 16);
  const g = parseInt(h.substring(2, 4), 16);
  const b = parseInt(h.substring(4, 6), 16);
  return `rgba(${r}, ${g}, ${b}, ${alpha})`;
}

function mondayOf(date) {
  const d = new Date(date);
  const day = d.getDay();
  const diff = d.getDate() - day + (day === 0 ? -6 : 1);
  d.setDate(diff);
  d.setHours(0, 0, 0, 0);
  return d;
}

function isoWeekNumber(date) {
  const d = new Date(Date.UTC(date.getFullYear(), date.getMonth(), date.getDate()));
  const dayNum = (d.getUTCDay() + 6) % 7;
  d.setUTCDate(d.getUTCDate() - dayNum + 3);
  const firstThursday = new Date(Date.UTC(d.getUTCFullYear(), 0, 4));
  const diff = d - firstThursday;
  return 1 + Math.round(diff / (7 * 24 * 60 * 60 * 1000));
}

function formatShortDate(d) {
  return d.toLocaleDateString("de-DE", { day: "2-digit", month: "2-digit" });
}

function calcAgeFromBirthDate(birthDateStr) {
  const birth = new Date(birthDateStr + "T00:00:00");
  if (isNaN(birth.getTime())) return null;
  const today = new Date();
  let age = today.getFullYear() - birth.getFullYear();
  const hadBirthdayThisYear = today.getMonth() > birth.getMonth() || (today.getMonth() === birth.getMonth() && today.getDate() >= birth.getDate());
  if (!hadBirthdayThisYear) age -= 1;
  return age;
}
function effectiveAge(p) {
  if (p.birthDate) {
    const calculated = calcAgeFromBirthDate(p.birthDate);
    if (calculated !== null) return calculated;
  }
  return p.age;
}
function isBirthdayToday(p) {
  if (!p.birthDate) return false;
  const birth = new Date(p.birthDate + "T00:00:00");
  if (isNaN(birth.getTime())) return false;
  const today = new Date();
  return birth.getDate() === today.getDate() && birth.getMonth() === today.getMonth();
}
function formatTableDateLabel(dayKey) {
  const d = new Date(dayKey + "T00:00:00");
  return d.toLocaleDateString("de-DE", { weekday: "short", day: "2-digit", month: "2-digit" });
}

function calcDailyTarget(p, matrix) {
  let bmrOffset;
  if (p.gender === "mann") bmrOffset = 5;
  else if (p.gender === "frau") bmrOffset = -161;
  else bmrOffset = -78;
  const bmr = 10 * p.weightKg + 6.25 * p.heightCm - 5 * effectiveAge(p) + bmrOffset;
  const activityFactorMap = { sitzend: 1.2, stehend: 1.375, gehend: 1.55, schwer: 1.725 };
  const activityFactor = activityFactorMap[p.activity] ?? 1.2;
  const tdee = bmr * activityFactor;
  const deficitFactor = 1 - (Number(p.deficitPercent) || 0) / 100;
  const rawCalorieTarget = tdee * deficitFactor;
  const floorApplied = rawCalorieTarget < 1200;
  const calorieTarget = Math.max(rawCalorieTarget, 1200);
  const total = Math.max(0, Math.round(calorieTarget / matrix.calDiv));
  return { total, bmr: Math.round(bmr), tdee: Math.round(tdee), calorieTarget: Math.round(calorieTarget), floorApplied };
}

function calcFoodPointsRaw(food, matrix) {
  const fiberUsed = Math.min(Number(food.fiber) || 0, matrix.fiberCap);
  return (
    (Number(food.calories) || 0) / matrix.calDiv +
    (Number(food.fat) || 0) / matrix.fatDiv -
    fiberUsed / matrix.fiberDiv -
    (Number(food.protein) || 0) / matrix.proteinDiv
  );
}
function calcFoodPoints(food, matrix) {
  return Math.max(0, Math.round(calcFoodPointsRaw(food, matrix)));
}

// Sattmacher-Modus: Obst & Gemüse zählen unabhängig von der Menge 0 Punkte (Ausnahme: Lebensmittel
// mit sattmacherExempt, z.B. Avocado wegen des hohen Fettgehalts). Klassische Sattmacher-Beilagen
// (Kategorie "Kohlenhydrat": Reis, Nudeln, Kartoffeln u.ä.) sind auf max. 7 Punkte gedeckelt.
// category/sattmacherExempt kommen vom Lebensmittel-Datenbankeintrag (bei Suche) oder aus dem
// Formular (bei manueller Eingabe eines neuen Lebensmittels). Die "Raw"-Variante (ungerundet) wird
// für die zutatenweise Summierung bei Rezepten gebraucht, damit nicht mehrfach gerundet wird.
function calcFoodPointsWithModeRaw(food, matrix, sattmacherMode, category, sattmacherExempt) {
  const raw = calcFoodPointsRaw(food, matrix);
  if (!sattmacherMode) return raw;
  if ((category === "Obst" || category === "Gemüse") && !sattmacherExempt) return 0;
  if (category === "Kohlenhydrat") return Math.min(raw, 7);
  return raw;
}
function calcFoodPointsWithMode(food, matrix, sattmacherMode, category, sattmacherExempt) {
  return Math.max(0, Math.round(calcFoodPointsWithModeRaw(food, matrix, sattmacherMode, category, sattmacherExempt)));
}

// Rezept-Punkte: Statt die Punktzahl aus den zusammengerechneten Gesamtnährwerten zu berechnen,
// wird jede Zutat einzeln (mit ihrer eigenen Kategorie/Sattmacher-Regel) bepunktet und erst danach
// summiert und einmalig gerundet — nur so wirkt der Sattmacher-Modus z.B. auf die Trauben im
// Haferflocken-Rezept, ohne dass Hafer & Trauben zu einem einzigen "Mischwert" verschmelzen.
// consumedAmountG ist die tatsächlich verzehrte Menge (z.B. eine Portion), skaliert proportional.
function calcRecipePoints(recipeFood, consumedAmountG, matrix, sattmacherMode) {
  if (!recipeFood.recipeIngredients || !recipeFood.recipeTotalG) {
    const factor = consumedAmountG / 100;
    return calcFoodPointsWithMode(
      { calories: recipeFood.calories * factor, fat: recipeFood.fat * factor, protein: recipeFood.protein * factor, fiber: recipeFood.fiber * factor },
      matrix, sattmacherMode, recipeFood.category, recipeFood.sattmacherExempt
    );
  }
  const fraction = consumedAmountG / recipeFood.recipeTotalG;
  let rawTotal = 0;
  for (const ing of recipeFood.recipeIngredients) {
    const ingG = (ing.amountG || 0) * fraction;
    const f = ingG / 100;
    rawTotal += calcFoodPointsWithModeRaw(
      { calories: (ing.calories100 || 0) * f, fat: (ing.fat100 || 0) * f, protein: (ing.protein100 || 0) * f, fiber: (ing.fiber100 || 0) * f },
      matrix, sattmacherMode, ing.category, ing.sattmacherExempt
    );
  }
  return Math.max(0, Math.round(rawTotal));
}

// Berechnet die Punktzahl eines bereits gespeicherten Eintrags neu — z.B. wenn der Sattmacher-Modus
// umgeschaltet wird. Direkt eingetragene Punkte ("Punkte direkt") bleiben unverändert, da dort keine
// Nährwert-/Kategorie-Basis existiert.
function recalcEntryPoints(entry, matrix, sattmacherMode) {
  if (entry.isDirect) return entry.points;
  if (entry.recipeSnapshot) {
    return calcRecipePoints(entry.recipeSnapshot, entry.recipeSnapshot.recipeTotalG, matrix, sattmacherMode);
  }
  return calcFoodPointsWithMode(
    { calories: entry.calories, fat: entry.fat, protein: entry.protein, fiber: entry.fiber },
    matrix, sattmacherMode, entry.category, entry.sattmacherExempt
  );
}

// Berechnet die Nährstoffverteilung (für Donut-Chart + Kennzahlen) aus einer Liste von Einträgen.
// Wiederverwendet für den "Heute"-Bereich und die Tages-Detailansicht im Verlauf.
// Kohlenhydrate werden, falls nicht direkt erfasst (Basis "Kalorien"), aus der Differenz
// Kalorien - Fett*9 - Protein*4 geschätzt. "Punkte direkt"-Einträge haben keine Nährwerte.
// Formuliert die Wochenzusammenfassung als 2-3 natürliche Sätze statt nüchterner Kennzahlen-Liste.
function buildWeekSummarySentences(weeklyTotal, daysWithData, flexUsed, weeklyFlexTotal, weekAvgWeight, prevAvgWeight, weekAvgWaist, prevAvgWaist) {
  const sentences = [];
  if (daysWithData === 0) {
    sentences.push("Für diese Woche liegen noch keine Einträge vor.");
    return sentences;
  }
  const dayWord = daysWithData === 1 ? "einem Tag" : `${daysWithData} Tagen`;
  if (flexUsed <= 0) {
    sentences.push(`Diese Woche hast du dein Budget an ${dayWord} im Griff gehabt — ${weeklyTotal} Punkte insgesamt, ganz ohne den Flexpuffer anzurühren.`);
  } else if (flexUsed >= weeklyFlexTotal) {
    sentences.push(`Diese Woche war ordentlich was los: ${weeklyTotal} Punkte über ${dayWord}, und dein Wochenpuffer ist komplett aufgebraucht.`);
  } else {
    sentences.push(`Diese Woche kamst du auf ${weeklyTotal} Punkte über ${dayWord} — dabei hast du ${flexUsed} von ${weeklyFlexTotal} Flexpoints genutzt, um dir etwas Luft zu verschaffen.`);
  }
  if (weekAvgWeight !== null) {
    const diff = prevAvgWeight !== null ? round1(weekAvgWeight - prevAvgWeight) : null;
    if (diff === null) {
      sentences.push(`Dein Gewichtsschnitt liegt diese Woche bei ${weekAvgWeight} kg — für einen Vergleich fehlt noch eine Vorwoche.`);
    } else if (diff <= -0.1) {
      sentences.push(`Beim Gewicht ging's im Schnitt ${Math.abs(diff)} kg nach unten gegenüber der Vorwoche — weiter so!`);
    } else if (diff >= 0.1) {
      sentences.push(`Beim Gewicht lag der Schnitt diese Woche ${diff} kg höher als in der Vorwoche.`);
    } else {
      sentences.push(`Dein Gewicht ist im Vergleich zur Vorwoche stabil geblieben (Ø ${weekAvgWeight} kg).`);
    }
  }
  if (weekAvgWaist !== null) {
    const diff = prevAvgWaist !== null ? round1(weekAvgWaist - prevAvgWaist) : null;
    if (diff === null) {
      sentences.push(`Beim Bauchumfang liegt der Schnitt diese Woche bei ${weekAvgWaist} cm — für einen Vergleich fehlt noch eine Vorwoche.`);
    } else if (diff <= -0.2) {
      sentences.push(`Der Bauchumfang ist im Schnitt um ${Math.abs(diff)} cm zurückgegangen — schön zu sehen!`);
    } else if (diff >= 0.2) {
      sentences.push(`Der Bauchumfang lag diese Woche im Schnitt ${diff} cm höher als in der Vorwoche.`);
    } else {
      sentences.push(`Der Bauchumfang ist im Vergleich zur Vorwoche stabil geblieben (Ø ${weekAvgWaist} cm).`);
    }
  }
  return sentences;
}

function computeMacroBreakdown(entriesList) {
  const macroEntries = entriesList.filter((e) => !e.isDirect);
  const totals = macroEntries.reduce(
    (acc, e) => {
      const calories = Number(e.calories) || 0;
      const fat = Number(e.fat) || 0;
      const protein = Number(e.protein) || 0;
      const fiber = Number(e.fiber) || 0;
      const carbs = e.carbs !== null && e.carbs !== undefined ? Number(e.carbs) || 0 : Math.max(0, round1((calories - fat * 9 - protein * 4) / 4));
      return { calories: acc.calories + calories, fat: acc.fat + fat, protein: acc.protein + protein, fiber: acc.fiber + fiber, carbs: acc.carbs + carbs };
    },
    { calories: 0, fat: 0, protein: 0, fiber: 0, carbs: 0 }
  );
  const directCount = entriesList.length - macroEntries.length;
  const kcalTotal = totals.protein * 4 + totals.fat * 9 + totals.carbs * 4;
  const shares = kcalTotal > 0
    ? { protein: (totals.protein * 4) / kcalTotal, fat: (totals.fat * 9) / kcalTotal, carbs: (totals.carbs * 4) / kcalTotal }
    : { protein: 0, fat: 0, carbs: 0 };
  const r = 46;
  const c = 2 * Math.PI * r;
  let cumulativeLen = 0;
  // Standard-Technik für mehrfarbige SVG-Ringsegmente: dasharray "Segmentlänge Restlänge" (nicht
  // die volle Kreislänge als Lücke!) und dashoffset als NEGATIVE, aufsummierte Länge der bereits
  // platzierten Segmente. Die vorherige Formel (Lücke = volle Kreislänge, positiver Offset) hat
  // rechnerisch dazu geführt, dass spätere Segmente (v. a. Protein) im Kreis praktisch unsichtbar
  // wurden statt am richtigen Platz zu erscheinen.
  const segments = [
    { key: "carbs", label: "Kohlenhydrate", grams: round1(totals.carbs), share: shares.carbs, colorVar: "--amber" },
    { key: "fat", label: "Fett", grams: round1(totals.fat), share: shares.fat, colorVar: "--coral" },
    { key: "protein", label: "Protein", grams: round1(totals.protein), share: shares.protein, colorVar: "--teal" },
  ].map((seg) => {
    const segLen = c * seg.share;
    const dashOffset = -cumulativeLen;
    cumulativeLen += segLen;
    return { ...seg, dashArray: `${segLen} ${c - segLen}`, dashOffset };
  });
  return { totals, directCount, kcalTotal, shares, segments, r, c };
}

function dayStatus(used, target) {
  if (used === null || !target) return { ratio: 0, color: "var(--line)" };
  const ratio = target > 0 ? used / target : 0;
  const color = ratio <= 0.8 ? "var(--good)" : ratio <= 1 ? "var(--warn)" : "var(--bad)";
  return { ratio, color };
}

// Berechnet eine Achsen-Domäne, die sich an den tatsächlichen Datenwerten orientiert (nicht an
// Ziel-/Prognoselinien), mit Puffer nach oben UND unten, damit Schwankungen gut ablesbar sind.
function computeAxisDomain(values, paddingRatio, minPadding, floorAtZero) {
  const nums = values.filter((v) => v !== null && v !== undefined && !isNaN(v));
  if (nums.length === 0) return [null, null];
  const min = Math.min(...nums);
  const max = Math.max(...nums);
  const range = max - min;
  const pad = Math.max(minPadding, range * paddingRatio, Math.abs(max) * 0.02);
  let lo = round1(min - pad);
  let hi = round1(max + pad);
  if (floorAtZero && lo < 0) lo = 0;
  return [lo, hi];
}

// Wendet einen manuellen Zoom-Faktor auf eine bereits berechnete Achsen-Domäne an.
// zoomFactor 1 = unverändert (automatische Skalierung). <1 = reinzoomen, >1 = rauszoomen.
// Zoomt symmetrisch um den Mittelpunkt der aktuellen Domäne, begrenzt aber nach innen so,
// dass die eigentlichen Rohdaten (plus 5% Puffer) nie komplett aus dem Bild rutschen.
function applyZoomToDomain(domain, rawValues, zoomFactor) {
  if (domain[0] === null || zoomFactor === 1) return domain;
  const nums = rawValues.filter((v) => v !== null && v !== undefined && !isNaN(v));
  const center = (domain[0] + domain[1]) / 2;
  const autoHalfRange = (domain[1] - domain[0]) / 2;
  let minHalfRange = autoHalfRange * 0.15;
  if (nums.length > 0) {
    const dataMin = Math.min(...nums);
    const dataMax = Math.max(...nums);
    const dataHalfRange = ((dataMax - dataMin) / 2) * 1.05;
    if (dataHalfRange > 0) minHalfRange = Math.max(minHalfRange, dataHalfRange);
  }
  const targetHalfRange = Math.max(autoHalfRange * zoomFactor, minHalfRange);
  return [round1(center - targetHalfRange), round1(center + targetHalfRange)];
}

// Trendprognose: lineare Regression über die 7-Tage-geglätteten Werte der letzten 4 Wochen.
// Verlässlichkeits-Mindestanforderung: mind. MIN_TREND_MEASUREMENTS echte Messungen, die
// mind. MIN_TREND_SPAN_DAYS Tage auseinanderliegen (siehe Konstanten oben) — statt starr an der
// Anzahl geglätteter Tage zu hängen, wie es hier vorher der Fall war.
function computeLinearTrend(log, valueKey, targetValue) {
  if (log.length === 0) return { insufficientData: true };
  const today = new Date();
  today.setHours(0, 0, 0, 0);
  const windowDays = TREND_WINDOW_DAYS;
  const totalDays = windowDays + 7;
  const dailyMap = {};
  for (let i = totalDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const key = dateKeyFor(d);
    const entries = log.filter((w) => dateKeyFor(new Date(w.timestamp)) === key);
    dailyMap[key] = entries.length > 0 ? entries.reduce((s, w) => s + w[valueKey], 0) / entries.length : null;
  }
  function maFor(targetDate) {
    const vals = [];
    for (let i = 0; i < 7; i++) {
      const d = new Date(targetDate);
      d.setDate(d.getDate() - i);
      const v = dailyMap[dateKeyFor(d)];
      if (v !== null && v !== undefined) vals.push(v);
    }
    return vals.length > 0 ? vals.reduce((a, b) => a + b, 0) / vals.length : null;
  }

  // Verlässlichkeits-Check auf Basis der tatsächlichen (nicht geglätteten) Messungen im Fenster.
  const windowStart = new Date(today);
  windowStart.setDate(windowStart.getDate() - (windowDays - 1));
  const measuredDayKeys = new Set(
    log
      .map((w) => new Date(w.timestamp))
      .filter((d) => d >= windowStart && d <= today)
      .map((d) => dateKeyFor(d))
  );
  if (measuredDayKeys.size < MIN_TREND_MEASUREMENTS) return { insufficientData: true };
  const sortedKeys = [...measuredDayKeys].sort();
  const spanDays = Math.round((new Date(sortedKeys[sortedKeys.length - 1] + "T00:00:00") - new Date(sortedKeys[0] + "T00:00:00")) / 86400000);
  if (spanDays < MIN_TREND_SPAN_DAYS) return { insufficientData: true };

  const regressionPoints = [];
  for (let i = windowDays - 1; i >= 0; i--) {
    const d = new Date(today);
    d.setDate(d.getDate() - i);
    const ma = maFor(d);
    if (ma !== null) regressionPoints.push({ x: windowDays - 1 - i, y: ma });
  }
  if (regressionPoints.length === 0) return { insufficientData: true };

  const n = regressionPoints.length;
  const sumX = regressionPoints.reduce((s, p) => s + p.x, 0);
  const sumY = regressionPoints.reduce((s, p) => s + p.y, 0);
  const sumXY = regressionPoints.reduce((s, p) => s + p.x * p.y, 0);
  const sumX2 = regressionPoints.reduce((s, p) => s + p.x * p.x, 0);
  const denom = n * sumX2 - sumX * sumX;
  if (denom === 0) return { insufficientData: true };
  const slope = (n * sumXY - sumX * sumY) / denom;
  const intercept = (sumY - slope * sumX) / n;
  const todayX = windowDays - 1;
  const predictedToday = slope * todayX + intercept;
  const meaningfulSlope = Math.abs(slope) > 0.01 / 7;

  let targetDate = null;
  let daysToTarget = null;
  if (targetValue && meaningfulSlope) {
    const xTarget = (targetValue - intercept) / slope;
    const dt = Math.round(xTarget - todayX);
    if (dt > 0) {
      daysToTarget = dt;
      targetDate = new Date(today);
      targetDate.setDate(targetDate.getDate() + dt);
    }
  }

  let status;
  if (targetValue && Math.abs(predictedToday - targetValue) < 0.3) status = "reached";
  else if (!meaningfulSlope) status = "no_trend";
  else if (targetValue && daysToTarget === null) status = "wrong_direction";
  else status = "on_track";

  return {
    insufficientData: false,
    slope,
    slopePerWeek: round1(slope * 7),
    predictedToday: round1(predictedToday),
    targetDate,
    daysToTarget,
    status,
  };
}
function computeWeightTrend(weightLog, targetWeightKg) {
  return computeLinearTrend(weightLog, "weightKg", targetWeightKg);
}
function computeWaistTrend(waistLog, targetWaistCm) {
  return computeLinearTrend(waistLog, "waistCm", targetWaistCm);
}

// Kategorien für Lebensmittel — "Obst"/"Gemüse" und "Kohlenhydrat" (klassische Sattmacher-Beilagen
// wie Reis, Nudeln, Kartoffeln) steuern das Verhalten im Sattmacher-Modus, die übrigen sind reine
// Zusatzinfo für die Datenbank.
const FOOD_CATEGORIES = ["Obst", "Gemüse", "Kohlenhydrat", "Fleisch", "Fisch", "Milchprodukt", "Fett/Öl", "Süßes/Snack", "Getränk", "Sonstiges"];

// Feste, themenunabhängige Diagrammfarben, damit sich Kurven auch im
// Pastellrosa-Thema klar voneinander unterscheiden.

// ---------- Alltagseinheiten (Rezeptbaukasten) & Flüssigkeitseinheiten ----------
// Generischer Fallback in Gramm, falls ein Lebensmittel keine eigene units-Angabe hat.
// Richtwerte für gestrichene Löffel bei "durchschnittlicher" Dichte; bewusst grobe Näherung.
const UNIT_DEFAULTS_G = { TL: 5, EL: 15, Tasse: 200, Prise: 0.5, Scheibe: 25, Stück: 100 };
const RECIPE_UNITS = ["g", "ml", "l", "TL", "EL", "Tasse", "Prise", "Scheibe", "Stück"];
// Rechnet eine Menge in einer beliebigen Einheit in Gramm um. Für ml/l wird vereinfachend
// 1 ml = 1 g angenommen (siehe Recherche: gilt gut für wässrige Lebensmittel/Getränke, bei sehr
// fett- oder zuckerreichen Flüssigkeiten leichte Abweichung, bewusst in Kauf genommen).
function resolveAmountToGrams(food, amount, unit) {
  const amt = Number(amount) || 0;
  if (unit === "g" || unit === "ml") return amt;
  if (unit === "l") return amt * 1000;
  const perUnit = (food && food.units && food.units[unit] !== undefined) ? food.units[unit] : UNIT_DEFAULTS_G[unit];
  return amt * (perUnit || 0);
}

// Liefert Fisher-Yates-gemischte Indizes einer Länge n (für die Rotation ohne Wiederholung).
function shuffledFactIndices(n) {
  const arr = Array.from({ length: n }, (_, i) => i);
  for (let i = arr.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    const tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
  }
  return arr;
}
// Ein Fakt pro Tag, persistiert über eine gemischte Reihenfolge + Zeiger. Erst wenn alle Fakten
// einmal dran waren, wird neu gemischt — so wiederholt sich innerhalb eines Zyklus nichts.
function getDailyFact(resetMinutes) {
  const todayKey = effectiveTodayKey(resetMinutes);
  let order = null, pointer = 0, lastDay = null;
  const res = storageGet("dailyFactState");
  if (res && res.value) {
    try {
      const parsed = JSON.parse(res.value);
      order = Array.isArray(parsed.order) ? parsed.order : null;
      pointer = Number(parsed.pointer) || 0;
      lastDay = parsed.lastDay || null;
    } catch (e) {}
  }
  if (!order || order.length !== NUTRITION_FACTS.length) {
    order = shuffledFactIndices(NUTRITION_FACTS.length);
    pointer = 0;
    lastDay = null;
  }
  if (lastDay === null) {
    lastDay = todayKey;
    storageSet("dailyFactState", JSON.stringify({ order, pointer, lastDay }));
  } else if (lastDay !== todayKey) {
    pointer += 1;
    if (pointer >= order.length) {
      order = shuffledFactIndices(NUTRITION_FACTS.length);
      pointer = 0;
    }
    lastDay = todayKey;
    storageSet("dailyFactState", JSON.stringify({ order, pointer, lastDay }));
  }
  return NUTRITION_FACTS[order[pointer]];
}

  // Beim Umschalten des Sattmacher-Modus (an oder aus) werden die HEUTIGEN Einträge einmalig mit

  const bothSizesShown = showWeightLine && waistEnabled && showWaistLine;
  const weightRawValues = weightChartData.flatMap((d) => [d.weightKg, d.weightMA]);

  const sportDurationHours = (Number(sportHours) || 0) + (Number(sportMinutes) || 0) / 60;

  const todayMacro = computeMacroBreakdown(entries);

  useEffect(() => {

  useEffect(() => {

    const days = [];
    for (let i = 0; i < 7; i++) {

      const label = d.toLocaleDateString("de-DE", { weekday: "short" });

          const dayUsed = list.reduce((s, e) => s + e.points, 0);
          const baseTarget = (!Array.isArray(parsed) && parsed.target) || null;
          const sportBonusDay = (!Array.isArray(parsed) && parsed.sport && parsed.sport.done) ? Number(parsed.sport.bonusPoints) || 0 : 0;
          days.push({ key, label, used: dayUsed, target: baseTarget !== null ? baseTarget + sportBonusDay : null });

          days.push({ key, label, used: null, target: null });

  useEffect(() => {
    if (!loaded) return;
    setWeightChartLoading(true);
    let points = [];

    if (weightViewMode === "monat") {
      const year = weightViewMonth.getFullYear();
      const month = weightViewMonth.getMonth();
      const daysInMonth = new Date(year, month + 1, 0).getDate();

      const dailyWeightMap = {};
      const dailyWaistMap = {};
      const extendedStart = new Date(year, month, 1 - 7);
      const extendedEnd = new Date(year, month, daysInMonth);
      for (let d = new Date(extendedStart); d <= extendedEnd; d.setDate(d.getDate() + 1)) {
        const key = dateKeyFor(d);
        const dayEntries = weightLog.filter((w) => dateKeyFor(new Date(w.timestamp)) === key);
        dailyWeightMap[key] = dayEntries.length > 0 ? round1(dayEntries.reduce((s, w) => s + w.weightKg, 0) / dayEntries.length) : null;
        const waistEntries = waistLog.filter((w) => dateKeyFor(new Date(w.timestamp)) === key);
        dailyWaistMap[key] = waistEntries.length > 0 ? round1(waistEntries.reduce((s, w) => s + w.waistCm, 0) / waistEntries.length) : null;
      }
      function movingAverageFromMap(map, targetDate) {
        const vals = [];
        for (let i = 0; i < 7; i++) {
          const d = new Date(targetDate);
          d.setDate(d.getDate() - i);
          const v = map[dateKeyFor(d)];
          if (v !== null && v !== undefined) vals.push(v);
        }
        return vals.length > 0 ? round1(vals.reduce((a, b) => a + b, 0) / vals.length) : null;
      }

      const now1 = new Date();
      now1.setHours(0, 0, 0, 0);
      const isThisMonth = year === now1.getFullYear() && month === now1.getMonth();
      const trendStopDate =
        trend && !trend.insufficientData && trend.targetDate && trend.status === "on_track"
          ? trend.targetDate
          : new Date(year, month + 1, 0);
      const waistTrendStopDate =
        waistTrend && !waistTrend.insufficientData && waistTrend.targetDate && waistTrend.status === "on_track"
          ? waistTrend.targetDate
          : new Date(year, month + 1, 0);

      for (let day = 1; day <= daysInMonth; day++) {
        const d = new Date(year, month, day);
        const key = dateKeyFor(d);
        const weightKg = dailyWeightMap[key];
        const weightMA = d <= now1 ? movingAverageFromMap(dailyWeightMap, d) : null;
        const waistCm = dailyWaistMap[key];
        const waistMA = d <= now1 ? movingAverageFromMap(dailyWaistMap, d) : null;
        let weightTrendLine = null;
        if (isThisMonth && trend && !trend.insufficientData && d >= now1 && d <= trendStopDate) {
          const diffDays = Math.round((d - now1) / 86400000);
          weightTrendLine = round1(trend.predictedToday + trend.slope * diffDays);
        }
        let waistTrendLine = null;
        if (isThisMonth && waistTrend && !waistTrend.insufficientData && d >= now1 && d <= waistTrendStopDate) {
          const diffDays = Math.round((d - now1) / 86400000);
          waistTrendLine = round1(waistTrend.predictedToday + waistTrend.slope * diffDays);
        }
        let pointsUsed = null;
        let dayEffectiveTarget = null;
        if (key === effectiveTodayKey(profile.dayResetMinutes || 0)) {
          // Ohne echte Einträge zählt der Tag als "keine Daten", nicht als 0 Punkte verbraucht —
          // sonst würde z.B. testweises Eintragen+Löschen einen echten (Null-)Datenpunkt erzeugen
          // und die Grafik verzacken, obwohl an diesem Tag eigentlich (noch) nichts passiert ist.
          if (entries.length > 0) {
            pointsUsed = used;
            dayEffectiveTarget = effectiveTarget;
          }
        } else {
          const res = storageGet(`log:${key}`);
          if (res && res.value) {
            try {
              const parsed = JSON.parse(res.value);
              const list = Array.isArray(parsed) ? parsed : parsed.entries || [];
              if (list.length > 0) {
                pointsUsed = list.reduce((s, e) => s + e.points, 0);
                const baseTarget = !Array.isArray(parsed) ? parsed.target : null;
                const sportBonusDay = !Array.isArray(parsed) && parsed.sport && parsed.sport.done ? Number(parsed.sport.bonusPoints) || 0 : 0;
                dayEffectiveTarget = baseTarget !== null ? baseTarget + sportBonusDay : null;
              }
            } catch (e) {}
          }
        }
        const deficitPercent = pointsUsed !== null && dayEffectiveTarget ? round1(((dayEffectiveTarget - pointsUsed) / dayEffectiveTarget) * 100) : null;
        points.push({ date: key, label: String(day), weightKg, weightMA, waistCm, waistMA, weightTrendLine, waistTrendLine, pointsUsed, deficitPercent });
      }
    } else {
      const year = weightViewYear;
      const now1 = new Date();
      now1.setHours(0, 0, 0, 0);
      const isThisYear = year === now1.getFullYear();
      const trendStopMonth =
        trend && !trend.insufficientData && trend.targetDate && trend.status === "on_track" && trend.targetDate.getFullYear() === year
          ? trend.targetDate.getMonth()
          : 11;
      const waistTrendStopMonth =
        waistTrend && !waistTrend.insufficientData && waistTrend.targetDate && waistTrend.status === "on_track" && waistTrend.targetDate.getFullYear() === year
          ? waistTrend.targetDate.getMonth()
          : 11;

      for (let month = 0; month < 12; month++) {
        const monthStart = new Date(year, month, 1);
        const daysInMonth = new Date(year, month + 1, 0).getDate();
        const monthEntries = weightLog.filter((w) => {
          const wd = new Date(w.timestamp);
          return wd.getFullYear() === year && wd.getMonth() === month;
        });
        const weightKg = monthEntries.length > 0 ? round1(monthEntries.reduce((s, w) => s + w.weightKg, 0) / monthEntries.length) : null;
        const monthWaistEntries = waistLog.filter((w) => {
          const wd = new Date(w.timestamp);
          return wd.getFullYear() === year && wd.getMonth() === month;
        });
        const waistCm = monthWaistEntries.length > 0 ? round1(monthWaistEntries.reduce((s, w) => s + w.waistCm, 0) / monthWaistEntries.length) : null;

        let weightTrendLine = null;
        if (isThisYear && trend && !trend.insufficientData && month >= now1.getMonth() && month <= trendStopMonth) {
          const midMonth = new Date(year, month, 15);
          const diffDays = Math.round((midMonth - now1) / 86400000);
          weightTrendLine = round1(trend.predictedToday + trend.slope * diffDays);
        }

      calories = Math.round(calories100 * factor);
      fat = round1(fat100 * factor);
      protein = round1(protein100 * factor);
      fiber = round1(fiber100 * factor);
      carbsForEntry = carbs100 !== null ? round1(carbs100 * factor) : null;

      setCustomFoods((prev) => {
        const idx = prev.findIndex((f) => f.name.toLowerCase() === form.name.trim().toLowerCase());
        const newFood = { id: idx >= 0 ? prev[idx].id : Date.now() + 2, name: form.name.trim(), calories: calories100, fat: fat100, protein: protein100, fiber: fiber100, category: form.category || undefined };
        if (idx >= 0) { const copy = [...prev]; copy[idx] = newFood; return copy; }
        return [...prev, newFood];
      });
    }

    const selectedFoodForPoints = form.selectedFoodId ? combinedFoods.find((f) => f.id === form.selectedFoodId) : null;
    const entryCategory = selectedFoodForPoints ? selectedFoodForPoints.category : form.category;
    const entryExempt = selectedFoodForPoints ? !!selectedFoodForPoints.sattmacherExempt : false;
    const isRecipeEntry = !!(selectedFoodForPoints && selectedFoodForPoints.isRecipe);
    // Für Rezepte wird ein bereits auf die verzehrte Menge skalierter Zutaten-Snapshot mitgespeichert
    // (nicht nur Name/Kategorie des Gesamt-"Lebensmittels") — nur so lässt sich die Punktzahl später
    // beim Umschalten des Sattmacher-Modus zutatengenau neu berechnen, statt verloren zu gehen.
    let recipeSnapshot = null;
    if (isRecipeEntry && selectedFoodForPoints.recipeIngredients && selectedFoodForPoints.recipeTotalG) {
      const consumedG = Number(form.amountG) || 0;
      const fraction = consumedG / selectedFoodForPoints.recipeTotalG;
      recipeSnapshot = {
        recipeTotalG: consumedG,
        recipeIngredients: selectedFoodForPoints.recipeIngredients.map((ing) => ({ ...ing, amountG: (ing.amountG || 0) * fraction })),
      };
    }
    const points = isRecipeEntry
      ? calcRecipePoints(selectedFoodForPoints, Number(form.amountG) || 0, matrix, profile.sattmacherMode)
      : calcFoodPointsWithMode({ calories, fat, protein, fiber }, matrix, profile.sattmacherMode, entryCategory, entryExempt);
    const entryData = {
      name: form.name.trim(), calories, carbs: carbsForEntry, fat, protein, fiber,
      calcBasis: form.selectedFoodId ? "kalorien" : nutrientBasis, points,
      category: isRecipeEntry ? undefined : entryCategory,
      sattmacherExempt: isRecipeEntry ? undefined : entryExempt,
      recipeSnapshot,
      amountG: Number(form.amountG) || 100,
    };
    if (formTargetDay && formTargetDay !== effectiveTodayKey(profile.dayResetMinutes || 0)) {
      const entryWithId = editingEntryId ? { ...entryData, id: editingEntryId } : { ...entryData, id: Date.now() };
      setExpandedDayEntries((prev) => {
        const updated = editingEntryId ? prev.map((e) => (e.id === editingEntryId ? entryWithId : e)) : [...prev, entryWithId];
        persistDayEntries(formTargetDay, updated);
        return updated;
      });
    } else if (editingEntryId) {
      setEntries((prev) => prev.map((e) => (e.id === editingEntryId ? { ...entryData, id: editingEntryId } : e)));
    } else {
      setEntries((prev) => [...prev, { id: Date.now(), ...entryData }]);
    }
    closeForm();
  }

  function startEditEntry(entry, dayKey = null) {
    setEditingEntryId(entry.id);
    setFormTargetDay(dayKey);
    if (entry.isDirect) {
      setFormMode("punkte");
      setPointForm({ name: entry.name, points: String(entry.points), selectedDishId: null });
      setDishSearchQuery("");
    } else {
      setFormMode("naehrwerte");
      const basis = entry.calcBasis === "kohlenhydrate" ? "kohlenhydrate" : "kalorien";
      setNutrientBasis(basis);
      // Ein Eintrag speichert die GESAMTWERTE für die tatsächlich verzehrte Menge, das Formular
      // arbeitet aber mit Werten je 100g + separater Menge. Beim erneuten Öffnen müssen die
      // Gesamtwerte daher auf je 100g zurückgerechnet werden — sonst zeigt das Formular plötzlich
      // ganz andere Zahlen als ursprünglich eingetragen, und ein Ändern der Menge würde die Werte
      // zusätzlich falsch (doppelt) skalieren.
      const amountG = Number(entry.amountG) || 100;
      const factor = amountG / 100;
      setForm({
        ...EMPTY_FORM,
        name: entry.name,
        amountG: amountG,
        selectedFoodId: null,
        category: entry.category || "",
        calories: basis === "kalorien" ? String(round1((Number(entry.calories) || 0) / factor)) : "",
        carbs: basis === "kohlenhydrate" ? String(round1((Number(entry.carbs) || 0) / factor)) : "",
        fat: String(round1((Number(entry.fat) || 0) / factor)),
        protein: String(round1((Number(entry.protein) || 0) / factor)),
        fiber: String(round1((Number(entry.fiber) || 0) / factor)),
      });
      setSearchQuery("");
    }
    setShowForm(true);
  }

  function startAddForDay(dayKey) {
    resetForm();
    resetPointForm();
    setEditingEntryId(null);
    setFormTargetDay(dayKey);
    setShowForm(true);
  }

  function handleBarcodeDetected(result) {
    const code = result && result.codeResult ? result.codeResult.code : null;
    if (!code) return;
    try { Quagga.offDetected(handleBarcodeDetected); Quagga.stop(); } catch (e) {}
    setScanStatus("looking-up");
    fetch(`https://world.openfoodfacts.org/api/v2/product/${code}.json?fields=product_name,nutriments`)
      .then((res) => res.json())
      .then((json) => {
        if (!json || json.status !== 1 || !json.product) {
          setScanStatus("notfound");
          return;
        }
        const n = json.product.nutriments || {};
        const name = json.product.product_name || `Produkt ${code}`;
        setFormMode("naehrwerte");
        setNutrientBasis("kalorien");
        setForm({
          ...EMPTY_FORM,
          name,
          amountG: 100,
          selectedFoodId: null,
          calories: String(Math.round(n["energy-kcal_100g"] || 0)),
          fat: String(round1(n["fat_100g"] || 0)),
          protein: String(round1(n["proteins_100g"] || 0)),
          fiber: String(round1(n["fiber_100g"] || 0)),
        });
        setSearchQuery("");
        setShowForm(true);
        setShowScanner(false);
        setScanStatus(null);
      })
      .catch(() => setScanStatus("error"));
  }

  function startScanner() {
    if (typeof Quagga === "undefined") { setScanStatus("error"); setShowScanner(true); return; }
    setShowScanner(true);
    setScanStatus("scanning");
    setTimeout(() => {
      if (!scannerContainerRef.current) return;
      Quagga.init(
        {
          inputStream: { type: "LiveStream", target: scannerContainerRef.current, constraints: { facingMode: "environment" } },
          decoder: { readers: ["ean_reader", "upc_reader", "upc_e_reader"] },
          locate: true,
        },
        (err) => {
          if (err) { setScanStatus("error"); return; }
          Quagga.start();
        }
      );
      Quagga.onDetected(handleBarcodeDetected);
    }, 150);
  }

  function stopScanner() {
    try { Quagga.offDetected(handleBarcodeDetected); Quagga.stop(); } catch (e) {}
    setShowScanner(false);
    setScanStatus(null);
  }

  function selectDish(dish) {

  function addDirectEntry() {

    const entryData = { name: dishName, points: pts, isDirect: true };

      setExpandedDayEntries((prev) => {

  function showUndoToast(message, restoreFn) {

  function toggleHistoryDay(dayKey, isToday) {
    if (expandedHistoryDay === dayKey) { setExpandedHistoryDay(null); return; }
    setExpandedHistoryDay(dayKey);
    if (isToday) {
      setExpandedDayEntries(entries);
      setExpandedDayMeta({ baseTarget: target.total, sport: { done: sportDone, bonusPoints: sportBonus, caloriesBurned } });
      return;
    }
    setExpandedDayLoading(true);
    const res = storageGet(`log:${dayKey}`);
    if (res && res.value) {
      try {
        const parsed = JSON.parse(res.value);
        setExpandedDayEntries(Array.isArray(parsed) ? parsed : parsed.entries || []);
        setExpandedDayMeta(Array.isArray(parsed) ? null : { baseTarget: parsed.target ?? null, sport: parsed.sport || null });
      } catch (e) {
        setExpandedDayEntries([]);
        setExpandedDayMeta(null);
      }
    } else {
      setExpandedDayEntries([]);
      setExpandedDayMeta(null);
    }
    setExpandedDayLoading(false);
  }

  function deleteExpandedDayEntry(entryId) {
    if (expandedHistoryDay === effectiveTodayKey(profile.dayResetMinutes || 0)) { deleteEntry(entryId); return; }
    const item = expandedDayEntries.find((e) => e.id === entryId);
    const updated = expandedDayEntries.filter((e) => e.id !== entryId);
    setExpandedDayEntries(updated);
    const dayKeyAtCall = expandedHistoryDay;
    persistDayEntries(dayKeyAtCall, updated);
    if (item) {
      showUndoToast("Eintrag gelöscht", () => {
        setExpandedDayEntries((prev) => {
          const restored = [...prev, item];
          persistDayEntries(dayKeyAtCall, restored);
          return restored;
        });
      });
    }
  }

  // ---------- Eigenes Lebensmittel anlegen/bearbeiten (nur einfache Lebensmittel, keine Rezepte —

  // ---------- Rezept-Baukasten ----------
  function selectRecipeIngredient(food) {
    setRecipeIngredientSelected(food);
    setRecipeIngredientQuery(food.name);
    setRecipeIngredientDropdownOpen(false);
  }
  // Erlaubt, eine im Rezeptbaukasten nicht gefundene Zutat direkt an Ort und Stelle anzulegen,
  // statt den Baukasten verlassen zu müssen. Landet dauerhaft in "Eigene Lebensmittel".
  function openInlineNewIngredient() {
    setInlineNewFood({ name: recipeIngredientQuery.trim(), calories: "", fat: "", protein: "", fiber: "", category: "" });
    setShowInlineNewFood(true);
  }
  function cancelInlineNewIngredient() {
    setShowInlineNewFood(false);
  }
  function saveInlineNewIngredient() {
    if (!inlineNewFood.name.trim()) return;
    const newFood = {
      id: Date.now(),
      name: inlineNewFood.name.trim(),
      calories: Number(inlineNewFood.calories) || 0,
      fat: Number(inlineNewFood.fat) || 0,
      protein: Number(inlineNewFood.protein) || 0,
      fiber: Number(inlineNewFood.fiber) || 0,
      category: inlineNewFood.category || undefined,
    };
    setCustomFoods((prev) => [newFood, ...prev]);
    selectRecipeIngredient(newFood);
    setShowInlineNewFood(false);
  }
  function addRecipeIngredient() {
    if (!recipeIngredientSelected || !recipeIngredientAmount || recipeIngredientAmount <= 0) return;
    const amountG = resolveAmountToGrams(recipeIngredientSelected, recipeIngredientAmount, recipeIngredientUnit);
    if (!amountG || amountG <= 0) return;
    setRecipeIngredients((prev) => [
      ...prev,
      {
        tempId: Date.now(), foodId: recipeIngredientSelected.id, name: recipeIngredientSelected.name,
        amount: recipeIngredientAmount, unit: recipeIngredientUnit, amountG: round1(amountG),
        calories100: recipeIngredientSelected.calories, fat100: recipeIngredientSelected.fat, protein100: recipeIngredientSelected.protein, fiber100: recipeIngredientSelected.fiber,
        category: recipeIngredientSelected.category, sattmacherExempt: !!recipeIngredientSelected.sattmacherExempt,
      },
    ]);
    setRecipeIngredientSelected(null);
    setRecipeIngredientQuery("");
    setRecipeIngredientAmount(100);
    setRecipeIngredientUnit("g");
  }
  function removeRecipeIngredient(tempId) {
    setRecipeIngredients((prev) => prev.filter((i) => i.tempId !== tempId));
  }
  function updateRecipeIngredientAmount(tempId, newAmountG) {
    setRecipeIngredients((prev) => prev.map((i) => (i.tempId === tempId ? { ...i, amountG: newAmountG } : i)));
  }
  const recipeTotals = recipeIngredients.reduce(
    (acc, i) => {
      const factor = (Number(i.amountG) || 0) / 100;
      return {
        totalG: acc.totalG + (Number(i.amountG) || 0),
        calories: acc.calories + i.calories100 * factor,
        fat: acc.fat + i.fat100 * factor,
        protein: acc.protein + i.protein100 * factor,
        fiber: acc.fiber + i.fiber100 * factor,
      };
    },
    { totalG: 0, calories: 0, fat: 0, protein: 0, fiber: 0 }
  );
  function resetRecipeBuilder() {
    setRecipeIngredients([]);
    setRecipeName("");
    setRecipeServings(1);
    setRecipeIngredientQuery("");
    setRecipeIngredientSelected(null);
    setRecipeIngredientAmount(100);
    setRecipeIngredientUnit("g");
  }
  function buildRecipeFood() {
    const servings = Math.max(1, Number(recipeServings) || 1);
    const factor100 = 100 / recipeTotals.totalG;
    return {
      id: Date.now(),
      name: recipeName.trim(),
      calories: round1(recipeTotals.calories * factor100),
      fat: round1(recipeTotals.fat * factor100),
      protein: round1(recipeTotals.protein * factor100),
      fiber: round1(recipeTotals.fiber * factor100),
      isRecipe: true,
      recipeIngredients: recipeIngredients.map((i) => ({
        name: i.name, amountG: i.amountG, amount: i.amount, unit: i.unit,
        calories100: i.calories100, fat100: i.fat100, protein100: i.protein100, fiber100: i.fiber100,
        category: i.category, sattmacherExempt: !!i.sattmacherExempt,
      })),
      recipeTotalG: round1(recipeTotals.totalG),
      recipeServings: servings,
      recipeServingG: round1(recipeTotals.totalG / servings),
    };
  }
  function saveRecipe() {
    if (!recipeName.trim() || recipeIngredients.length === 0 || recipeTotals.totalG <= 0) return;
    const newFood = buildRecipeFood();
    setCustomFoods((prev) => [newFood, ...prev]);
    resetRecipeBuilder();
  }
  // Speichert das Rezept als eigenes Lebensmittel UND trägt direkt eine Portion als Eintrag ein —
  // für den Rezeptbaukasten-Zugriff direkt beim Essen-Eintragen im Heute-Bereich.
  function saveRecipeAndLog() {
    if (!recipeName.trim() || recipeIngredients.length === 0 || recipeTotals.totalG <= 0) return;
    const newFood = buildRecipeFood();
    setCustomFoods((prev) => [newFood, ...prev]);
    const factor = newFood.recipeServingG / 100;
    const calories = Math.round(newFood.calories * factor);
    const fat = round1(newFood.fat * factor);
    const protein = round1(newFood.protein * factor);
    const fiber = round1(newFood.fiber * factor);
    const points = calcRecipePoints(newFood, newFood.recipeServingG, matrix, profile.sattmacherMode);
    const recipeSnapshot = {
      recipeTotalG: newFood.recipeServingG,
      recipeIngredients: newFood.recipeIngredients.map((ing) => ({ ...ing, amountG: (ing.amountG || 0) * (newFood.recipeServingG / newFood.recipeTotalG) })),
    };
    const entryData = { name: newFood.name, calories, carbs: null, fat, protein, fiber, calcBasis: "kalorien", points, recipeSnapshot };
    if (formTargetDay && formTargetDay !== effectiveTodayKey(profile.dayResetMinutes || 0)) {
      const entryWithId = { ...entryData, id: Date.now() + 1 };
      setExpandedDayEntries((prev) => {
        const updated = [...prev, entryWithId];
        persistDayEntries(formTargetDay, updated);
        return updated;
      });
    } else {
      setEntries((prev) => [...prev, { id: Date.now() + 1, ...entryData }]);
    }
    closeForm();
  }

  const recipeIngredientResults =
    recipeIngredientQuery.trim().length > 0 && !recipeIngredientSelected
      ? fuzzySearch(recipeIngredientQuery, combinedFoods, 6)
      : [];

  }
  function startEditWaist(w) { setEditingWaistId(w.id); setEditWaistValue(String(w.waistCm)); }
  function saveWaistEdit(id) {

    if (val > 0) setWaistLog((prev) => prev.map((w) => (w.id === id ? { ...w, waistCm: val } : w)));

  function startAddWeightForDay(dayKey) { setAddingWeightDayKey(dayKey); setAddWeightDayValue(""); }
  function saveAddWeightForDay(dayKey) {

      if (dayKey === todayKey()) setProfile((prev) => ({ ...prev, waistCm: val }));

    setAddingWaistDayKey(null);
  }
  function findWeightEntryForDay(dayKey) {
    const matches = weightLog.filter((w) => dateKeyFor(new Date(w.timestamp)) === dayKey);
    return matches.length > 0 ? matches[matches.length - 1] : null;
  }
  function findWaistEntryForDay(dayKey) {
    const matches = waistLog.filter((w) => dateKeyFor(new Date(w.timestamp)) === dayKey);
    return matches.length > 0 ? matches[matches.length - 1] : null;
  }
  function shiftWeightView(delta) {
    if (weightViewMode === "monat") {
      setWeightViewMonth((m) => { const d = new Date(m); d.setMonth(d.getMonth() + delta); return d; });
    } else {

  function exportBackup() {
    setBackupMessage("");
    try {
      const keys = storageListKeys();
      const data = {};
      keys.forEach((k) => {
        const r = storageGet(k);
        if (r && r.value !== undefined) data[k] = r.value;
      });
      const payload = { exportedAt: new Date().toISOString(), app: "punktetagebuch", data };
      const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });

            </div>
            <div className="npt-tour-actions">
              <button className="npt-btn-secondary" onClick={endTour}>Beenden</button>
              <div style={{ display: "flex", gap: 8 }}>
                {tourStep > 0 && <button className="npt-btn-secondary" onClick={prevTourStep}>‹ Zurück</button>}
                <button className="npt-btn-primary" onClick={nextTourStep}>{tourStep === TOUR_STEPS.length - 1 ? "Fertig" : "Weiter ›"}</button>
              </div>
            </div>
          </div>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<NutritionPointsTracker />);
</script>

<script>
  // Service Worker nur registrieren, wenn über https:// (oder localhost)
  // aufgerufen — genau wie beim Kamera-Scan ist das eine Voraussetzung des
  // Browsers, kein Bug. Als lokale file:// -Datei greift das nicht, dort
  // läuft die App aber ohnehin nur eingeschränkt (siehe Kamera-Scan-Hinweis).
  if ("serviceWorker" in navigator) {
    window.addEventListener("load", () => {
      navigator.serviceWorker.register("sw.js").catch(() => {});
    });
  }
</script>
</body>
</html>
